<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學尋寶・古鎮奇遇</title><style>
*{box-sizing:border-box}body{margin:0;background:#272d27;color:#46372a;font:17px system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer;border:1px solid #9f8151;border-radius:9px;background:#f7e8bf;color:#493821;padding:9px 15px;font-weight:700;touch-action:manipulation}button:focus-visible{outline:3px solid #cf702e}button:disabled{opacity:.5}#app{width:min(100%,177.777dvh);height:min(100dvh,56.25vw);margin:auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:#eadcbb;padding:8px;gap:6px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(18px,2.5vw,36px);margin:0}#start,#result{position:fixed;inset:0;z-index:10;background:#202c28ed;display:grid;place-items:center;padding:12px}#start>div,#result>div{background:#f6e9c9;border:3px double #a48a52;padding:clamp(16px,3vw,40px);border-radius:14px;width:min(680px,100%);max-height:95dvh;overflow:auto}label{display:block;margin:10px 0}select{max-width:100%;padding:8px;background:#fff5dc;border:1px solid #9b825e}#inventory{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}#inventory span{background:#f7edce;border:1px solid #ad9160;border-radius:6px;padding:4px 12px}#inventory .found{background:#a9c49a;color:#28462e}#scene{position:relative;min-height:0;overflow:hidden;border:2px solid #947d54;border-radius:10px;background:#9cb8ae}#scene svg{width:100%;height:100%;display:block}.target{cursor:pointer;outline:none}.target:focus .seal{stroke:#c55a2a;stroke-width:4}.target.found{opacity:.25;pointer-events:none}.target.hint .seal{stroke:#ffde55;stroke-width:7;animation:pulse 1s infinite}@keyframes pulse{50%{stroke:#c56528}}#question{display:flex;align-items:center;gap:12px;justify-content:center;background:#fff0cc;border:1px solid #a98d58;border-radius:8px;padding:8px;flex-wrap:wrap}#q{font-size:clamp(19px,2.2vw,34px);font-weight:800}#feedback{min-width:100px;font-weight:700}#tip{font-size:14px}#zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:5px} [hidden]{display:none!important}@media(orientation:portrait){#app{width:100%;height:100dvh;grid-template-rows:auto auto minmax(0,1fr) auto}#scene svg{object-fit:contain}#inventory span{padding:4px 6px;font-size:13px}#question{gap:6px}}@media(max-height:500px) and (orientation:landscape){#app{padding:3px;gap:3px}button{padding:4px 8px}#inventory span{font-size:12px;padding:2px 8px}#question{padding:3px;font-size:13px}#q{font-size:20px}}
</style></head><body><main id="app"><header><h1>數學尋寶・江南水鄉</h1><span id="stats"></span><button id="sound">配樂 關</button><button id="home">首頁</button></header><div id="inventory"></div><div id="scene"><svg id="map" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="river" x2="1" y2="1"><stop stop-color="#9abeb1"/><stop offset="1" stop-color="#507f82"/></linearGradient><linearGradient id="land" x2="0" y2="1"><stop stop-color="#e7ddbe"/><stop offset="1" stop-color="#bbb298"/></linearGradient><pattern id="stone" width="72" height="38" patternUnits="userSpaceOnUse"><rect width="72" height="38" fill="#c5c0a9"/><path d="M0 0H72M0 38H72M36 0V38" stroke="#8e9387" stroke-width="1.5"/></pattern><pattern id="roof" width="19" height="14" patternUnits="userSpaceOnUse"><rect width="19" height="14" fill="#46534e"/><path d="M0 0Q10 8 19 0M0 14Q10 6 19 14" fill="none" stroke="#788078" stroke-width="2"/></pattern></defs><rect width="1200" height="650" fill="url(#land)"/><path d="M380 -30Q540 150 495 300T790 680H390Q160 440 285 280T170 -30Z" fill="url(#river)" stroke="#849c8b" stroke-width="9"/><g id="ripples"></g><path d="M10 390L250 345L340 650H0ZM730 0H1200V650H800L660 440L700 230Z" fill="url(#stone)" opacity=".85"/><g id="houses"></g><g transform="translate(295 300) rotate(-13)"><path d="M0 65Q140 -35 310 40L310 85Q140 10 0 110Z" fill="#b18e60" stroke="#6e573e" stroke-width="5"/><path d="M0 55Q140 -45 310 30M0 95Q140 -5 310 70" fill="none" stroke="#796044" stroke-width="6"/><g id="rails"></g></g><g id="scenery"></g><g id="objects"></g></svg><div id="zoom"><button id="zoomIn">放大 ＋</button><button id="zoomOut">復位</button></div></div><div id="question"><span>尋寶線索</span><span id="q"></span><span id="feedback" aria-live="polite"></span><button id="hint">提示</button></div></main><section id="start"><div><small>第17款・第一關試作 V0.1</small><h1>數學尋寶・古鎮奇遇</h1><p>沿著河岸、茶樓與市集尋找六件寶物。先解數學題，再點選場景中帶有正確數字的物件。</p><label>課程 <select id="unit"><option value="exp">指數律</option><option value="signed">正負數四則</option><option value="eq">一元一次方程式</option><option value="fraction">分數四則</option><option value="gcd">最大公因數與最小公倍數</option><option value="system">二元一次聯立方程式</option></select></label><label>難度 <select id="level"><option>初階</option><option>進階</option><option>挑戰</option></select></label><button id="begin">開始尋寶</button><p id="tip">第一關六題，答錯不扣生命。提示會標示正確物品。</p></div></section><section id="result" hidden><div><h1>尋寶成功！</h1><p id="summary"></p><button id="again">再挑戰</button><button id="back">返回首頁</button></div></section><script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';function node(tag,attrs,parent){let e=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}function art(p,s){p.innerHTML=s}
for(let i=0;i<34;i++){let y=i*21,x=355+Math.sin(i*.4)*65+i*3;node('path',{d:'M'+x+' '+y+'q32 -6 64 0',stroke:'#d1e1ce','stroke-width':2,opacity:.42,fill:'none'},$('ripples'))}
function house(x,y,w,h,label){let p=node('g',{transform:'translate('+x+' '+y+')'},$('houses'));art(p,'<path d="M0 40L'+w+' 40V'+h+'H0Z" fill="#e8dfc6" stroke="#8e8975" stroke-width="3"/><path d="M-20 42Q0 21 22 0H'+(w-22)+'Q'+w+' 21 '+(w+20)+' 42L'+(w+8)+' 65H-8Z" fill="url(#roof)" stroke="#39463f" stroke-width="4"/><rect x="20" y="74" width="55" height="'+(h-74)+'" fill="#615548"/><rect x="'+(w-70)+'" y="80" width="45" height="49" fill="#73604e" stroke="#9e8967" stroke-width="5"/><path d="M'+(w-48)+' 80v49M'+(w-70)+' 105h45" stroke="#b6a381" stroke-width="2"/><rect x="82" y="72" width="40" height="66" rx="2" fill="#d3b581"/><text x="102" y="98" text-anchor="middle" font-size="23" fill="#473b2b">'+label+'</text>')}
house(35,25,180,175,'茶');house(745,12,210,180,'酒');house(985,32,170,170,'米');house(25,420,180,210,'布');house(995,430,180,200,'食');
for(let i=0;i<8;i++)node('path',{d:'M'+(i*40)+' '+(57-35*Math.sin(i/7*Math.PI))+'v45',stroke:'#765c40','stroke-width':7},$('rails'));
for(let i=0;i<22;i++){let x=(i*137+80)%1200,y=(i*83+130)%650;if(x>240&&x<700)continue;let p=node('g',{transform:'translate('+x+' '+y+')'},$('scenery'));art(p,'<ellipse cy="12" rx="18" ry="6" fill="#534d3c" opacity=".2"/><path d="M0 10V-18" stroke="#776044" stroke-width="6"/><ellipse cy="-25" rx="22" ry="19" fill="#6c8054"/><ellipse cx="-12" cy="-20" rx="14" ry="12" fill="#84946a"/>')}
const icons={jar:'<ellipse cy="14" rx="21" ry="6" fill="#42392b" opacity=".25"/><path d="M-13 -20Q-27 -7 -19 12Q0 25 19 12Q27 -7 13 -20Z" fill="#956343" stroke="#543c2b" stroke-width="2"/><ellipse cy="-20" rx="13" ry="5" fill="#493a2b" stroke="#b18c64" stroke-width="3"/><path d="M0 -8l9 8 -9 8 -9 -8Z" fill="#c98a61"/>',basket:'<path d="M-20 -8H20L13 18H-13Z" fill="#b79a5f" stroke="#715933" stroke-width="2"/><path d="M-13 -8Q0 -37 13 -8M-15 0H15M-12 7H12M-8 -8v23M0 -8v25M8 -8v23" fill="none" stroke="#806239" stroke-width="2"/>',boat:'<path d="M-37 2Q0 23 37 2L26 18H-26Z" fill="#78543d" stroke="#483a2e" stroke-width="2"/><path d="M-20 2Q-16 -24 12 -20L24 2Z" fill="#b39b6a" stroke="#5a4834" stroke-width="2"/>',lantern:'<path d="M0 -27V-18M0 16V25" stroke="#805331" stroke-width="3"/><ellipse rx="16" ry="21" fill="#d18b49" stroke="#805331" stroke-width="2"/><path d="M-8 -18Q-15 0 -8 18M8 -18Q15 0 8 18" stroke="#9c5e36" fill="none" stroke-width="2"/>',tea:'<path d="M-19 -12H19L14 12Q0 20 -14 12Z" fill="#90a89c" stroke="#4d6e66" stroke-width="2"/><ellipse cy="-12" rx="19" ry="6" fill="#dae4c8" stroke="#4d6e66" stroke-width="2"/><path d="M-24 17H24" stroke="#58796f" stroke-width="4"/>',scroll:'<rect x="-20" y="-21" width="40" height="42" rx="3" fill="#e8d9a8" stroke="#987849" stroke-width="2"/><path d="M-23 -22H23M-23 22H23M-9 -11V12M0 -11V12M9 -11V12" stroke="#8a7955" stroke-width="2"/>'};
const items=[['茶甕','jar',125,280],['竹籃','basket',805,258],['木船','boat',415,220],['燈籠','lantern',1050,365],['茶杯','tea',170,386],['古卷','scroll',870,512],['茶甕','jar',1120,238],['竹籃','basket',760,410],['木船','boat',550,535],['燈籠','lantern',85,205],['茶杯','tea',945,320],['古卷','scroll',255,510]];
let idx=0,score=0,wrong=0,hints=0,qs=[],vals=[],found=new Set(),start=0,playing=false,music=false,ac,timer=0;
function question(i){let d=$('level').selectedIndex,a=3+i+d*2,b=2+(i%4),x=2+i+d;switch($('unit').value){case'exp':return{html:(i%2?3:2)+'<sup>'+b+'</sup> × '+(i%2?3:2)+'<sup>2</sup>',v:(i%2?3:2)**(b+2)};case'signed':return{html:'(−'+a+') × '+b+' ＋ '+(d+4),v:-a*b+d+4};case'eq':return{html:b+'x ＋ '+a+' ＝ '+(b*x+a)+'，x＝？',v:x};case'fraction':return{html:'('+a+'/ '+b+') × '+b,v:a};case'gcd':{let m=a*2,n=a*3;return{html:(i%2?'最小公倍數':'最大公因數')+' ('+m+'，'+n+')',v:i%2?a*6:a}}case'system':return{html:'x＋y＝'+(x+b)+'，x−y＝'+(x-b)+'，x＝？',v:x}}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function round(){if(idx===6){playing=false;$('summary').textContent='完成六件寶物｜答錯 '+wrong+' 次｜提示 '+hints+' 次｜用時 '+Math.round((Date.now()-start)/1000)+' 秒';$('result').hidden=false;return}let q=qs[idx];$('q').innerHTML=q.html;let avail=items.map((_,i)=>i).filter(i=>!found.has(i));let target=avail[Math.floor(Math.random()*avail.length)];vals=items.map((_,i)=>{let v=q.v+(i+1)*(i%2?1:-1);return i===target?q.v:v});$('objects').replaceChildren();items.forEach(([name,key,x,y],i)=>{let p=node('g',{transform:'translate('+x+' '+y+')',class:'target'+(found.has(i)?' found':''),tabindex:found.has(i)?'-1':'0',role:'button','aria-label':name+' '+vals[i]},$('objects'));art(p,icons[key]+'<rect class="seal" x="-26" y="25" width="52" height="26" rx="5" fill="#fff0c9" stroke="#886e46" stroke-width="2"/><text y="44" text-anchor="middle" font-size="19" font-weight="bold" fill="#4d3925">'+vals[i]+'</text>');p.onclick=()=>pick(i);p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(i)}}});$('stats').textContent='寶物 '+idx+'/6';$('inventory').innerHTML=Array.from({length:6},(_,i)=>'<span class="'+(i<idx?'found':'')+'">'+(i<idx?'✓ '+items[[...found][i]][0]:'寶物 '+(i+1))+'</span>').join('')}
function pick(i){if(!playing||found.has(i))return;if(vals[i]!==qs[idx].v){wrong++;$('feedback').textContent='再想一想';beep(180);return}found.add(i);idx++;score++;$('feedback').textContent='找到寶物！';beep(660);round()}
function begin(){idx=score=wrong=hints=0;found=new Set();qs=Array.from({length:6},(_,i)=>question(i));start=Date.now();playing=true;$('start').hidden=true;$('result').hidden=true;$('feedback').textContent='';round();if(music)audio()}
function audio(){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function beep(f){if(!music)return;audio();if(!ac)return;let o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.045,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.36)}
let n=0;setInterval(()=>{if(music&&playing)beep([261.63,293.66,329.63,392,440,392,329.63,293.66][n++%8])},850);
$('sound').onclick=()=>{music=!music;$('sound').textContent='配樂 '+(music?'開':'關');if(music)audio()};$('begin').onclick=begin;$('again').onclick=begin;$('home').onclick=$('back').onclick=()=>{playing=false;$('result').hidden=true;$('start').hidden=false};$('hint').onclick=()=>{if(!playing)return;hints++;let i=vals.findIndex((v,i)=>v===qs[idx].v&&!found.has(i));$('objects').children[i]?.classList.add('hint')};$('zoomIn').onclick=()=>{let i=vals.findIndex((v,i)=>v===qs[idx]?.v&&!found.has(i));if(i<0)return;let [, ,x,y]=items[i];$('map').setAttribute('viewBox',Math.max(0,Math.min(600,x-300))+' '+Math.max(0,Math.min(325,y-162))+' 600 325');hints++};$('zoomOut').onclick=()=>$('map').setAttribute('viewBox','0 0 1200 650');
</script></body></html>
