<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#14253d">
<title>墨刃｜方程式劍客・可愛武俠版</title>
<style>
:root{color-scheme:dark;--gold:#ffe39b;--teal:#9cf4df;--ink:#12233b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c32;color:#fff;font-family:ui-monospace,"Cascadia Code","PingFang TC",monospace;touch-action:none;user-select:none;-webkit-user-select:none}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#top{position:fixed;z-index:2;left:0;right:0;top:env(safe-area-inset-top);padding:7px clamp(8px,2vw,20px);display:none;pointer-events:none;text-shadow:0 2px 4px #111}#row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(12px,2vw,18px);font-weight:900}#problem{background:#10213bdd;border:2px solid #ffe39b;border-radius:14px;padding:5px 14px;font-size:clamp(18px,3.3vw,30px);text-align:center;box-shadow:0 3px 12px #07101c99;min-width:min(50vw,420px)}#meta{display:flex;gap:10px;align-items:center;white-space:nowrap}.pill{padding:4px 9px;border:1px solid #ffffff66;border-radius:10px;background:#10213bcc}#controls{position:fixed;z-index:3;left:50%;bottom:calc(7px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:clamp(7px,2vw,22px);width:min(760px,99vw);pointer-events:none}#move,#actions{display:flex;gap:7px;align-items:center;pointer-events:auto}button{font:inherit;color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent}#controls button{border:2px solid #d8f8edaa;background:linear-gradient(150deg,#31627d,#18364e);border-radius:19px;box-shadow:0 5px 0 #0a1c2d,0 0 16px #70e7d633;font-weight:950;text-shadow:0 2px 3px #06101a}#controls button.pressed,#controls button:active{transform:translateY(3px);box-shadow:0 2px 0 #0a1c2d;background:#388c91}#move button{width:clamp(52px,12vw,78px);height:clamp(56px,13vw,82px);font-size:clamp(25px,5vw,38px)}#actions button{height:clamp(52px,12vw,76px);min-width:clamp(56px,12vw,76px);padding:4px 9px;font-size:clamp(12px,2.3vw,16px)}#attack{width:clamp(78px,17vw,112px);height:clamp(78px,17vw,112px)!important;border-radius:50%!important;border:3px solid #ffe09a!important;background:radial-gradient(circle at 32% 25%,#f1b86e,#8d4d47 76%)!important;font-size:clamp(13px,2.6vw,18px)!important;position:relative;overflow:hidden}#attack:before{content:"";position:absolute;inset:0;background:conic-gradient(#fff09a calc(var(--charge,0)*1%),transparent 0);opacity:.45;pointer-events:none}#attack span{position:relative}#tip{position:fixed;z-index:2;bottom:calc(118px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f9f1d2;font-size:clamp(10px,1.5vw,13px);text-shadow:0 2px 4px #000;display:none;pointer-events:none}#sound{position:fixed;z-index:4;right:8px;top:calc(env(safe-area-inset-top) + 58px);display:none;border:1px solid #d9e9c7;border-radius:12px;background:#122b43dd;padding:7px 10px}#panel{position:fixed;inset:0;z-index:5;background:linear-gradient(145deg,#0e1d35ed,#243e55e9);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}#panel.hide{display:none}#card{width:min(940px,100%);max-height:96dvh;overflow:auto;text-align:center;padding:clamp(12px,2vw,20px);border:4px solid #f3cf7b;border-radius:8px;background:linear-gradient(160deg,#1c3450f7,#102139f7);box-shadow:8px 8px 0 #07101c,0 0 40px #82e6cb2a}h1{margin:2px 0 8px;color:#ffe5a3;font-size:clamp(25px,5.5vw,42px);text-shadow:0 3px 0 #624334}h2{margin:7px 0;color:#ffe7a9;font-size:clamp(20px,4vw,30px)}p{line-height:1.55;margin:9px 0}.lead{color:#dcf4ed}.spec{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:13px auto}.spec span{border:1px solid #8ed9ce88;border-radius:99px;padding:5px 10px;background:#163b50;font-size:13px}.primary,.secondary{border:2px solid #ffe5a0;border-radius:14px;padding:12px 22px;margin:6px;background:linear-gradient(110deg,#bd673e,#89513e);font-weight:950;font-size:clamp(17px,3vw,22px);box-shadow:0 4px 0 #57352e}.secondary{font-size:16px;background:#20455a}.explain{border-radius:15px;background:#19384b;padding:12px;text-align:left;color:#e6f6eb}.badge{color:#9ceadc;font-weight:900;letter-spacing:2px}.muted{font-size:13px;color:#c2d8dc}.pick-section{margin:7px auto 5px;text-align:left}.pick-title{font-weight:950;color:#ffe5a3;margin:4px 2px}.pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pick{min-height:67px;padding:6px 5px;border:3px solid #8ed9ce88;border-radius:5px;background:#163b50;color:#fff;font-size:clamp(11px,1.8vw,15px);line-height:1.3;box-shadow:3px 3px 0 #07101c}.pick .emoji{display:block;font-size:22px}.pick small{display:block;color:#c6dfdc;font-size:10px}.pick.selected{border-color:#ffe39b;background:linear-gradient(145deg,#8b5945,#305965);box-shadow:3px 3px 0 #ffe39b66}.primary,.secondary{border-radius:5px;box-shadow:4px 4px 0 #57352e}#controls button{border-radius:6px!important}@media(max-width:560px){#card{width:100%;padding:9px;max-height:99dvh}.pick-grid{gap:4px}.pick{min-height:60px;padding:4px 2px}.pick .emoji{font-size:19px}#controls{gap:5px}#move{gap:4px}#actions{gap:4px}#controls button{border-radius:14px}#meta{gap:4px}#problem{min-width:42vw;padding:4px 8px}#tip{bottom:calc(91px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="game" aria-label="方程式劍客遊戲畫面"></canvas>
<header id="top"><div id="row"><span class="pill" id="stage">初階</span><strong id="problem">解出 x</strong><span id="meta"><span class="pill" id="progress">1 / 10</span><span class="pill" id="lives">♥ ♥ ♥</span><span class="pill" id="hp">氣血 100</span></span></div></header>
<div id="tip">攻擊自動瞄準最近答案｜可點方塊切換目標｜短按揮劍・長按蓄力｜跳躍閃避</div>
<button id="sound" aria-label="切換音效">♫ 音效</button>
<div id="controls"><div id="move"><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button></div><div id="actions"><button data-key="jump" aria-label="跳躍閃避">⬆ 跳躍</button><button id="attack" aria-label="短按攻擊，長按蓄力"><span>⚔ 攻擊<br><small id="chargeText">短按出招</small></span></button></div></div>
<div id="panel"><main id="card"></main></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),W=960,H=540,ground=444,plat=[{x:170,w:220,y:355},{x:575,w:215,y:330}];
let dpr=1,scale=1,ox=0,oy=0,mode='menu',stage=0,qi=0,bossCount=0,lives=3,hp=100,energy=35,hero={x:460,y:ground,vy:0,face:1,ground:true},targets=[],bullets=[],enemyShots=[],particles=[],trail=[],question=null,selected=-1,keys={},last=0,elapsed=0,shotAt=0,enemyAt=0,flash=0,shake=0,hitStop=0,slow=0,zoom=1,combo=0,muted=false,chargeStart=0,charging=false,attackHeld=false,attackPointer=-1,damageTimer=0,runToken=0,loopGeneration=0,audio=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const heroes=[{name:'雲嵐',emoji:'🗡️',tag:'迅捷劍客',coat:'#e7f3ee',trim:'#e97678',hair:'#27354a',skin:'#f6c99b'},{name:'星璃',emoji:'🔮',tag:'星月術士',coat:'#dcd7ff',trim:'#9a74d6',hair:'#493b67',skin:'#f4c9b0'},{name:'小虎',emoji:'🐯',tag:'虎拳俠',coat:'#f4d29a',trim:'#ca713d',hair:'#47352b',skin:'#d99b70'}];
const scenes=[{name:'竹林山道',emoji:'🎋',tag:'清風竹影'},{name:'月城夜市',emoji:'🏮',tag:'燈火不夜'},{name:'霜雪魔殿',emoji:'❄️',tag:'冰晶王城'}];
const bosses=[{name:'花影妖姬',emoji:'🌸',tag:'藤花幻術',color:'#bd638d'},{name:'炎角魔將',emoji:'🔥',tag:'烈焰重擊',color:'#ba573e'},{name:'霜翼龍王',emoji:'🐲',tag:'寒霜吐息',color:'#4b7eb3'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);scale=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy)}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(){let difficulty=stage===0?qi<5?0:1:qi<5?2:3,x=rand(-8,12),a=rand(2,5+difficulty),b=rand(-7,9+difficulty*2),c=a*x+b,form=rand(0,difficulty===0?1:3),text,explain;
 if(form===0){text=`${a}x ${b<0?'− '+Math.abs(b):'+ '+b} = ${c}`;explain=`先把常數項移到等號右邊：${a}x = ${c-b}。再除以 ${a}，所以 x = ${x}。`}
 else if(form===1){let m=rand(2,5);x=m*rand(-4,5);let rhs=x/m+b;text=`x ÷ ${m} ${b<0?'− '+Math.abs(b):'+ '+b} = ${rhs}`;explain=`先移項，得到 x ÷ ${m} = ${rhs-b}；兩邊乘以 ${m}，所以 x = ${x}。`}
 else if(form===2){let d=rand(1,4);if(a===d)a++;let e=(a-d)*x+b;text=`${a}x ${b<0?'− '+Math.abs(b):'+ '+b} = ${d}x ${e<0?'− '+Math.abs(e):'+ '+e}`;explain=`把含 x 的項移到左邊、常數移到右邊：${a-d}x = ${e-b}，所以 x = ${x}。`}
 else{let m=rand(2,5);b=m*rand(-3,4)-a*x;let v=a*x+b;text=`(${a}x ${b<0?'− '+Math.abs(b):'+ '+b}) ÷ ${m} = ${v/m}`;explain=`先乘以 ${m}：${a}x ${b<0?'− '+Math.abs(b):'+ '+b} = ${v}。移項並除以 ${a}，得到 x = ${x}。`}
 const ans=x,opts=[ans];let candidates=shuffle([ans-3,ans+3,ans-2,ans+2,ans-1,ans+1,ans+4,ans-4]);for(const n of candidates){if(!opts.includes(n))opts.push(n);if(opts.length===4)break}shuffle(opts);return {text,answer:ans,opts,explain}}
function setQuestion(){question=makeQuestion();selected=-1;targets=question.opts.map((n,i)=>({n,x:[150,370,615,820][i],y:i%2?plat[0].y:ground,level:i%2?1:0,phase:Math.random()*8,flash:0,sx:1,sy:1}));enemyAt=elapsed+rand(4,7);updateHud()}
function updateHud(){$('#stage').textContent=stage===0?'初階｜劍竹道':stage===1?'進階｜雲霧山門':'魔王戰｜連對 '+bossCount+'/5';$('#progress').textContent=stage===2?'連對 '+bossCount+' / 5':`${qi+1} / 10`+(stage===1?'　進階':'');$('#problem').textContent=question?.text||'解出 x';$('#lives').textContent='♥ '.repeat(Math.max(0,lives)).trim()||'0 命';$('#hp').textContent='氣血 '+Math.max(0,Math.ceil(hp));$('#attack').style.setProperty('--charge',energy);$('#chargeText').textContent=charging?`蓄力 ${Math.floor(energy)}%`:energy>=70?'絕技就緒':'短按出招'}
function startStage(n){if(mode==='play'||mode==='finish')return;runToken++;mode='play';stage=n;qi=0;bossCount=0;lives=n===0?3:lives;hp=100;energy=n===0?35:Math.max(30,energy);hero={x:460,y:ground,vy:0,face:1,ground:true};bullets=[];enemyShots=[];particles=[];trail=[];combo=0;elapsed=0;$('#panel').classList.add('hide');$('#top').style.display='block';$('#controls').style.display='flex';$('#tip').style.display='block';$('#sound').style.display='block';setQuestion();resumeLoop()}
function menu(){mode='menu';$('#top').style.display='none';$('#controls').style.display='none';$('#tip').style.display='none';$('#sound').style.display='none';$('#panel').classList.remove('hide');$('#card').innerHTML='<div class="badge">MATHCRAFT・墨刃方塊冒險</div><h1>⛏️ 方程式方塊劍客</h1><p class="lead"><b>挑選你的方塊英雄、冒險世界與最終魔王</b><br>解開一元一次方程式，在方塊世界擊退魔物！</p>'+pickSection('選擇主角',heroes,'hero')+pickSection('選擇場景',scenes,'scene')+pickSection('選擇魔王',bosses,'boss')+'<div class="spec"><span>初階 10 題</span><span>進階 10 題</span><span>3 命挑戰</span><span>魔王連答 5 題</span><span>攻擊自動瞄準・跳躍閃避</span></div><p><button class="primary" id="start">開始方塊冒險</button> <button class="secondary" id="how">操作說明</button></p><p class="muted">方向鍵／觸控移動｜空白鍵／跳躍按鈕起跳｜J／F 或攻擊按鈕發射，按住蓄力</p>';
 $('#card').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const parts=b.dataset.pick.split(':');const kind=parts[0],index=+parts[1];if(kind==='hero')selectedHero=index;if(kind==='scene')selectedScene=index;if(kind==='boss')selectedBoss=index;refreshPicks()});
 refreshPicks();$('#start').onclick=()=>{unlock();startStage(0)};$('#how').onclick=()=>$('#card').insertAdjacentHTML('beforeend','<div class="explain"><b>操作方式</b><br>攻擊會自動瞄準最近的答案，不必先點選答案。按住攻擊可蓄力，放開發射。跳躍可閃避敵方飛彈。答錯會顯示解題步驟，確認後繼續。</div>')}
function pickSection(title,items,kind){return '<section class="pick-section"><div class="pick-title">'+title+'</div><div class="pick-grid">'+items.map((item,i)=>'<button class="pick" data-pick="'+kind+':'+i+'"><span class="emoji">'+item.emoji+'</span><b>'+item.name+'</b><small>'+item.tag+'</small></button>').join('')+'</div></section>'}
function refreshPicks(){document.querySelectorAll('[data-pick]').forEach(b=>{const p=b.dataset.pick.split(':');const kind=p[0],index=+p[1];b.classList.toggle('selected',index===(kind==='hero'?selectedHero:kind==='scene'?selectedScene:selectedBoss))})}
function panel(title,body,buttons){mode='panel';clearInputs();$('#top').style.display='none';$('#controls').style.display='none';$('#tip').style.display='none';$('#sound').style.display='none';$('#panel').classList.remove('hide');$('#card').innerHTML=`<div class="badge">方程式劍客・可愛武俠版</div><h1>${title}</h1>${body}<p>${buttons.map((b,i)=>`<button class="${i===0?'primary':'secondary'}" data-i="${i}">${b[0]}</button>`).join('')}</p>`;buttons.forEach((b,i)=>$('#card').querySelector(`[data-i="${i}"]`).onclick=b[1])}
function showExplain(correct){const q=question;panel(correct?'🎉 解題成功！':`📜 解題提示｜答案是 ${q.answer}`,`<div class="explain"><b>${q.text}</b><br>${q.explain}</div>${correct?'<p class="lead">漂亮命中！繼續前進。</p>':'<p class="muted">攻擊會自動鎖定最近答案；可直接再攻擊，也可點選別的數字方塊。已扣少量氣血。</p>'}`,correct?[[stage===2&&bossCount>=5?'完成挑戰':'繼續',()=>advance()]]:[['繼續作答',()=>{mode='play';$('#panel').classList.add('hide');$('#top').style.display='block';$('#controls').style.display='flex';$('#tip').style.display='block';$('#sound').style.display='block';resumeLoop()}],['回主選單',menu]])}
function advance(){if(mode!=='panel')return;if(stage<2){qi++;if(stage<2&&qi>=10){if(stage===0){startStage(1);return}panel('🌸 進階關卡完成','<p class="lead">兩關題目都突破了！接下來迎戰魔王，連續答對 5 題即可獲勝。</p>',[['迎戰魔王',()=>startStage(2)],['回主選單',menu]]);return}setQuestion()}else{bossCount++;if(bossCount>=5){victory();return}setQuestion()}mode='play';$('#panel').classList.add('hide');$('#top').style.display='block';$('#controls').style.display='flex';$('#tip').style.display='block';$('#sound').style.display='block';resumeLoop()}
function victory(){panel('🏆 全員勝利！','<p class="lead">答案妖怪全數退散！</p><p>初階 10 題、進階 10 題，並連續答對魔王題 5 題。</p><div class="spec"><span>最終連擊 '+bossCount+' 題</span><span>剩餘命數 '+lives+' 命</span></div>',[['再玩一次',()=>startStage(0)],['回主選單',menu]])}
function lose(){panel('💫 小劍客需要休息','<p>這次闖到第 '+(stage===2?'魔王連對 '+bossCount:((stage*10+qi+1)+' 題'))+'。看過解題步驟再挑戰一次吧！</p>',[['重新挑戰',()=>startStage(0)],['回主選單',menu]])}
function unlock(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext);audio.resume()}catch(_){}}
function tone(freq,dur=.12,wave='triangle',vol=.07){if(muted)return;try{unlock();let o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
function snd(k){tone(k==='hit'?190:k==='bad'?105:k==='jump'?420:k==='damage'?75:k==='ultimate'?740:300,k==='ultimate'?.4:.14,k==='damage'?'sawtooth':'triangle',k==='hit'?.1:.065)}
function clearInputs(){keys={};charging=false;attackHeld=false;attackPointer=-1;document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('pressed'));$('#attack').style.setProperty('--charge',energy)}
function jump(){if(mode!=='play')return;if(hero.ground){hero.vy=-520;hero.ground=false;snd('jump');squash(.82,1.18)}}
function aimIndex(){if(selected>=0&&targets[selected])return selected;let best=-1,distance=Infinity;targets.forEach((t,i)=>{const d=Math.hypot(t.x-hero.x,t.y-hero.y);if(d<distance){best=i;distance=d}});return best}
function fire(ultimate=false){if(mode!=='play'||(shotAt>0&&elapsed-shotAt<.28))return;shotAt=elapsed;let t=selected>=0?targets[selected]:targets[aimIndex()];if(!t)return;hero.face=t.x>=hero.x?1:-1;let sx=hero.x+hero.face*24,sy=hero.y-50,total=Math.max(.2,Math.hypot(t.x-sx,t.y-55-sy)/900);bullets.push({x:sx,y:sy,sx,sy,target:t,life:total,total,ultimate});snd(ultimate?'ultimate':'slash');if(ultimate)energy=10;else energy=Math.min(100,energy+14);updateHud()}
function attackDown(e){e?.preventDefault?.();if(mode!=='play'||attackHeld)return;unlock();attackPointer=Number.isInteger(e?.pointerId)?e.pointerId:-1;attackHeld=true;charging=true;chargeStart=performance.now();$('#attack').classList.add('pressed')}
function attackUp(e){e?.preventDefault?.();if(!attackHeld)return;if(attackPointer!==-1&&e?.pointerId!==undefined&&e.pointerId!==attackPointer)return;let hold=performance.now()-chargeStart;attackHeld=false;charging=false;attackPointer=-1;$('#attack').classList.remove('pressed');if(hold>360&&energy>=70)fire(true);else fire(false);updateHud()}
function hitTarget(t,ultimate=false){if(mode!=='play')return;t.flash=.14;t.sx=.7;t.sy=1.2;hitStop=reduced?0:.045;shake=reduced?0:(ultimate?8:2);flash=reduced?0:.07;debris(t.x,t.y-34,ultimate?10:7);combo++;energy=Math.min(100,energy+(ultimate?24:8));const correct=t.n===question.answer;if(correct){snd('hit');if(combo>1)tone(392*Math.pow(2,(Math.min(combo,10)-1)/12),.2,'sine',.05);if(stage===2&&bossCount+1>=5){slow=reduced?0:.7;zoom=reduced?1:1.1;if(slow){mode='finish';setTimeout(()=>{if(mode==='finish')showExplain(true)},700)}else showExplain(true)}else showExplain(true)}else{combo=0;hp-=16;bossCount=0;snd('bad');showExplain(false)}updateHud()}
function debris(x,y,count){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:-rand(80,280),life:.42+Math.random()*.34,size:rand(3,8),col:['#ffe99b','#83e8df','#f79b83','#fff'][i%4]})}
function squash(x,y){if(selected>=0&&targets[selected]){targets[selected].sx=x;targets[selected].sy=y}}
function hurt(){if(elapsed<damageTimer)return;damageTimer=elapsed+1.05;hp-=25;shake=reduced?0:5;flash=.11;snd('damage');if(hp<=0){lives--;bossCount=0;hp=100;energy=Math.max(20,energy-15);if(lives<=0){lose();return}}updateHud()}
function canvasPick(e){if(mode!=='play')return;let x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale,hit=-1,best=1e9;targets.forEach((t,i)=>{let d=Math.hypot(x-t.x,y-(t.y-30));if(d<72&&d<best){hit=i;best=d}});if(hit>=0){selected=hit;return}}

function rounded(x,y,w,h,r,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(x+2,y+2,w-4,h-4);if(stroke){ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.strokeRect(x,y,w,h)}}
function background(){const palette=[['#8ecac6','#def0ce','#638f79','#486b64'],['#211f4a','#583b71','#493d69','#302548'],['#a6d7ef','#e7f7ff','#7196bd','#466b99']][selectedScene];let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,palette[0]);g.addColorStop(.55,palette[1]);g.addColorStop(1,selectedScene===2?'#dcecf2':'#f1cf94');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=selectedScene===1?'#ffe8a1':'#f6f2cb';ctx.fillRect(760,70,46,46);for(let i=0;i<8;i++){let x=i*145-30;ctx.fillStyle=i%2?palette[2]:palette[3];ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+75,190+(i%3)*20);ctx.lineTo(x+185,ground);ctx.fill()}if(selectedScene===0){for(let i=0;i<9;i++){let x=(i*127+35)%W;ctx.fillStyle='#286858';ctx.fillRect(x,220+(i%3)*24,10,ground-220);ctx.fillStyle='#3c8b65';ctx.fillRect(x-18,250+(i%2)*13,46,9);ctx.fillStyle='#9fbf68';ctx.fillRect(x-13,269+(i%2)*12,36,8)}}else if(selectedScene===1){for(let i=0;i<7;i++){let x=i*145+25;ctx.fillStyle='#5a476d';ctx.fillRect(x,252,92,ground-252);ctx.fillStyle='#ffcb70';ctx.fillRect(x+16,277,16,24);ctx.fillRect(x+57,277,16,24);ctx.fillStyle='#e88b55';ctx.fillRect(x+36,203,7,37);ctx.fillRect(x+26,217,27,18)}}else{ctx.fillStyle='#eaf8ff';for(let i=0;i<9;i++){ctx.fillRect(i*119,ground-35-(i%3)*9,54,8);ctx.fillRect(i*119+19,ground-55-(i%3)*9,30,20)}ctx.fillStyle='#c4d8ed';ctx.fillRect(748,184,116,140);ctx.fillStyle='#7294bb';ctx.fillRect(780,144,52,42);ctx.fillStyle='#eaf8ff';ctx.fillRect(794,248,24,76)}ctx.fillStyle=selectedScene===2?'#dbeafa':'#c47b63';ctx.fillRect(0,ground,W,H-ground);for(let i=0;i<15;i++){let x=(i*87+elapsed*18)%W;ctx.fillStyle=selectedScene===2?'#f6ffff':'#e6bb75';ctx.fillRect(x,471+(i%3)*18,15,5)}plat.forEach((p,i)=>{rounded(p.x,p.y,p.w,20,0,i?'#86594c':'#966b4f','#ffe0a2');ctx.fillStyle='#e5bc78';ctx.fillRect(p.x+10,p.y+5,p.w-20,4)})}
function drawHero(){trail.push({x:hero.x,y:hero.y-20});if(trail.length>12)trail.shift();trail.forEach((p,i)=>{ctx.globalAlpha=(i+1)/trail.length*.14;ctx.fillStyle='#fff0b0';ctx.fillRect(p.x-5*(i+1)/trail.length,p.y-4*(i+1)/trail.length,10*(i+1)/trail.length,8*(i+1)/trail.length)});ctx.globalAlpha=1;const ch=heroes[selectedHero];let bob=hero.ground?Math.sin(elapsed*8)*2:0;ctx.save();ctx.translate(Math.round(hero.x),Math.round(hero.y-24+bob));ctx.scale(hero.face,1);ctx.fillStyle='#293c50';ctx.fillRect(-20,7,16,17);ctx.fillRect(4,7,16,17);ctx.fillStyle=ch.coat;ctx.fillRect(-18,-30,36,39);ctx.fillStyle=ch.trim;ctx.fillRect(-18,-18,36,7);ctx.fillRect(-9,-30,7,39);ctx.fillStyle=ch.skin;ctx.fillRect(-13,-54,26,23);ctx.fillStyle=ch.hair;ctx.fillRect(-15,-60,30,10);ctx.fillRect(-14,-50,6,7);ctx.fillRect(8,-50,6,7);ctx.fillStyle='#25344a';ctx.fillRect(3,-45,4,4);if(selectedHero===2){ctx.fillStyle='#f0a347';ctx.fillRect(-13,-62,7,5);ctx.fillRect(6,-62,7,5)}ctx.fillStyle='#74513d';ctx.fillRect(15,-31,8,15);ctx.fillStyle='#9ee9e1';ctx.fillRect(20,-53,8,28);ctx.fillStyle='#fff3bb';ctx.fillRect(24,-59,5,6);ctx.restore()}
function drawTarget(t,i){let bob=Math.sin(elapsed*3+t.phase)*4;let aimed=i===aimIndex();ctx.save();ctx.translate(t.x,t.y-36+bob);ctx.scale(t.sx,t.sy);t.sx+=(1-t.sx)*.2;t.sy+=(1-t.sy)*.2;ctx.fillStyle=aimed?'#fff3a6':'#f5d8a9';ctx.shadowColor=aimed?'#fff2a2':'#0005';ctx.shadowBlur=aimed?18:5;rounded(-31,-22,62,49,14,aimed?'#ffedb7':'#d9eff0',aimed?'#fff':'#fff1ce');ctx.shadowBlur=0;ctx.fillStyle='#37536b';ctx.beginPath();ctx.arc(-10,-7,3,0,7);ctx.arc(10,-7,3,0,7);ctx.fill();ctx.strokeStyle='#b86666';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,7,.2,Math.PI-.2);ctx.stroke();rounded(-36,-60,72,28,10,'#984e4e','#ffe39b');ctx.fillStyle='#fff6d7';ctx.textAlign='center';ctx.font='900 20px system-ui';ctx.fillText(String(t.n),0,-40);if(stage===2){ctx.fillStyle='#ffeaa3';ctx.font='bold 13px system-ui';ctx.fillText('魔王答案',0,45)}ctx.restore()}
function drawEnemy(){if(mode!=='play')return;const big=stage===2,b=bosses[selectedBoss];let x=big?W/2:(elapsed%10<6?35:925),y=big?ground-72:(elapsed%2?ground-24:ground-60),s=big?1.45:1;ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(s,s);ctx.fillStyle=big?b.color:'#853f55';ctx.fillRect(-30,-42,60,48);ctx.fillRect(-38,-30,8,25);ctx.fillRect(30,-30,8,25);ctx.fillStyle='#f0c39b';ctx.fillRect(-19,-68,38,27);ctx.fillStyle=big?b.color:'#5c4458';ctx.fillRect(-21,-78,12,15);ctx.fillRect(9,-78,12,15);ctx.fillStyle='#fff';ctx.fillRect(-10,-58,6,5);ctx.fillRect(5,-58,6,5);ctx.fillStyle='#ffe8a1';ctx.fillRect(-22,5,44,6);if(big){ctx.fillStyle='#10213b';ctx.fillRect(-107,-116,214,27);ctx.strokeStyle='#ffe39b';ctx.lineWidth=3;ctx.strokeRect(-107,-116,214,27);ctx.fillStyle='#fff4ca';ctx.font='900 17px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(b.emoji+' '+b.name,0,-97);ctx.fillStyle='#f2c258';ctx.fillRect(-75,-130,14,14);ctx.fillRect(61,-130,14,14)}ctx.restore()}
function draw(){ctx.save();let sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2+sx,-H/2+sy);background();drawEnemy();targets.forEach(drawTarget);bullets.forEach(b=>{ctx.fillStyle=b.ultimate?'#fff5a1':'#bdf5ef';ctx.shadowBlur=b.ultimate?17:9;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.ellipse(b.x,b.y,b.ultimate?18:10,5,0,0,7);ctx.fill();ctx.shadowBlur=0});enemyShots.forEach(b=>{ctx.fillStyle='#fa8c81';ctx.beginPath();ctx.arc(b.x,b.y,8,0,7);ctx.fill()});drawHero();particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}ctx.restore()}
function resumeLoop(){last=performance.now();const generation=++loopGeneration;requestAnimationFrame(now=>loop(now,generation))}
function loop(now,generation){if(generation!==loopGeneration)return;if(mode==='finish'){let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt*.3;draw();requestAnimationFrame(t=>loop(t,generation));return}if(mode!=='play')return;let dt=Math.min(.04,(now-last)/1000);last=now;if(hitStop>0){hitStop-=dt;draw();requestAnimationFrame(t=>loop(t,generation));return}let actual=dt*(slow>0?.3:1);elapsed+=actual;if(slow>0){slow-=dt;if(slow<=0)zoom=1}if(shake>0)shake=Math.max(0,shake-dt*22);if(flash>0)flash=Math.max(0,flash-dt*.8);if(charging&&attackHeld){energy=Math.min(100,energy+dt*48);updateHud()}if(keys.left){hero.x=Math.max(24,hero.x-235*actual);hero.face=-1}if(keys.right){hero.x=Math.min(W-24,hero.x+235*actual);hero.face=1}hero.y+=hero.vy*actual;if(!hero.ground){hero.vy+=1150*actual;if(hero.y>=ground){hero.y=ground;hero.vy=0;hero.ground=true}}if(elapsed-shotAt>1.2&&energy<100)energy=Math.min(100,energy+actual*4);
 bullets.forEach(b=>{b.life-=actual;let p=1-b.life/b.total;b.x=b.sx+(b.target.x-b.sx)*p;b.y=b.sy+(b.target.y-55-b.sy)*p;if(b.life<=0&&b.target){hitTarget(b.target,b.ultimate);b.target=null}});bullets=bullets.filter(b=>b.life>0);if(elapsed>enemyAt){enemyShots.push({x:elapsed%10<6?78:882,y:ground-55,vx:elapsed%10<6?115:-115});enemyAt=elapsed+rand(4,7)}enemyShots.forEach(b=>{b.x+=b.vx*actual;if(Math.abs(b.x-hero.x)<21&&Math.abs(b.y-(hero.y-25))<42){if(hero.ground)hurt();b.x=-100}});enemyShots=enemyShots.filter(b=>b.x>-20&&b.x<W+20);particles.forEach(p=>{p.x+=p.vx*actual;p.y+=p.vy*actual;p.vy+=560*actual;p.life-=actual});particles=particles.filter(p=>p.life>0);targets.forEach(t=>{if(t.flash>0)t.flash-=actual});draw();requestAnimationFrame(t=>loop(t,generation))}
