<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>一元一次方程式｜3D武俠戰場</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans TC",sans-serif;background:#091425;color:#fff}#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:13px}#hud span{background:#071322dd;padding:8px;border:1px solid #607089;border-radius:10px}#question{position:absolute;top:68px;left:50%;transform:translateX(-50%);width:min(96vw,640px);background:#13263deb;border:1px solid #657791;border-radius:15px;padding:11px;text-align:center;display:none}#qtxt{font-size:19px;font-weight:800;margin:0 0 8px}#answers{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}button{font-weight:750;font-size:16px;border:1px solid #9bafc4;border-radius:12px;background:#284461;color:#fff;min-height:46px;touch-action:manipulation}button:active{filter:brightness(1.4)}#controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}#move{display:grid;grid-template-columns:repeat(3,52px);gap:4px}#act{display:grid;grid-template-columns:repeat(2,70px);gap:5px}#overlay{position:absolute;inset:0;background:#0009;display:flex;align-items:center;justify-content:center}#panel{width:min(90vw,480px);background:linear-gradient(#214361,#10243a);border:1px solid #a0bad0;border-radius:22px;padding:23px;text-align:center;box-shadow:0 14px 50px #0008}#panel h1{color:#ffdf94;font-size:25px}#start{background:linear-gradient(#ffe6a4,#edb854);color:#33220a;font-size:22px;padding:7px 25px;border:none}.small{font-size:13px;color:#c9d5e4}#notice{position:absolute;top:205px;left:10px;right:10px;text-align:center;text-shadow:0 2px 5px #000;pointer-events:none;font-weight:750}</style>
<canvas id="scene"></canvas><div id="hud"><span id="mode">一元一次方程式 | 3D 戰場</span><span id="stats">❤️3　⭐0　關卡 1/3</span></div><div id="question"><div id="qtxt"></div><div id="answers"></div></div><div id="notice"></div><div id="controls"><div id="move"><i></i><button data-k="w">▲</button><i></i><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><div id="act"><button data-action="jump">跳躍</button><button data-action="hit">⚔ 劍氣</button><button data-action="super">⚡必殺</button><button data-action="quiz">答題</button></div></div><div id="overlay"><div id="panel"><h1>⚔ 一元一次方程式</h1><p>三關武俠戰場：移動、跳躍、劍氣、數學答題與魔王挑戰。</p><p class="small" id="hint">3D 模式需要 WebGL 與網路載入繪圖程式；不支援時自動切換可操作的 2D 備援，不會卡在開始畫面。</p><button id="start">進入戰場 ▶</button></div></div>
<script>
(()=>{"use strict";const canvas=document.querySelector("#scene"),ctx=canvas.getContext("2d"),notice=document.querySelector("#notice"),overlay=document.querySelector("#overlay"),qbox=document.querySelector("#question"),qt=document.querySelector("#qtxt"),ans=document.querySelector("#answers"),stats=document.querySelector("#stats"),mode=document.querySelector("#mode");let stage=0,score=0,hp=3,index=0,active=false,quiz=false,ready=false,renderer=null,scene=null,camera=null,hero=null,boss=null,last=0;let x=0,z=0,vy=0,y=0,attack=0,energy=0;const keys={};const tasks=[["x+3=8，x=?",["3","5","8","11"],1,"兩邊減3"],["2x=10，x=?",["4","5","8","10"],1,"兩邊除2"],["x-4=9，x=?",["5","9","13","36"],2,"兩邊加4"],["3x+2=11，x=?",["2","3","4","5"],1,"3x=9"],["5x=2x+12，x=?",["4","3","6","12"],0,"3x=12"],["2(x+3)=14，x=?",["4","7","5","8"],0,"x+3=7"],["4x-5=7，x=?",["2","3","4","5"],1,"4x=12"],["x/3+2=5，x=?",["6","9","12","15"],1,"x/3=3"],["7-x=2，x=?",["9","-5","5","2"],2,"x=5"],["3(x-2)=15，x=?",["5","7","9","11"],1,"x-2=5"],["2x+1=x+8，x=?",["6","7","8","9"],1,"x=7"],["5(x-1)=2x+4，x=?",["2","3","4","5"],1,"3x=9"],["x/2-1=4，x=?",["6","8","10","12"],2,"x/2=5"],["4(x+1)=2(x+5)，x=?",["2","3","4","6"],1,"2x=6"],["3x-7=2x+9，x=?",["2","9","12","16"],3,"x=16"]];function msg(t){notice.textContent=t;setTimeout(()=>{if(notice.textContent===t)notice.textContent=""},2000)}function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;if(renderer){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}}function start(){overlay.style.display="none";active=true;showQuestion();}function showQuestion(){quiz=true;active=false;qbox.style.display="block";const t=tasks[index%tasks.length];qt.textContent="第 "+(index+1)+" 題　"+t[0];ans.replaceChildren();t[1].forEach((opt,i)=>{const b=document.createElement("button");b.textContent=opt;b.onclick=()=>choose(i);ans.append(b)})}function choose(i){const t=tasks[index%tasks.length];if(i===t[2]){score+=100;energy=Math.min(3,energy+1);index++;stage=Math.min(2,Math.floor(index/5));msg("答對！可使用劍氣攻擊魔王");}else{hp=Math.max(0,hp-1);msg("答錯！答案："+t[1][t[2]]+"；"+t[3]);if(hp===0){hp=3;score=Math.max(0,score-100);msg("生命歸零，重新挑戰！")}}stats.textContent="❤️"+hp+"　⭐"+score+"　⚡"+energy+"/3　關卡 "+(stage+1)+"/3";quiz=false;active=true;qbox.style.display="none";if(index>=15){active=false;overlay.style.display="flex";document.querySelector("#panel h1").textContent="🏆 全員勝利！";document.querySelector("#start").textContent="再玩一次";index=score=stage=0;energy=0;}}function action(a){if(a==="quiz"){if(!quiz)showQuestion();return}if(quiz||!active)return;if(a==="jump"&&y===0)vy=8;if(a==="hit"){attack=.5;msg("劍氣命中！答題補充能量")}if(a==="super"){if(energy<3){msg("連續答對累積 3 格能量");return}energy=0;attack=1.2;msg("⚡ 龍吟破天斬！");stats.textContent="❤️"+hp+"　⭐"+score+"　⚡0/3　關卡 "+(stage+1)+"/3"}}document.querySelector("#start").onclick=start;document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(ev,()=>keys[k]=false)});document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action));document.addEventListener("keydown",e=>{if(["w","a","s","d","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[({ArrowUp:"w",ArrowLeft:"a",ArrowDown:"s",ArrowRight:"d"})[e.key]||e.key]=true;if(e.key===" ")action("jump");if(e.key==="j")action("hit");if(e.key==="k")action("super");if(e.key==="q")action("quiz")});document.addEventListener("keyup",e=>keys[({ArrowUp:"w",ArrowLeft:"a",ArrowDown:"s",ArrowRight:"d"})[e.key]||e.key]=false);addEventListener("blur",()=>{Object.keys(keys).forEach(k=>keys[k]=false)});function draw2(){const w=canvas.width,h=canvas.height,c=ctx;c.fillStyle="#0a1a31";c.fillRect(0,0,w,h);c.fillStyle="#172d43";c.fillRect(0,h*.6,w,h*.4);c.strokeStyle="#39536b";c.lineWidth=2;for(let i=-10;i<12;i++){let xx=w/2+i*w/10;c.beginPath();c.moveTo(xx,h*.6);c.lineTo(w/2+(xx-w/2)*3,h);c.stroke()}for(let j=0;j<6;j++){let yy=h*(.6+.4*j*j/25);c.beginPath();c.moveTo(0,yy);c.lineTo(w,yy);c.stroke()}const px=w/2+x*24*devicePixelRatio,py=h*.69-y*15*devicePixelRatio;c.fillStyle="#e7d6b6";c.beginPath();c.arc(px,py-37*devicePixelRatio,12*devicePixelRatio,0,7);c.fill();c.fillStyle="#66c1e0";c.fillRect(px-11*devicePixelRatio,py-25*devicePixelRatio,22*devicePixelRatio,40*devicePixelRatio);c.fillStyle="#da6474";c.fillRect(w*.76,h*.65,55*devicePixelRatio,80*devicePixelPixelRatioSafe());if(attack>0){c.strokeStyle="#f9e6ac";c.lineWidth=7*devicePixelRatio;c.beginPath();c.arc(px+16*devicePixelRatio,py-15*devicePixelRatio,55*devicePixelRatio,-1.4,.8);c.stroke()}}function devicePixelPixelRatioSafe(){return devicePixelRatio}function tick(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;if(active){const speed=5*dt;x+=((keys.d?1:0)-(keys.a?1:0))*speed;z+=((keys.s?1:0)-(keys.w?1:0))*speed;x=Math.min(8,Math.max(-8,x));z=Math.min(6,Math.max(-6,z));if(y>0||vy>0){vy-=19*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0}attack=Math.max(0,attack-dt)}if(ready){hero.position.set(x,y,z);boss.position.set(4,1,-4);camera.position.lerp(new window.THREE.Vector3(x,8,z+15),.08);camera.lookAt(x,1,z);renderer.render(scene,camera)}else draw2();requestAnimationFrame(tick)}resize();addEventListener("resize",resize);requestAnimationFrame(tick);const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js";script.onload=()=>{try{const T=window.THREE;if(!T)throw Error("3D module unavailable");renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));scene=new T.Scene();scene.background=new T.Color("#0a1931");scene.add(new T.HemisphereLight(0xc9e8ff,0x364249,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(4,12,5);scene.add(light);camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);const mat=(col)=>new T.MeshStandardMaterial({color:col});const ground=new T.Mesh(new T.BoxGeometry(26,.5,26),mat("#27465d"));ground.position.y=-.4;scene.add(ground);for(let i=-5;i<6;i++){for(let j=-5;j<6;j++){if((i+j)%5!==0)continue;const ob=new T.Mesh(new T.BoxGeometry(1,2+(i+5)%4,1),mat("#425b74"));ob.position.set(i*2,ob.geometry.parameters.height/2,-j*2);scene.add(ob)}}hero=new T.Group();const body=new T.Mesh(new T.CapsuleGeometry(.5,1.2,5,8),mat("#4ec9dd"));body.position.y=1.1;hero.add(body);const head=new T.Mesh(new T.SphereGeometry(.36,16,12),mat("#f2d5b2"));head.position.y=2.25;hero.add(head);scene.add(hero);boss=new T.Mesh(new T.ConeGeometry(1.25,3.4,8),mat("#ba536e"));scene.add(boss);ready=true;resize();mode.textContent="一元一次方程式 | WebGL 真 3D";}catch(e){ready=false;renderer=null;mode.textContent="一元一次方程式 | 2D 備援"}};script.onerror=()=>mode.textContent="一元一次方程式 | 2D 備援";document.head.append(script);
})();
</script></html>
