<!doctype html>
<html lang="zh-Hant-TW">
<head>

<title>墨刃｜方程式劍客・可愛武俠版</title>
<style>
:root{color-scheme:dark;--gold:#ffe39b;--teal:#9cf4df;--ink:#12233b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c32;color:#fff;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#top{position:fixed;z-index:2;left:0;right:0;top:env(safe-area-inset-top);padding:7px clamp(8px,2vw,20px);display:none;pointer-events:none;text-shadow:0 2px 4px #111}#row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(12px,2vw,18px);font-weight:900}#problem{background:#10213bdd;border:2px solid #ffe39b;border-radius:14px;padding:5px 14px;font-size:clamp(18px,3.3vw,30px);text-align:center;box-shadow:0 3px 12px #07101c99;min-width:min(50vw,420px)}#meta{display:flex;gap:10px;align-items:center;white-space:nowrap}.pill{padding:4px 9px;border:1px solid #ffffff66;border-radius:10px;background:#10213bcc}#controls{position:fixed;z-index:3;left:50%;bottom:calc(7px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:clamp(7px,2vw,22px);width:min(760px,99vw);pointer-events:none}#move,#actions{display:flex;gap:7px;align-items:center;pointer-events:auto}button{font:inherit;color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent}#controls button{border:2px solid #d8f8edaa;background:linear-gradient(150deg,#31627d,#18364e);border-radius:19px;box-shadow:0 5px 0 #0a1c2d,0 0 16px #70e7d633;font-weight:950;text-shadow:0 2px 3px #06101a}#controls button.pressed,#controls button:active{transform:translateY(3px);box-shadow:0 2px 0 #0a1c2d;background:#388c91}#move button{width:clamp(52px,12vw,78px);height:clamp(56px,13vw,82px);font-size:clamp(25px,5vw,38px)}#actions button{height:clamp(52px,12vw,76px);min-width:clamp(56px,12vw,76px);padding:4px 9px;font-size:clamp(12px,2.3vw,16p ius:15px;background:#19384b;padding:12px;text-align:left;color:#e6f6eb}.badge{color:#9ceadc;font-weight:900;letter-spacing:2px}.muted{font-size:13px;color:#c2d8dc}@media(max-width:560px){#controls{gap:5px}#move{gap:4px}#actions{gap:4px}#controls button{border-radius:14px}#meta{gap:4px}#problem{min-width:42vw;padding:4px 8px}#tip{bottom:calc(91px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="game" aria-label="方程式劍客遊戲畫面"></canvas>
<header id="top"><div id="row"><span class="pill" id="stage">初階</span><strong id="problem">解出 x</strong><span id="meta"><span class="pill" id="progress">1 / 10</span><span class="pill" id="lives">♥ ♥ ♥</span><span class="pill" id="hp">氣血 100</span></span></div></header>
<div id="tip">攻擊自動瞄準最近答案｜可點方塊切換目標｜短按揮劍・長按蓄力｜跳躍閃避</div>
<button id="sound" aria-label="切換音效">♫ 音效</button>
<div id="controls"><div id="move"><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button></div><div id="actions"><button data-key="jump" aria-label="跳躍閃避">⬆ 跳躍</button><button id="attack" aria-label="短按攻擊，長按蓄力"><span>⚔ 攻擊<br><small id="chargeText">短按出招</small></span></button></div></div>
<div id="panel"><main id="card"></main></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),W=960,H=540,ground=444,plat=[{x:170,w:220,y:355},{x:575,w:215,y:330}];
let dpr=1,scale=1,ox=0,oy=0,mode='menu',stage=0,qi=0,bossCount=0,lives=3,hp=100,energy=35,hero={x:460,y:ground,vy:0,face:1,ground:true},targets=[],bullets=[],enemyShots=[],particles=[],trail=[],question=null,selected=-1,keys={},last=0,elapsed=0,shotAt=0,enemyAt=0,flash=0,shake=0,hitStop=0,slow=0,zoom=1,combo=0,muted=false,chargeStart=0,charging=false,attackHeld=false,attackPointer=-1,damageTimer=0,runToken=0,loopGeneration=0,audio=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);scale=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy)}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(){let difficulty=stage===0?qi<5?0:1:qi<5?2:3,x=rand(-8,12),a=rand(2,5+difficulty),b=rand(-7,9+difficulty*2),c=a*x+b,form=rand(0,difficulty===0?1:3),text,explain;
 if(form===0){text=`${a}x ${b<0?'− '+Math.abs(b):'+ '+b} = ${c}`;explain=`先把常數項移到等號右邊：${a}x = ${c-b}。再除以 ${a}，所以 x = ${x}。`}
 else if(form===1){let m=rand(2,5);x=m*rand(-4,5);let rhs=x/m+b;text=`x ÷ ${m} ${b<0?'− '+Math.abs(b):'+ '+b} = ${rhs}`;explain=`先移項，得到 x ÷ ${m} = ${rhs-b}；兩邊乘以 ${m}，所以 x = ${x}。`}
 else if(form===2){let d=rand(1,4);if(a===d)a++;let e=(a-d)*x+b;text=`${a}x ${b<0?'− '+Math.abs(b):'+ '+b} = ${d}x ${e<0?'− '+Math.abs(e):'+ '+e}`;explain=`把含 x 的項移到左邊、常數移到右邊：${a-d}x = ${e-b}，所以 x = ${x}。`}
 else{let m=rand(2,5);b=m*rand(-3,4)-a*x;let v=a*x+b;text=`(${a}x ${b<0?'− '+Math.abs(b):'+ '+b}) ÷ ${m} = ${v/m}`;explain=`先乘以 ${m}：${a}x ${b<0?'− '+Math.abs(b):'+ '+b} = ${v}。移項並除以 ${a}，得到 x = ${x}。`}
 const ans=x,opts=[ans];let candidates=shuffle([ans-3,ans+3,ans-2,ans+2,ans-1,ans+1,ans+4,ans-4]);for(const n of candidates){if(!opts.includes(n))opts.push(n);if(opts.length===4)break}shuffle(opts);return {text,answer:ans,opts,explain}}
function setQuestion(){question=makeQuestion();selected=-1;targets=question.opts.map((n,i)=>({n,x:[150,370,615,820][i],y:i%2?plat[0].y:ground,level:i%2?1:0,phase:Math.random()*8,flash:0,sx:1,sy:1}));enemyAt=elapsed+rand(4,7);updateHud()}
function updateHud(){$('#stage').textContent=stage===0?'初階｜劍竹道':stage===1?'進階｜雲霧山門':'魔王戰｜連對 '+bossCount+'/5';$('#progress').textContent=stage===2?'連對 '+bossCount+' / 5':`${qi+1} / 10`+(stage===1?'　進階':'');$('#problem').textContent=question?.text||'解出 x';$('#lives').textContent='♥ '.repeat(Math.max(0,lives)).trim()||'0 命';$('#hp').textContent='氣血 '+Math.max(0,Math.ceil(hp));$('#attack').style.setProperty('--charge',energy);$('#chargeText').textContent=charging?`蓄力 ${Math.floor(energy)}%`:energy>=70?'絕技就緒':'短按出招'}
function startStage(n){if(mode==='play'||mode==='finish')return;runToken++;mode='play';stage=n;qi=0;bossCount=0;lives=n===0?3:lives;hp=100;energy=n===0?35:Math.max(30,energy);hero={x:460,y:ground,vy:0,face:1,ground:true};bullets=[];enemyShots=[];particles=[];trail=[];combo=0;elapsed=0;$('#panel').classList.add('hide');$('#top').style.display='block';$('#controls').style.display='flex';$('#tip').style.display='block';$('#sound').style.display='block';setQuestion();resumeLoop()}
function menu(){mode='menu';$('#top').style.display='none';$('#controls').style.display='none';$('#tip').style.display='none';$('#sound').style.display='none';$('#panel').classList.remove('hide');$('#card').innerHTML='<div class="badge">數學課堂遊戲・墨刃</div><h1>⚔ 方程式劍客</h1><p class="lead"><b>一元一次方程式 × 可愛武俠風</b><br>化身小劍客，找出正確的 x，擊退答案妖怪！</p><div class="spec"><span>初階 10 題</span><span>進階 10 題</span><span>每關 3 命</span><span>魔王連對 5 題</span><span>手機／電腦可玩</span></div><p class="muted">直接按攻擊，劍氣會自動瞄準最近的答案方塊；也可點方塊指定目標。短按普通劍氣，長按蓄力發射絕技；跳起躲開敵人飛鏢。</p><p><button class="primary" id="start">開始闖關</button> <button class="secondary" id="how">操作說明</button></p><p class="muted">操作：觸控畫面按鈕，或鍵盤 ← → 移動、空白鍵跳躍、J／F 攻擊。按住 J／F 蓄力。</p>';
 $('#start').onclick=()=>{unlock();startStage(0)};$('#how').onclick=()=>$('#card').insertAdjacentHTML('beforeend','<div class="explain"><b>闖關方式</b><br>① 直接按攻擊，劍氣會自動瞄準最近答案方塊；想指定目標時才點選方塊。② 答錯會出現解題步驟，可直接再攻擊。③ 被飛鏢擊中會減少氣血，氣血歸零扣 1 命。④ Boss 戰要連續答對 5 題。</div>')}
function panel(title,body,buttons){mode='panel';clearInputs();$('#top').style.display='none';$('#controls').style.display='none';$('#tip').style.display='none';$('#sound').style.display='none';$('#panel').classList.remove('hide');$('#card').innerHTML=`<div class="badge">方程式劍客・可愛武俠版</div><h1>${title}</h1>${body}<p>${buttons.map((b,i)=>`<button class="${i===0?'primary':'secondary'}" data-i="${i}">${b[0]}</button>`).join('')}</p>`;buttons.forEach((b,i)=>$('#card').querySelector(`[data-i="${i}"]`).onclick=b[1])}
function showExplain(correct){const q=question;panel(correct?'🎉 解題成功！':`📜 解題提示｜答案是 ${q.answer}`,`<div class="explain"><b>${q.text}</b><br>${q.explain}</div>${correct?'<p class="lead">漂亮命中！繼續前進。</p>':'<p class="muted">攻擊會自動鎖定最近答案；可直接再攻擊，也可點選別的數字方塊。已扣少量氣血。</p>'}`,correct?[[stage===2&&bossCount>=5?'完成挑戰':'繼續',()=>advance()]]:[['繼續作答',()=>{mode='play';$('#panel').classList.add('hide');$('#top').style.display='block';$('#controls').style.display='flex';$('#tip').style.display='block';$('#sound').style.display='block';resumeLoop()}],['回主選單',menu]])}
function advance(){if(mode!=='panel')return;if(stage<2){qi++;if(stage<2&&qi>=10){if(stage===0){startStage(1);return}panel('🌸 進階關卡完成','<p class="lead">兩關題目都突破了！接下來迎戰魔王，連續答對 5 題即可獲勝。</p>',[['迎戰魔王',()=>startStage(2)],['回主選單',menu]]);return}setQuestion()}else{bossCount++;if(bossCount>=5){victory();return}setQuestion()}mode='play';$('#panel').classList.add('hide');$('#top').style.display='block';$('#controls').style.display='flex';$('#tip').style.display='block';$('#sound').style.display='block';resumeLoop()}
function victory(){panel('🏆 全員勝利！','<p class="lead">答案妖怪全數退散！</p><p>初階 10 題、進階 10 題，並連續答對魔王題 5 題。</p><div class="spec"><span>最終連擊 '+bossCount+' 題</span><span>剩餘命數 '+lives+' 命</span></div>',[['再玩一次',()=>startStage(0)],['回主選單',menu]])}
function lose(){panel('💫 小劍客需要休息','<p>這次闖到第 '+(stage===2?'魔王連對 '+bossCount:((stage*10+qi+1)+' 題'))+'。看過解題步驟再挑戰一次吧！</p>',[['重新挑戰',()=>startStage(0)],['回主選單',menu]])}
function unlock(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext);audio.resume()}catch(_){}}
function tone(freq,dur=.12,wave='triangle',vol=.07){if(muted)return;try{unlock();let o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
function snd(k){tone(k==='hit'?190:k==='bad'?105:k==='jump'?420:k==='damage'?75:k==='ultimate'?740:300,k==='ultimate'?.4:.14,k==='damage'?'sawtooth':'triangle',k==='hit'?.1:.065)}
function clearInputs(){keys={};charging=false;attackHeld=false;attackPointer=-1;document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('pressed'));$('#attack').style.setProperty('--charge',energy)}
function jump(){if(mode!=='play')return;if(hero.ground){hero.vy=-520;hero.ground=false;snd('jump');squash(.82,1.18)}}
function aimIndex(){if(selected>=0&&targets[selected])return selected;let best=-1,distance=Infinity;targets.forEach((t,i)=>{const d=Math.hypot(t.x-hero.x,t.y-hero.y);if(d<distance){best=i;distance=d}});return best}
function fire(ultimate=false){if(mode!=='play'||elapsed-shotAt<.28)return;shotAt=elapsed;let t=selected>=0?targets[selected]:targets[aimIndex()];if(!t)return;hero.face=t.x>=hero.x?1:-1;let sx=hero.x+hero.face*24,sy=hero.y-50,total=Math.max(.2,Math.hypot(t.x-sx,t.y-55-sy)/900);bullets.push({x:sx,y:sy,sx,sy,target:t,life:total,total,ultimate});snd(ultimate?'ultimate':'slash');if(ultimate)energy=10;else energy=Math.min(100,energy+14);updateHud()}
function attackDown(e){e?.preventDefault?.();if(mode!=='play'||attackHeld)return;unlock();attackPointer=Number.isInteger(e?.pointerId)?e.pointerId:-1;attackHeld=true;charging=true;chargeStart=performance.now();$('#attack').classList.add('pressed')}
function attackUp(e){e?.preventDefault?.();if(!attackHeld)return;if(attackPointer!==-1&&e?.pointerId!==undefined&&e.pointerId!==attackPointer)return;let hold=performance.now()-chargeStart;attackHeld=false;charging=false;attackPointer=-1;$('#attack').classList.remove('pressed');if(hold>360&&energy>=70)fire(true);else fire(false);updateHud()}
function hitTarget(t,ultimate=false){if(mode!=='play')return;t.flash=.14;t.sx=.7;t.sy=1.2;hitStop=reduced?0:.045;shake=reduced?0:(ultimate?8:2);flash=reduced?0:.07;debris(t.x,t.y-34,ultimate?10:7);combo++;energy=Math.min(100,energy+(ultimate?24:8));const correct=t.n===question.answer;if(correct){snd('hit');if(combo>1)tone(392*Math.pow(2,(Math.min(combo,10)-1)/12),.2,'sine',.05);if(stage===2&&bossCount+1>=5){slow=reduced?0:.7;zoom=reduced?1:1.1;if(slow){mode='finish';setTimeout(()=>{if(mode==='finish')showExplain(true)},700)}else showExplain(true)}else showExplain(true)}else{combo=0;hp-=16;bossCount=0;snd('bad');showExplain(false)}updateHud()}
function debris(x,y,count){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:-rand(80,280),life:.42+Math.random()*.34,size:rand(3,8),col:['#ffe99b','#83e8df','#f79b83','#fff'][i%4]})}
function squash(x,y){if(selected>=0&&targets[selected]){targets[selected].sx=x;targets[selected].sy=y}}
function hurt(){if(elapsed<damageTimer)return;damageTimer=elapsed+1.05;hp-=25;shake=reduced?0:5;flash=.11;snd('damage');if(hp<=0){lives--;bossCount=0;hp=100;energy=Math.max(20,energy-15);if(lives<=0){lose();return}}updateHud()}
function canvasPick(e){if(mode!=='play')return;let x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale,hit=-1,best=1e9;targets.forEach((t,i)=>{let d=Math.hypot(x-t.x,y-(t.y-30));if(d<72&&d<best){hit=i;best=d}});if(hit>=0){selected=hit;return}}
canvas.addEventListener('pointerdown',canvasPick);$('#attack').addEventListener('pointerdown',e=>{try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}attackDown(e)});for(const n of ['pointerup','pointercancel','lostpointercapture'])addEventListener(n,attackUp);
document.querySelectorAll('#controls [data-key]').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();unlock();try{b.setPointerCapture(e.pointerId)}catch(_){}keys[k]=true;b.classList.add('pressed');if(k==='jump')jump()},up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);for(const n of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,up)});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','j','J','f','F'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key===' '){keys.jump=true;jump()}if('jJfF'.includes(e.key)){keys.attack=true;attackDown(e)}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key===' ')keys.jump=false;if('jJfF'.includes(e.key)){keys.attack=false;attackUp(e)}});addEventListener('blur',clearInputs);addEventListener('pagehide',clearInputs);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInputs()});document.addEventListener('contextmenu',e=>e.preventDefault());$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'♫ 靜音':'♫ 音效'};
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke()}}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a9d9d2');g.addColorStop(.5,'#dfedcf');g.addColorStop(1,'#f7d8a1');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#e8f7dc';ctx.beginPath();ctx.arc(790,110,42,0,Math.PI*2);ctx.fill();for(let i=0;i<7;i++){let x=i*175-30;ctx.fillStyle=i%2?'#7bb6a1':'#639a8d';ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+85,170+(i%3)*24);ctx.lineTo(x+205,ground);ctx.fill();ctx.fillStyle='#f2f3d3aa';ctx.beginPath();ctx.ellipse(x+100,270,72,18,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#c47b63';ctx.fillRect(742,217,128,112);ctx.fillStyle='#7f554c';ctx.beginPath();ctx.moveTo(722,218);ctx.lineTo(806,160);ctx.lineTo(892,218);ctx.fill();ctx.fillStyle='#ffe8ab';ctx.fillRect(790,261,28,68);ctx.fillStyle='#d6aa70';ctx.fillRect(0,ground,W,H-ground);for(let i=0;i<15;i++){let x=(i*87+elapsed*18)%W;ctx.fillStyle='#e6bb75';ctx.beginPath();ctx.ellipse(x,471+(i%3)*18,16,4,0,0,Math.PI*2);ctx.fill()}plat.forEach((p,i)=>{rounded(p.x,p.y,p.w,20,8,i?'#86594c':'#966b4f','#ffe0a2');ctx.fillStyle='#e5bc78';ctx.fillRect(p.x+10,p.y+5,p.w-20,4)})}
function drawHero(){trail.push({x:hero.x,y:hero.y-20});if(trail.length>12)trail.shift();trail.forEach((p,i)=>{ctx.globalAlpha=(i+1)/trail.length*.16;ctx.fillStyle='#fff0b0';ctx.beginPath();ctx.arc(p.x,p.y,14*(i+1)/trail.length,0,7);ctx.fill()});ctx.globalAlpha=1;let bob=hero.ground?Math.sin(elapsed*8)*2:0;ctx.save();ctx.translate(hero.x,hero.y-24+bob);ctx.scale(hero.face,1);ctx.fillStyle='#213751';ctx.beginPath();ctx.ellipse(0,0,23,14,0,0,7);ctx.fill();ctx.fillStyle='#f6c99b';ctx.beginPath();ctx.arc(0,-41,15,0,7);ctx.fill();ctx.fillStyle='#272b3d';ctx.beginPath();ctx.arc(-1,-46,16,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#e6f1f1';ctx.fillRect(-13,-23,26,31);ctx.fillStyle='#e97678';ctx.fillRect(-13,-19,26,6);ctx.fillStyle='#355e9d';ctx.fillRect(-12,4,10,19);ctx.fillRect(2,4,10,19);ctx.strokeStyle='#f8e49d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(12,-25);ctx.lineTo(38,-49);ctx.stroke();ctx.strokeStyle='#fff9dd';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(34,-45);ctx.lineTo(49,-61);ctx.stroke();ctx.fillStyle='#6b493d';ctx.fillRect(-5,-59,7,4);ctx.restore()}
function drawTarget(t,i){let bob=Math.sin(elapsed*3+t.phase)*4;let aimed=i===aimIndex();ctx.save();ctx.translate(t.x,t.y-36+bob);ctx.scale(t.sx,t.sy);t.sx+=(1-t.sx)*.2;t.sy+=(1-t.sy)*.2;ctx.fillStyle=aimed?'#fff3a6':'#f5d8a9';ctx.shadowColor=aimed?'#fff2a2':'#0005';ctx.shadowBlur=aimed?18:5;rounded(-31,-22,62,49,14,aimed?'#ffedb7':'#d9eff0',aimed?'#fff':'#fff1ce');ctx.shadowBlur=0;ctx.fillStyle='#37536b';ctx.beginPath();ctx.arc(-10,-7,3,0,7);ctx.arc(10,-7,3,0,7);ctx.fill();ctx.strokeStyle='#b86666';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,7,.2,Math.PI-.2);ctx.stroke();rounded(-36,-60,72,28,10,'#984e4e','#ffe39b');ctx.fillStyle='#fff6d7';ctx.textAlign='center';ctx.font='900 20px system-ui';ctx.fillText(String(t.n),0,-40);if(stage===2){ctx.fillStyle='#ffeaa3';ctx.font='bold 13px system-ui';ctx.fillText('魔王答案',0,45)}ctx.restore()}
function drawEnemy(){if(mode!=='play')return;let x=elapsed%10<6?35:925,y=elapsed%2?ground-24:ground-60;ctx.save();ctx.translate(x,y);ctx.fillStyle='#853f55';ctx.beginPath();ctx.ellipse(0,0,25,24,0,0,7);ctx.fill();ctx.fillStyle='#f0c39b';ctx.beginPath();ctx.arc(0,-17,13,0,7);ctx.fill();ctx.fillStyle='#5c4458';ctx.beginPath();ctx.moveTo(-13,-22);ctx.lineTo(-24,-42);ctx.lineTo(-5,-32);ctx.lineTo(12,-43);ctx.lineTo(10,-20);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-6,-20,4,3);ctx.fillRect(4,-20,4,3);ctx.restore()}
function draw(){ctx.save();let sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2+sx,-H/2+sy);background();drawEnemy();targets.forEach(drawTarget);bullets.forEach(b=>{ctx.fillStyle=b.ultimate?'#fff5a1':'#bdf5ef';ctx.shadowBlur=b.ultimate?17:9;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.ellipse(b.x,b.y,b.ultimate?18:10,5,0,0,7);ctx.fill();ctx.shadowBlur=0});enemyShots.forEach(b=>{ctx.fillStyle='#fa8c81';ctx.beginPath();ctx.arc(b.x,b.y,8,0,7);ctx.fill()});drawHero();particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}ctx.restore()}
function resumeLoop(){last=performance.now();const generation=++loopGeneration;requestAnimationFrame(now=>loop(now,generation))}
function loop(now,generation){if(generation!==loopGeneration)return;if(mode==='finish'){let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt*.3;draw();requestAnimationFrame(t=>loop(t,generation));return}if(mode!=='play')return;let dt=Math.min(.04,(now-last)/1000);last=now;if(hitStop>0){hitStop-=dt;draw();requestAnimationFrame(t=>loop(t,generation));return}let actual=dt*(slow>0?.3:1);elapsed+=actual;if(slow>0){slow-=dt;if(slow<=0)zoom=1}if(shake>0)shake=Math.max(0,shake-dt*22);if(flash>0)flash=Math.max(0,flash-dt*.8);if(charging&&attackHeld){energy=Math.min(100,energy+dt*48);updateHud()}if(keys.left){hero.x=Math.max(24,hero.x-235*actual);hero.face=-1}if(keys.right){hero.x=Math.min(W-24,hero.x+235*actual);hero.face=1}hero.y+=hero.vy*actual;if(!hero.ground){hero.vy+=1150*actual;if(hero.y>=ground){hero.y=ground;hero.vy=0;hero.ground=true}}if(elapsed-shotAt>1.2&&energy<100)energy=Math.min(100,energy+actual*4);
 bullets.forEach(b=>{b.life-=actual;let p=1-b.life/b.total;b.x=b.sx+(b.target.x-b.sx)*p;b.y=b.sy+(b.target.y-55-b.sy)*p;if(b.life<=0&&b.target){hitTarget(b.target,b.ultimate);b.target=null}});bullets=bullets.filter(b=>b.life>0);if(elapsed>enemyAt){enemyShots.push({x:elapsed%10<6?78:882,y:ground-55,vx:elapsed%10<6?115:-115});enemyAt=elapsed+rand(4,7)}enemyShots.forEach(b=>{b.x+=b.vx*actual;if(Math.abs(b.x-hero.x)<21&&Math.abs(b.y-(hero.y-25))<42){if(hero.ground)hurt();b.x=-100}});enemyShots=enemyShots.filter(b=>b.x>-20&&b.x<W+20);particles.forEach(p=>{p.x+=p.vx*actual;p.y+=p.vy*actual;p.vy+=560*actual;p.life-=actual});particles=particles.filter(p=>p.life>0);targets.forEach(t=>{if(t.flash>0)t.flash-=actual});draw();requestAnimationFrame(t=>loop(t,generation))}
menu();
})();
