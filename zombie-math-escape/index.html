isabled{opacity:.55}#start{background:linear-gradient(120deg,#142820,#1c3136 60%,#3a4931)}#mission{border-color:#e7bc62} @media(max-width:550px){#courses{grid-template-columns:1fr}} #ending{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 35%,#6d261e,#100c12 70%);color:#fff5dc}#ending.win{background:radial-gradient(ellipse at 50% 30%,#a98945,#183b40 75%)}#ending h1{font-size:clamp(40px,9vw,100px);margin:8px;text-shadow:0 4px 15px #000}#ending svg{width:min(65vw,500px);max-height:34dvh}#ending button{min-width:120px;margin:5px;font-weight:bold}#ending p{margin:5px}#ending .resultActions{display:flex;flex-wrap:wrap;justify-content:center}#game{background:#0d1716}#start h1{text-shadow:0 3px 10px #000}#start{border-color:#7f996c} </style><section id="ending" hidden><div id="endArt"></div><h1 id="endTitle"></h1><p id="endReason"></p><p id="endStats"></p><div class="resultActions"><button id="endRetry">重新挑戰</button><button id="endHome">返回首頁</button></div></section><div id="app"><header><span>15 ｜ 數學幻境</span><span id="hud">一元一次方程式</span><button id="home">首頁</button></header><section id="start"><small style="letter-spacing:3px;color:#e3bd80">CASE 015 · 緊急感染封鎖</small><h1>殭屍校園｜密室逃生 V1.0 試玩</h1><p>校園爆發虛構病毒感染，出口遭緊急封鎖。調查五處現場，蒐集證詞、紀錄與干擾資訊，找出未知數、建立方程式、求解並驗證，最後帶著檔案逃離殭屍。</p><p>方向鍵／觸控移動，靠近物件按互動。探索期間殭屍會追擊；閱讀和解題視窗開啟時，敵人與時間暫停。每區找到兩份線索、取得磁卡、自行輸入方程式、求解並尋找正確編號的證物，再於45秒內抵達出口。最後組合五個數字碎片。逾時重啟該區封印；三顆心耗盡即失敗，完成五區即勝利。</p><div id="courses"><b>選擇課程</b><button class="course selected" id="linear">國一｜一元一次方程式應用</button><button class="course" disabled>國三｜推理與證明（預留）</button><button class="course" disabled>國一｜二元一次聯立方程式（預留）</button><button class="course" disabled>國二｜一元二次方程式（預留）</button></div><label>難度 <select id="level"><option>初階</option><option>進階</option></select></label> <button id="begin">開始冒險</button></section><div id="mission" hidden><div id="missionText"></div><button id="missionToggle" type="button">收合</button></div><main id="game" hidden><canvas id="c" width="960" height="540"></canvas><div id="cameraTools"><button id="rotL" aria-label="向左旋轉">↶</button><button id="rotR" aria-label="向右旋轉">↷</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="縮小">−</button><button id="camReset">復位</button></div><section id="panel" hidden><h2 id="pt"></h2><div id="body"></div><div id="options"></div></section></main><div id="msg" aria-live="polite"></div><div id="controls" hidden><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button><button id="act">調查 E</button><button id="dash">閃避</button><button id="notes">線索簿</button><button id="sound">音效 開</button></div></div><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let cardFound=false,escape=0,decoded=false,fragments=[],zombies=[],stamina=100;const obstaclesByStage=[[[3,2],[3,3],[3,4],[6,3],[6,4]],[[3,1],[3,2],[3,3],[6,4],[6,5],[6,6]],[[4,2],[4,3],[4,4],[6,2],[6,3]],[[3,3],[4,3],[5,3],[6,3],[3,6]],[[3,2],[4,2],[5,2],[6,2],[4,5]]];function blocked(x,y){return obstaclesByStage[stage].some(([a,b])=>Math.abs(x-a)<.72&&Math.abs(y-b)<.72)}function walk(o,dx,dy){let x=Math.max(0,Math.min(9,o.x+dx)),y=Math.max(0,Math.min(7,o.y+dy));if(!blocked(x,o.y))o.x=x;if(!blocked(o.x,y))o.y=y}function zombieStep(dt){for(let z of zombies){let d=Math.hypot(px-z.x,py-z.y),chase=solved||d<2.5,tx=chase?px:z.ax+Math.sin(phase*.7+z.ax)*1.3,ty=chase?py:z.ay+Math.cos(phase*.7+z.ay)*1.1;let len=Math.hypot(tx-z.x,ty-z.y)||1,speed=chase?(solved?1.7:1.05):.65;walk(z,(tx-z.x)/len*speed*dt,(ty-z.y)/len*speed*dt);if(immune===0&&d<.60){lose('遭到殭屍碰撞');if(!playing)break}}}let errors={read:0,eq:0,calc:0,verify:0},cool=0;let stage=0,hp=3,seen=[],solved=false,playing=false,modal=false,px=1,py=1,keys={},last=0,immune=0,elapsed=0,mute=false,audio,phase=0,questions=[],dash=0,feedback='';const themes=['封鎖教室','殭屍圖書館','病毒研究室','地下停車場','屋頂救援區'],colors=['#315e68','#52446d','#675244','#28606c','#4c386b'];const spots=[{x:2,y:6,n:'收據／證詞',type:0},{x:7,y:1,n:'付款／紀錄',type:1},{x:4,y:1,n:'上鎖抽屜',type:4},{x:1,y:4,n:'現場紀錄',type:5},{x:7,y:6,n:'密碼台',type:2},{x:9,y:4,n:'出口',type:3},{x:2,y:3,n:'物件甲',type:6},{x:5,y:5,n:'物件乙',type:7},{x:8,y:2,n:'物件丙',type:8}];function make(i,hard){let x=3+Math.floor(Math.random()*8),a=hard?4:2,b=hard?15:5;switch(i){case 0:return {cl:[`福利社收據：買了 ${a} 本同價筆記本，另買一支 ${b} 元的筆。`,`付款紀錄：共付 ${a*x+b} 元。`],ask:'一本筆記本多少元？設 x 為一本筆記本的價錢。',eq:[`${a}x + ${b} = ${a*x+b}`,`${a}(x + ${b}) = ${a*x+b}`,`x + ${a+b} = ${a*x+b}`],x,unit:'元'};case 1:return {cl:[`甲書架的書比乙書架的 ${a} 倍多 ${b} 本。`,`兩架共有 ${(a+1)*x+b} 本書。`],ask:'乙書架有幾本書？設 x 為乙書架的書量。',eq:[`x + ${a}x + ${b} = ${(a+1)*x+b}`,`${a}x + ${b} = ${(a+1)*x+b}`,`x + ${a}x
