<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學翻牌對決 V2.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#14253b;color:#fff;font:600 16px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:12px}h1{font-size:clamp(22px,3vw,42px);margin:8px 0}a{color:#b8dcff}button,select{font:inherit;border:2px solid #a8c6e8;border-radius:10px;padding:10px;background:#263e5c;color:white;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #fbd873}button:disabled{cursor:default}label{display:grid;gap:5px}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:18px 0}.panel{max-width:850px;margin:auto;padding:20px;background:#20354d;border-radius:14px}.start{background:#ffe29b;color:#17263a;width:100%;font-size:22px}.hidden{display:none!important}.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.scores{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.scores span{padding:6px 12px;border:2px solid #67829d;border-radius:8px}.scores .turn{border-color:#ffdc68;background:#ffe29b;color:#18273a}#status{font-size:clamp(16px,2.5vw,30px);min-height:1.5em;margin:8px 0;text-align:center;color:#fff2b3}#board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:8px}.tile{position:relative;min-width:0;min-height:76px;aspect-ratio:1.65;background:#25496d;border:3px solid #a9c9e8;display:grid;place-content:center;text-align:center;padding:6px;overflow-wrap:anywhere}.tile .number{font-size:clamp(22px,4vw,48px);color:#fff}.tile .kind{font-size:clamp(11px,1.4vw,18px);letter-spacing:1px}.tile .formula{font-size:clamp(18px,3vw,44px);line-height:1.22;font-weight:900;color:#12253a}.tile.q{background:#fff2ce;border-color:#ba8121;color:#614412}.tile.a{background:#e0f3ff;border-color:#347da7;color:#214d68}.tile.done{background:#d4f7df;border-color:#25834c;color:#14512d}.tile.bad{border-color:#ef4f55;box-shadow:inset 0 0 0 3px #ef4f55}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.05;margin:0 .12em}.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}.frac>span:last-child{padding:0 3px}sup{font-size:.65em}#result{text-align:center;padding:20px;background:#20354d;border-radius:12px;margin-top:12px}body.screen #board{gap:clamp(4px,1vh,12px)}body.screen .tile{aspect-ratio:auto;height:clamp(55px,calc((100dvh - 205px)/var(--rows,4)),180px)}@media(max-width:600px){main{padding:7px}.tile{min-height:68px;aspect-ratio:1.05;padding:3px;border-width:2px}.tile .formula{font-size:clamp(15px,4.1vw,24px)}#board{gap:4px}.panel{padding:12px}}@media(max-height:550px) and (orientation:landscape){body.screen .tile{height:clamp(45px,calc((100dvh - 145px)/var(--rows)),130px)}body.screen .tile .formula{font-size:clamp(15px,4vh,28px)}body.screen h1{font-size:20px;margin:0}body.screen #status{margin:2px 0;font-size:16px}body.screen .scores{margin:3px 0}body.screen .scores span{padding:2px 8px}}
#moleQuestion{text-align:center;font-size:clamp(28px,5vw,62px);font-weight:900;background:#fff2ce;color:#12253a;padding:12px;border-radius:12px;margin:8px 0}#moles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.hole{border:2px solid #7590ad;border-radius:50% 50% 20% 20%;background:#0c192b;min-height:clamp(76px,17vh,155px);display:grid;place-content:center;padding:4px}.hole.active{background:#fff0ca;border-color:#e1ab48;color:#12253a;animation:pop .18s ease-out}.hole .animal{font-size:clamp(25px,5vh,48px);line-height:1}.hole .answer{font-size:clamp(20px,3.5vw,46px);font-weight:900;color:#12253a}.hole.good{background:#d4f7df;border-color:#25834c}.hole.wrong{background:#ffd9d9;border-color:#e04040}#moleClock{text-align:center;font-size:20px;margin:8px;color:#ffecaa}@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}@media(max-height:550px) and (orientation:landscape){.hole{min-height:70px}#moleQuestion{font-size:25px;padding:4px}.hole .animal{font-size:22px}.hole .answer{font-size:22px}#moleClock{margin:2px}}</style></head><body><main><div class="top"><a href="../game-center/">← 遊戲中心</a><h1>數學翻牌對決 V2.1</h1><button id="sound">音效：開</button></div><section id="home" class="panel"><h2>選擇遊戲設定</h2><label>遊戲玩法<select id="playMode"><option value="memory">翻牌記憶對決</option><option value="mole">數學打地鼠</option></select></label><p id="rules">先看全部牌，記住題目與答案的位置，再翻牌配對。配對成功得一分並繼續，失敗換下一組。</p><div class="settings"><label>數學單元<select id="unit"><option value="exp">指數律</option><option value="frac">分數四則</option><option value="expr">一元一次式</option><option value="eq">一元一次方程式</option><option value="gcd">最大公因數與最小公倍數</option><option value="signed">正負數四則</option><option value="prime">因數、倍數與質數</option><option value="mix">混合複習</option></select></label><label>競賽模式<select id="teams"><option value="1">單人練習</option><option value="2">兩組對決</option><option value="3">三組對決</option><option value="4" selected>四組對決</option></select></label><label id="previewSetting">記憶時間<select id="preview"><option>5</option><option>10</option><option selected>15</option><option>20</option></select></label><label id="pairSetting">卡牌數量<select id="pairs"><option value="6">12 張</option><option value="8" selected>16 張</option><option value="10">20 張</option><option value="12">24 張</option></select></label><label id="moleSetting" class="hidden">每組題數<select id="moleCount"><option>5</option><option selected>10</option><option>15</option></select></label><label>裝置<select id="display"><option value="screen">教室大屏</option><option value="phone">手機</option></select></label></div><button class="start" id="start">開始記憶</button></section><section id="game" class="hidden"><div class="top"><div id="scores" class="scores"></div><div><button id="full">全螢幕</button> <button id="exit">返回設定</button></div></div><div role="status" id="status"></div><div id="board"></div><div id="moleArea" class="hidden"><div id="moleQuestion"></div><div id="moles"></div><div id="moleClock"></div></div><div id="result" class="hidden"><h2 id="winner"></h2><button id="again">再玩一次</button></div></section></main><script>
'use strict';const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};const frac=(a,b)=>{let d=gcd(a,b);a/=d;b/=d;return b===1?String(a):'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>'},pow=(a,b)=>a+'<sup>'+b+'</sup>';let cards=[],scores=[],turn=0,first=null,busy=true,phase='home',remaining=0,timer=0,round=0,attempts=0,muted=false,audio;const units=['exp','frac','expr','eq','gcd','signed','prime'];function question(u,medium){let a=rand(2,medium?9:6),b=rand(2,medium?9:6),c=rand(1,5),n=rand(1,15),m=rand(1,10);if(u==='mix')u=units[rand(0,6)];switch(u){case'exp':{let base=rand(2,5),p=rand(1,5),q=rand(1,4);return medium?[pow(base,p+q)+' ÷ '+pow(base,q),pow(base,p),'p'+base+','+p]:[pow(base,p)+' × '+pow(base,q),pow(base,p+q),'p'+base+','+(p+q)]}case'frac':{let d=rand(3,12),x=rand(1,d-1),y=rand(1,d-1),v=medium?x*y:x+y,w=medium?d*d:d;return [frac(x,d)+(medium?' × ':' + ')+frac(y,d),frac(v,w),'f'+v/gcd(v,w)+'/'+w/gcd(v,w)]}case'expr':return [medium?a+'x + '+b+'x − '+c+'x':a+'x + '+b+'x',(a+b-(medium?c:0))+'x','e'+(a+b-(medium?c:0))];case'eq':return [a+'x'+(medium?' + '+c:'')+' = '+(a*n+(medium?c:0)),'x = '+n,'x'+n];case'gcd':{let x=a*c,y=b*c,v=medium?x*y/gcd(x,y):gcd(x,y);return [(medium?'LCM':'GCD')+'('+x+', '+y+')',String(v),'n'+v]}case'signed':return [medium?'(−'+a+') × '+b:'(−'+n+') + '+m,String(medium?-a*b:m-n),'n'+(medium?-a*b:m-n)];default:return [''+a+' × '+b+' 的積是？',String(a*b),'n'+a*b]}}
function deck(count){let result=[],used=new Set(),seen=new Set();for(let i=0;i<count;i++){let q;for(let j=0;j<1500;j++){q=question($('unit').value,i>=Math.ceil(count*.7));if(!used.has(q[2])&&!seen.has(q[0])&&!used.has('html:'+q[1]))break;q=null}if(!q){let v=100+i;while(used.has('n'+v)||used.has('html:'+v))v++;q=[v+' + 0',String(v),'n'+v]}used.add(q[2]);used.add('html:'+q[1]);seen.add(q[0]);result.push({id:i,type:'q',html:q[0],open:false,done:false},{id:i,type:'a',html:q[1],open:false,done:false})}return shuffle(result)}
function tone(ok=true){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime;for(let [j,f] of (ok?[523,659,784]:[220,160]).entries()){let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,t+j*.08);g.gain.exponentialRampToValueAtTime(.001,t+j*.08+.15);o.connect(g);g.connect(audio.destination);o.start(t+j*.08);o.stop(t+j*.08+.16)}}catch{}}
function say(s){$('status').textContent=s}function showScores(){ $('scores').replaceChildren(...scores.map((v,i)=>{let e=document.createElement('span');e.textContent=(scores.length===1?'玩家':'第 '+(i+1)+' 組')+'：'+v+' 分';if(i===turn)e.className='turn';return e}))}
function render(){let board=$('board');let cols=cards.length===12?4:cards.length===20?5:cards.length===24?6:4;if(innerWidth<600)cols=4;board.style.setProperty('--cols',cols);board.style.setProperty('--rows',Math.ceil(cards.length/cols));board.replaceChildren(...cards.map((v,i)=>{let b=document.createElement('button');b.className='tile';if(v.open||v.done||phase==='preview'){b.classList.add(v.type);if(v.done)b.classList.add('done');if(v.bad)b.classList.add('bad');b.innerHTML='<span class="kind">'+(v.done?'✓ 已配對':v.type==='q'?'題目':'答案')+'</span><span class="formula">'+v.html+'</span>'}else b.innerHTML='<span class="number">'+(i+1)+'</span>';b.disabled=phase!=='play'||busy||v.done||v.open;b.setAttribute('aria-label',(v.done?'已配對':'卡牌')+' '+(i+1));b.onclick=()=>flip(i);return b}))}
function start(){clearInterval(timer);round++;phase='preview';first=null;busy=true;turn=0;attempts=0;scores=Array(+$('teams').value).fill(0);cards=deck(+$('pairs').value);document.body.classList.toggle('screen',$('display').value==='screen');$('home').classList.add('hidden');$('game').classList.remove('hidden');$('result').classList.add('hidden');remaining=+$('preview').value;showScores();render();say('記憶時間：'+remaining+' 秒');tone();timer=setInterval(()=>{remaining--;if(remaining>0){say('記憶時間：'+remaining+' 秒');return}clearInterval(timer);phase='countdown';render();let count=3;say('準備開始：'+count);timer=setInterval(()=>{count--;if(count>0){say('準備開始：'+count);return}clearInterval(timer);phase='play';busy=false;render();say('第 1 組開始翻牌');tone()},1000)},1000)}
function flip(i){if(phase!=='play'||busy||cards[i].open||cards[i].done)return;cards[i].open=true;if(first===null){first=i;render();say('再翻一張配對');return}let j=first;first=null;busy=true;attempts++;let ok=cards[i].id===cards[j].id;cards[i].bad=cards[j].bad=!ok;if(ok){cards[i].done=cards[j].done=true;scores[turn]++;showScores()}tone(ok);say(ok?'配對成功！再翻一次':'配對不同，準備換組');render();let token=round;setTimeout(()=>{if(token!==round)return;cards[i].bad=cards[j].bad=false;cards[i].open=cards[j].open=false;if(cards.every(v=>v.done)){phase='end';let max=Math.max(...scores),w=scores.map((v,i)=>v===max?'第 '+(i+1)+' 組':'').filter(Boolean);say('全部配對完成！');$('winner').textContent=scores.length===1?'完成！共翻牌 '+attempts+' 次':w.join('、')+(w.length>1?' 並列第一！':' 獲勝！');$('result').classList.remove('hidden');render();tone();return}if(!ok)turn=(turn+1)%scores.length;busy=false;showScores();render();say((scores.length===1?'請繼續':'第 '+(turn+1)+' 組')+' 翻牌')},ok?550:1250)}
$('start').onclick=start;$('again').onclick=start;$('exit').onclick=()=>{round++;clearInterval(timer);phase='home';$('game').classList.add('hidden');$('home').classList.remove('hidden');document.body.classList.remove('screen')};$('sound').onclick=()=>{muted=!muted;$('sound').textContent='音效：'+(muted?'關':'開')};$('full').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})}catch{}};let p=new URLSearchParams(location.search);if(units.includes(p.get('unit')))$('unit').value=p.get('unit');$('display').value=p.get('mode')==='screen'||(!p.has('mode')&&innerWidth>=900)?'screen':'phone';window.addEventListener('resize',()=>{if(phase!=='home')render()});

/* V2.1 math whack-a-mole: equal questions per team, shared basic question bank */
(()=>{const mode=$('playMode'),area=$('moleArea'),board=$('board');let mole=false,questionNow=null,slots=[],answered=0,total=0,seconds=0,deadline=0,clock=0,popTimer=0,advanceTimer=0,enabled=false,seenMole=new Set();
function stopMole(){clearInterval(clock);clearInterval(popTimer);clearTimeout(advanceTimer);enabled=false}
function settings(){let v=mode.value==='mole';$('previewSetting').classList.toggle('hidden',v);$('pairSetting').classList.toggle('hidden',v);$('moleSetting').classList.toggle('hidden',!v);$('start').textContent=v?'開始打地鼠':'開始記憶';$('rules').textContent=v?'看上方算式，敲擊帶有正確答案的地鼠！每題 12 秒，答對加一分，答錯或超時不加分，每組題數相同。':'先看全部牌，記住題目與答案的位置，再翻牌配對。配對成功得一分並繼續，失敗換下一組。'}
mode.onchange=settings;settings();
function newProblem(){let q;for(let i=0;i<100;i++){q=question($('unit').value,Math.random()<.3);if(!seenMole.has(q[0]))break}seenMole.add(q[0]);return q}
function choices(q){let out=[q[1]],u=$('unit').value;for(let j=0;j<300&&out.length<4;j++){let v=question(u,false)[1];if(!out.includes(v))out.push(v)}for(let j=1;out.length<4;j++){let v=String(90+j);if(!out.includes(v))out.push(v)}return shuffle(out)}
function paint(mark=-1,ok=false){$('moles').replaceChildren(...slots.map((v,i)=>{let b=document.createElement('button');b.className='hole'+(v?' active':'')+(i===mark?(ok?' good':' wrong'):'');b.disabled=!enabled||!v;b.innerHTML=v?'<span class="animal" aria-hidden="true">🐹</span><span class="answer">'+v+'</span>':'<span aria-hidden="true">●</span>';b.setAttribute('aria-label',v?'地鼠答案 '+b.textContent:'空洞');b.onclick=()=>hit(i);return b}))}
let options=[];function relocate(){if(!enabled)return;slots=shuffle([...options,null,null]);paint()}
function finish(){stopMole();phase='end';let max=Math.max(...scores),w=scores.map((v,i)=>v===max?'第 '+(i+1)+' 組':'').filter(Boolean);$('winner').textContent=scores.length===1?'挑戰完成！答對 '+scores[0]+' / '+total+' 題':w.join('、')+(w.length>1?' 並列第一！':' 獲勝！');$('result').classList.remove('hidden');say('打地鼠挑戰完成！');tone();paint()}
function next(){stopMole();if(answered>=total*scores.length){finish();return}turn=answered%scores.length;showScores();questionNow=newProblem();options=choices(questionNow);$('moleQuestion').innerHTML=questionNow[0]+' = ?'.replace(' = ?',''); // questions already contain their own notation
$('moleQuestion').innerHTML=questionNow[0];enabled=true;deadline=Date.now()+12000;seconds=12;$('moleClock').textContent='剩餘 12 秒';say((scores.length===1?'玩家':'第 '+(turn+1)+' 組')+'｜第 '+(Math.floor(answered/scores.length)+1)+' / '+total+' 題');relocate();popTimer=setInterval(relocate,2700);clock=setInterval(()=>{seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('moleClock').textContent='剩餘 '+seconds+' 秒';if(seconds===0)hit(-1)},100)}
function hit(i){if(!enabled)return;let ok=i>=0&&slots[i]===questionNow[1];stopMole();answered++;if(ok)scores[turn]++;showScores();tone(ok);say(ok?'答對！＋1 分':i<0?'時間到！':'答錯！');$('moleClock').replaceChildren(document.createTextNode('正確答案：'));let a=document.createElement('span');a.innerHTML=questionNow[1];$('moleClock').append(a);paint(i,ok);let token=round;advanceTimer=setTimeout(()=>{if(token===round&&mole)next()},1300)}
function startMole(){stopMole();clearInterval(timer);round++;mole=true;phase='mole';total=+$('moleCount').value;answered=0;seenMole.clear();scores=Array(+$('teams').value).fill(0);turn=0;document.body.classList.toggle('screen',$('display').value==='screen');$('home').classList.add('hidden');$('game').classList.remove('hidden');$('result').classList.add('hidden');board.classList.add('hidden');area.classList.remove('hidden');tone();next()}
const oldStart=start,oldExit=$('exit').onclick;function launch(){stopMole();mole=mode.value==='mole';board.classList.toggle('hidden',mole);area.classList.toggle('hidden',!mole);if(mole)startMole();else oldStart()}
$('start').onclick=launch;$('again').onclick=launch;$('exit').onclick=()=>{stopMole();mole=false;area.classList.add('hidden');board.classList.remove('hidden');oldExit()};
})();
</script></body></html>
