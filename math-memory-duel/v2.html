</style></head><body><main><div class="top"><a href="../game-center/">← 遊戲中心</a><h1>數學翻牌對決 V4.2</h1><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px"><button id="sound">音效：開</button><button id="musicToggle">配樂：開</button><label style="display:flex;align-items:center;font-size:12px">音量 <input id="musicVolume" type="range" min="0" max="100" value="55" aria-label="配樂音量" style="width:75px"></label></div></div><section id="home" class="panel"><div class="homeBanner"><div class="homeHero" id="homeBlue"></div><div><div class="homeKicker">MATH BATTLE</div><h2>數學對決</h2><p>翻牌記憶 × 打地鼠</p></div><div class="homeHero" id="homeRed"></div></div><div class="modeButtons"><button id="pickMemory" type="button">🃏 翻牌記憶</button><button id="pickMole" type="button">🔨 數學打地鼠</button></div><label>遊戲玩法<select id="playMode"><option value="memory">翻牌記憶對決</option><option value="mole">數學打地鼠</option></select></label><p id="rules">第一關 3×3（4 組配對＋星星空格），第二關 4×4（8 組配對）。兩關連續挑戰。</p><div class="settings"><label>數學單元<select id="unit"><option value="exp">指數律</option><option value="frac">分數四則</option><option value="expr">一元一次式</option><option value="eq">一元一次方程式</option><option value="signed">正負數四則</option><option value="prime">因數、倍數、質數與合數</option><option value="mix">混合複習</option></select></label><label>競賽模式<select id="teams"><option value="1">單人練習</option><option value="duel" selected>雙人對屏同步對戰</option><option value="2">兩組輪流對決</option><option value="3">三組對決</option><option value="4">四組對決</option></select></label><label id="previewSetting">記憶時間<select id="preview"><option>5</option><option>10</option><option selected>15</option><option>20</option></select></label><label id="pairSetting">連續兩關<div class="stageLabel">3×3 → 4×4</div><select id="pairs" class="hidden"><option value="4">第一關</option></select></label><label id="moleSetting" class="hidden">每組題數<select id="moleCount"><option>5</option><option selected>10</option><option>15</option></select></label><label>裝置<select id="display"><option valu 'use strict';const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};const frac=(a,b)=>{let d=gcd(a,b);a/=d;b/=d;return b===1?String(a):'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>'},pow=(a,b)=>a+'<sup>'+b+'</sup>';let cards=[],scores=[],turn=0,first=null,busy=true,phase='home',remaining=0,timer=0,round=0,attempts=0,muted=false,audio;const units=['exp','frac','expr','eq','signed','prime'];

function exponentPair(medium=false){let base=rand(2,4),p=rand(1,3),q=rand(1,3),k=rand(0,medium?4:2),t,v;switch(k){case 0:t=pow(base,rand(2,3));v=Number(t.match(/^(\d+)/)[1])**Number(t.match(/<sup>(\d+)/)[1]);break;case 1:t=pow(base,p)+' × '+pow(base,q)+' = '+pow(base,'?');v=p+q;break;case 2:t=pow(base,p+q)+' ÷ '+pow(base,q)+' = '+pow(base,'?');v=p;break;case 3:t='('+pow(base,p)+')<sup>2</sup> = '+pow(base,'?');v=p*2;break;default:t=pow(base,p)+' × '+base+' = '+pow(base,'?');v=p+1}return [t,String(v),'n'+v]}
function exponentMole(i){let b=rand(2,4),p=rand(1,3),q=rand(1,3),k=i%5,t,v;if(k===0){p=rand(2,3);t=pow(b,p)+' = ?';v=b**p}else if(k===1){t=pow(b,p)+' × '+pow(b,q)+' = '+pow(b,'?');v=p+q}else if(k===2){t=pow(b,p+q)+' ÷ '+pow(b,q)+' = '+pow(b,'?');v=p}else if(k===3){t='('+pow(b,p)+')<sup>2</sup> = '+pow(b,'?');v=2*p}else{t=pow(b,p)+' × '+b+' = '+pow(b,'?');v=p+1}let wrong=[...new Set([v-2,v-1,v+1,v+2,v+3].filter(n=>n>=0&&n!==v).map(String))];return {title:t,targets:[String(v)],wrong}}
function question(u,medium){let a=rand(2,medium?9:6),b=rand(2,medium?9:6),c=rand(1,5),n=rand(1,15),m=rand(1,10);if(u==='mix')u=units[rand(0,units.length-1)];switch(u){case'exp':return exponentPair(medium);case'frac':{let d=rand(3,12),x=rand(1,d-1),y=rand(1,d-1),v=medium?x*y:x+y,w=medium?d*d:d;return [frac(x,d)+(medium?' × ':' + ')+frac(y,d),frac(v,w),'f'+v/gcd(v,w)+'/'+w/gcd(v,w)]}case'expr':return [medium?a+'x + '+b+'x − '+c+'x':a+'x + '+b+'x',(a+b-(medium?c:0))+'x','e'+(a+b-(medium?c:0))];case'eq':return [a+'x'+(medium?' + '+c:'')+' = '+(a*n+(medium?c:0)),'x = '+n,'x'+n];case'gcd':return question('prime',medium);case'signed':return [medium?'(−'+a+') × '+b:'(−'+n+') + '+m,String(medium?-a*b:m-n),'n'+(medium?-a*b:m-n)];default:{let k=rand(0,3),v=rand(2,30),prime=x=>x>1&&Array.from({length:Math.max(0,Math.floor(Math.sqrt(x))-1)},(_,i)=>i+2).every(d=>x%d!==0);if(k===0||k===1){let pool=Array.from({length:29},(_,i)=>i+2).filter(x=>k===0?prime(x):!prime(x));v=pool[rand(0,pool.length-1)];return [''+v+' 是質數還是合數？',v+'：'+(k===0?'質數':'合數'),'class'+v]}if(k===2)return [a+' 的第 '+b+' 個正倍數',String(a*b),'n'+a*b];let factors=Array.from({length:v},(_,i)=>i+1).filter(x=>v%x===0);let list=factors.join('、');return [v+' 的所有正因數',list,'factors'+v]}}}

function moleProblem(u,i){
if(u==='mix')u=units[i%units.length];
if(u==='exp')return exponentMole(i);
let a=rand(2,6),b=rand(2,6),n=rand(2,9),t,v;
const numeric=(title,value)=>({title,targets:[String(value)],wrong:[...new Set([value-2,value-1,value+1,value+2,value+3].map(String))]});
if(u==='prime'){let k=i%4,m=rand(3,6),v=[12,16,18,20,24,30][rand(0,5)],pool=Array.from({length:30},(_,j)=>j+1),prime=x=>x>1&&Array.from({length:Math.max(0,Math.floor(Math.sqrt(x))-1)},(_,j)=>j+2).every(d=>x%d!==0),test=k===0?prime:k===1?x=>x>1&&!prime(x):k===2?x=>v%x===0:x=>x%m===0;return {title:['哪一個是質數？','哪一個是合數？','哪一個是 '+v+' 的因數？','哪一個是 '+m+' 的倍數？'][k],targets:shuffle(pool.filter(test)).slice(0,1).map(String),wrong:shuffle(pool.filter(x=>!test(x))).map(String)}}
if(u==='frac'){let d=rand(3,9),x=rand(1,d-1),y=rand(1,d-1),z=i%2===0?x+y:x-y;if(i%2&&x<y){[x,y]=[y,x];z=x-y}const raw=(p,q)=>'<span class="frac"><span>'+p+'</span><span>'+q+'</span></span>';return {title:raw(x,d)+(i%2?' − ':' + ')+raw(y,d)+' = ?',targets:[frac(z,d)],wrong:[z+1,z+2,z+3,z+4].map(k=>frac(k,d))}}
if(u==='expr'){let k=i%3;return numeric(k===0?a+'x + '+b+'x = ?x':k===1?(a+b)+'x − '+a+'x = ?x':a+'('+b+'x) = ?x',k===0?a+b:k===1?b:a*b)}
if(u==='eq'){let k=i%3;return numeric(k===0?'x + '+a+' = '+(n+a)+'，x = ?':k===1?a+'x = '+(a*n)+'，x = ?':a+'x + '+b+' = '+(a*n+b)+'，x = ?',n)}
let k=i%4;return numeric(k===0?'(−'+a+') + '+b+' = ?':k===1?a+' − '+b+' = ?':k===2?'(−'+a+') × '+b+' = ?':'(−'+(a*b)+') ÷ '+a+' = ?',k===0?b-a:k===1?a-b:k===2?-a*b:-b)
}
function deck(count){let result=[],used=new Set(),seen=new Set();for(let i=0;i<count;i++){let q;for(let j=0;j<1500;j++){q=question($('unit').value,count>4&&i>=Math.ceil(count*.5));if(!used.has(q[2])&&!seen.has(q[0])&&!used.has('html:'+q[1]))break;q=null}if(!q){let v=100+i;while(used.has('n'+v)||used.has('html:'+v))v++;q=[v+' + 0',String(v),'n'+v]}used.add(q[2]);used.add('html:'+q[1]);seen.add(q[0]);result.push({id:i,type:'q',html:q[0],open:false,done:false},{id:i,type:'a',html:q[1],open:false,done:false})}return shuffle(result)}
function tone(ok=true){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime;for(let [j,f] of (ok?[523,659,784]:[220,160]).entries()){let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,t+j*.08);g.gain.exponentialRampToValueAtTime(.001,t+j*.08+.15);o.connect(g);g.connect(audio.destination);o.start(t+j*.08);o.stop(t+j*.08+.16)}}catch{}}
function say(s){$('status').textContent=s}function showScores(){ $('scores').replaceChildren(...scores.map((v,i)=>{let e=document.createElement('span');e.textContent=(scores.length===1?'玩家':'第 '+(i+1)+' 組')+'：'+v+' 分';if(i===turn)e.className='turn';return e}))}
let memoryStage=1;function stageDeck(n){let a=deck(n===1?4:8);if(n===1)a.splice(4,0,{id:-1,type:"blank",html:"★",done:true,open:false});return a}
function render(){let board=$('board');let cols=cards.length===9?3:4;board.style.setProperty('--cols',cols);board.style.setProperty('--rows',Math.ceil(cards.length/cols));board.replaceChildren(...cards.map((v,i)=>{let b=document.createElement('button');b.className='tile';if(v.type==='blank'){b.classList.add('blank');b.textContent='★';b.disabled=true;return b}if(v.open||v.done||phase==='preview'){b.classList.add(v.type);if(v.done)b.classList.add('done');if(v.bad)b.classList.add('bad');b.innerHTML='<span class="kind">'+(v.done?'✓ 已配對':v.type==='q'?'題目':'答案')+'</span><span class="formula">'+v.html+'</span>'}else b.innerHTML='<span class="number">'+(i+1)+'</span>';b.disabled=phase!=='play'||busy||v.done||v.open;b.setAttribute('aria-label',(v.done?'已配對':'卡牌')+' '+(i+1));b.onclick=()=>flip(i);return b}))}
function start(){clearInterval(timer);round++;phase='preview';first=null;busy=true;turn=0;attempts=0;scores=Array(+$('teams').value).fill(0);memoryStage=1;cards=stageDeck(1);document.body.classList.toggle('screen',$('display').value==='screen');$('home').classList.add('hidden');$('game').classList.remove('hidden');$('result').classList.add('hidden');remaining=+$('preview').value;showScores();render();say('第一關 3×3｜記憶 '+remaining+' 秒');tone();timer=setInterval(()=>{remaining--;if(remaining>0){say('第一關 3×3｜記憶 '+remaining+' 秒');return}clearInterval(timer);phase='countdown';render();let count=3;say('準備開始：'+count);timer=setInterval(()=>{count--;if(count>0){say('準備開始：'+count);return}clearInterval(timer);phase='play';busy=false;render();say('第 1 組開始翻牌');tone()},1000)},1000)}

/* V4.2 math whack-a-mole: equal questions per team, shared basic question bank */
(()=>{const mode=$('playMode'),area=$('moleArea'),board=$('board');let mole=false,questionNow=null,slots=[],answered=0,total=0,seconds=0,deadline=0,clock=0,popTimer=0,advanceTimer=0,enabled=false,seenMole=new Set();
function stopMole(){clearInterval(clock);clearInterval(popTimer);clearTimeout(advanceTimer);enabled=false}
function settings(){let v=mode.value==='mole';$('previewSetting').classList.toggle('hidden',v);$('pairSetting').classList.toggle('hidden',v);$('moleSetting').classList.toggle('hidden',!v);$('start').textContent=v?'開始打地鼠':'開始記憶';$('rules').textContent=v?'看上方算式，敲擊帶有正確答案的地鼠！所有單元每題只有一個正確答案，敲中即可得分。每組題數相同。':'先記憶再配對，3×3 完成後接續 4×4，分數延續。'}

$('homeBlue').innerHTML=heroArt(0);$('homeRed').innerHTML=heroArt(1);const oldStart=$('start').onclick,oldAgain=$('again').onclick,oldExit=$('exit').onclick;$('start').onclick=()=>{if(select.value==='duel')launch();else{stop();oldStart()}};$('again').onclick=()=>{if(select.value==='duel')launch();else oldAgain()};$('exit').onclick=()=>{stop();oldExit()};

/* Original synthesized classroom music, independent from answer SFX. */
(()=>{let interval=0,channel=null,step=0,musicOn=true,running=false,ended=false;let volume=$('musicVolume'),toggle=$('musicToggle');const patterns={memory:[60,64,67,64,62,65,69,65,64,67,72,67,62,65,67,65],mole:[60,67,64,67,62,69,65,69,64,72,67,72,65,72,67,71]};
function setup(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});if(!channel){channel=audio.createGain();channel.connect(audio.destination)}channel.gain.setValueAtTime(musicOn?Number(volume.value)/100:0,audio.currentTime);return true}catch{return false}}
function note(m,t,d,v,type='triangle'){try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(channel);o.start(t);o.stop(t+d+.02)}catch{}}
function beat(){if(!running||!musicOn||document.hidden||!audio||audio.state!=='running')return;let mode=$('playMode').value==='mole'?'mole':'memory',p=patterns[mode],t=audio.currentTime+.025;let urgent=[...document.querySelectorAll('.sharedArena .hpText')].some(e=>parseInt(e.textContent,10)<=25);note(p[step%p.length]+(urgent?12:0),t,.24,mode==='mole'?.085:.055);if(urgent)note(p[step%p.length]-12,t+.12,.12,.035);if(step%2===0)note(p[Math.floor(step/4)*4%p.length]-12,t,.26,.07,'sine');if(step%4===0){note(p[step%p.length]+7,t,.36,.025);note(p[step%p.length]-24,t,.12,.065,'triangle')}if(mode==='mole'&&step%2===1)note(84,t,.055,.013,'square');step++}
function stopMusic(){clearInterval(interval);interval=0;running=false}
function startMusic(){stopMusic();ended=false;step=0;if(!setup())return;running=true;beat();interval=setInterval(beat,$('playMode').value==='mole'?330:450)}
function fanfare(){stopMusic();if(!musicOn||!setup())return;let t=audio.currentTime+.04;[60,64,67,72,76,79,84].forEach((m,i)=>note(m,t+i*.13,.42,.12));[48,55,60].forEach(m=>note(m,t+.78,.75,.05));}
for(let id of ['start','again']){let b=$(id),old=b.onclick;b.onclick=e=>{old(e);startMusic()}}
let exit=$('exit'),oldExit=exit.onclick;exit.onclick=e=>{stopMusic();oldExit(e)};
toggle.onclick=()=>{musicOn=!musicOn;toggle.textContent='配樂：'+(musicOn?'開':'關');setup()};volume.oninput=()=>{if(channel)channel.gain.setTargetAtTime(musicOn?Number(volume.value)/100:0,audio.currentTime,.04)};
new MutationObserver(()=>{if(!$('result').classList.contains('hidden')&&!ended){ended=true;fanfare()}}).observe($('result'),{attributes:true,attributeFilter:['class']});window.addEventListener('pagehide',stopMusic);
})();

/* V4.2 first-person tools: local per-side state, non-blocking overlays. */
const hammerFX=(()=>{const ongoing=new WeakMap(),streaks=new WeakMap();const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function battleSparks(x,y,red,streak){if(reduced())return;for(let i=0;i<(streak>=3?12:7);i++){let e=document.createElement('span');e.className='battleSpark';e.textContent=red?(i%2?'✦':'◆'):(i%2?'ϟ':'✦');e.style.cssText='left:'+x+'px;top:'+y+'px;color:'+(red?'#ffb34b':'#84eaff')+';--dx:'+Math.cos(i*2.4)*75+'px;--dy:'+Math.sin(i*2.4)*75+'px';document.body.append(e);setTimeout(()=>e.remove(),560)}}
function art(red){let main=red?'#dc5342':'#397fdc',light=red?'#ff9a45':'#8edaff',dark=red?'#94352f':'#244895';return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" aria-hidden="true"><g transform="rotate(-28 93 105)" stroke="#17283b" stroke-width="3" stroke-linejoin="round"><path d="M85 45h15v76H85z" fill="#9a6943"/><path d="M88 59h9v48h-9z" fill="#d0a16a" stroke="none"/><path d="M34 20L112 20L126 35V61L48 61L34 46Z" fill="'+dark+'"/><path d="M34 20L112 20L112 46L34 46Z" fill="'+main+'"/><path d="M112 20L126 35V61L112 46Z" fill="'+dark+'"/><path d="M39 24h67v5H39z" fill="'+light+'" stroke="none"/><path d="M65 27h12v5h6v10H60V32h5z" fill="#ffe17b" stroke-width="1.6"/><path d="M80 96h25l10 10v15l-14 12H78l-8-12 3-14z" fill="#f0c296"/><path d="M72 114h38v24H72z" fill="'+main+'"/><path d="M77 115h28v5H77z" fill="'+light+'" stroke="none"/></g></svg>'}
function dock(parent,red){if(!parent||parent.querySelector('.malletDock'))return;let d=document.createElement('div');d.className='malletDock';d.innerHTML='<span class="malletTip">'+(red?'烈焰戰槌':'雷霆戰槌')+'</span><span class="malletIdle">'+art(red)+'</span>';parent.append(d)}
function thump(ok){try{if(muted)return;audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(ok?155:110,t);o.frequency.exponentialRampToValueAtTime(48,t+.095);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.13)}catch{}}
function play(btn,ok,red){if(!btn||!btn.isConnected)return;let side=btn.closest('.duelSide')||$('moleArea'),r=btn.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,old=ongoing.get(side);if(old)old();let streak=ok?(streaks.get(side)||0)+1:0;streaks.set(side,streak);let idle=side.querySelector('.malletIdle');idle?.classList.add('swinging');let h=document.createElement('div'),b=document.createElement('div'),ring=document.createElement('div');h.className='malletStrike';h.innerHTML=art(red);h.style.left=x+'px';h.style.top=y+'px';b.className='malletBurst';b.textContent=ok?(streak>1?'✦ '+streak+' 連擊':'✦ +1'):'×';b.style.cssText='left:'+x+'px;top:'+y+'px;color:'+(ok?'#ffe47d':'#ff8585');ring.className='malletTrail'+(ok?'':' wrong');ring.style.left=x+'px';ring.style.top=y+'px';document.body.append(h,b,ring);if(ok)battleSparks(x,y,red,streak);let timer=0,done=false;function clear(){if(done)return;done=true;clearTimeout(timer);h.remove();b.remove();ring.remove();idle?.classList.remove('swinging');if(ongoing.get(side)===clear)ongoing.delete(side)}ongoing.set(side,clear);thump(ok);if(!reduced()&&h.animate){h.animate([{transform:'translate(-25%,-15%) rotate(-65deg)',opacity:0},{transform:'translate(-48%,-68%) rotate(15deg)',opacity:1,offset:.48},{transform:'translate(-35%,-35%) rotate(-28deg)',opacity:0}],{duration:370,easing:'ease-out',fill:'both'});ring.animate([{transform:'translate(-50%,-50%) scale(.35)',opacity:1},{transform:'translate(-50%,-50%) scale(1.6)',opacity:0}],{duration:420,fill:'both'});b.animate([{transform:'translate(-50%,-50%) scale(.65)',opacity:0},{transform:'translate(-50%,-80%) scale(1.1)',opacity:1,offset:.3},{transform:'translate(-50%,-135%) scale(1)',opacity:0}],{duration:550,fill:'both'})}else{h.style.transform='translate(-50%,-65%)';b.style.transform='translate(-50%,-50%)';ring.style.transform='translate(-50%,-50%)'}timer=setTimeout(clear,580)}
return {dock,play}})();


(()=>{let mode=$('playMode');function mark(){for(let [id,v] of [['pickMemory','memory'],['pickMole','mole']])$(id).classList.toggle('chosen',mode.value===v)}for(let [id,v] of [['pickMemory','memory'],['pickMole','mole']])$(id).onclick=()=>{mode.value=v;mode.dispatchEvent(new Event('change'));mark()};mode.addEventListener('change',mark);mark();function layout(){document.body.classList.toggle('duelPlaying',!$('duel').classList.contains('hidden')&&!$('game').classList.contains('hidden'))}new MutationObserver(layout).observe($('duel'),{attributes:true,attributeFilter:['class']});new MutationObserver(layout).observe($('game'),{attributes:true,attributeFilter:['class']});layout()})();
