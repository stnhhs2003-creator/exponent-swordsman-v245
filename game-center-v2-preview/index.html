)]){const o=document.createElement('option');o.value=o.textContent=v;cat.append(o)}function draw(){const list=games.filter(g=>g.name.includes(q.value.trim())&&(!cat.value||g.category===cat.value));grid.replaceChildren(...list.map(g=>{const a=document.createElement('a');a.className='game';a.href=g.url;a.target='_blank';a.rel='noopener noreferrer';const art=document.createElement('div');art.className='art';art.textContent=g.emoji;const d=document.createElement('div');d.className='details';const n=document.createElement('span');n.className='tag';n.textContent=String(g.id).padStart(2,'0')+' · '+g.category;const h=document.createElement('h3');h.textContent=g.name;const p=document.createElement('p');p.textContent='保留原遊戲玩法與內容';const open=document.createElement('span');open.className='open';open.textContent='開啟遊戲 ↗';d.append(n,h,p,open);a.append(art,d);return a}));document.getElementById('count').textContent=list.length+' 款';document.getElementById('empty').classList.toggle('hidden',list.length!==0)}q.addEventListener('input',draw);cat.addEventListener('change',draw);document.getElementById('screen').addEventListener('click',e=>{const on=document.body.classList.toggle('wide');e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'結束大屏預覽':'16:9 大屏預覽'});draw();
