<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111e25">
<title>指數劍客 3.0｜武俠數學跳躍冒險</title>
<style>
:root{--gold:#edce89;--ink:#101d22;--jade:#7bdfd1;--paper:#fff9ed}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#091318;color:#fff;font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fff}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#091318}
#hud{height:58px;flex-shrink:0;display:none;background:linear-gradient(90deg,#091517,#26332c,#091517);border-bottom:2px solid #b3a07a;padding:4px 12px;align-items:center;gap:10px}
#hud .stats{min-width:155px;font-weight:800;font-size:12px;line-height:1.5;color:#f9e8be}
#hud .question{flex:1;text-align:center;font-size:clamp(17px,2.7vw,28px);font-weight:900;color:#fff7dc;text-shadow:0 2px 3px #000}
#hud .right{min-width:180px;text-align:right;font-size:12px;font-weight:800;line-height:1.5}
#field{min-height:0;position:relative;flex:1;background:#182630;overflow:hidden}
#game{display:block;width:100%;height:100%}
#hint{position:absolute;top:6px;left:50%;transform:translateX(-50%);padding:4px 13px;max-width:85%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;background:#101e21d9;border:1px solid #c4b187aa;border-radius:9px;color:#fff3c9;font-weight:900;font-size:clamp(11px,1.4vw,17px);text-shadow:0 1px 3px #000;pointer-events:none}
#bottom{height:103px;flex-shrink:0;display:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:#0c1c22;border-top:2px solid #9b9579}
#move,#fight{display:flex;gap:8px;align-items:center}
.ctrl{min-width:64px;height:75px;padding:4px 10px;border:2px solid #b9c4bd;background:linear-gradient(#304b50,#14272c);box-shadow:0 4px 0 #020a0c;border-radius:15px;color:#fff;font-size:25px;font-weight:900;touch-action:none}
.ctrl small{font-size:11px;display:block;white-space:nowrap}
.ctrl:active,.ctrl.pressed{background:#5b8679;transform:translateY(2px)}
.ctrl.attack{border-color:#e6cc88;background:linear-gradient(#785633,#3a2c21)}
.ctrl.jump{border-color:#97d1bc}
#team{min-width:160px;max-width:295px;flex:1;text-align:center;color:#d9e8df;font-size:12px}
#team strong{font-size:14px;color:#f8dea7}
#shield{background:#42615c;color:#fff;border:2px solid #91c4b4;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:900;margin:3px;min-height:36px}
#shield:disabled{opacity:.45}
#overlay{position:fixed;inset:0;background:#050d10d9;display:flex;justify-content:center;align-items:center;z-index:20;overflow:auto;padding:18px}
#overlay.hidden{display:none}
#panel{width:min(780px,97vw);max-height:96dvh;overflow:auto;padding:20px 26px;border-radius:20px;border:2px solid #d0b785;background:radial-gradient(ellipse at 65% 0%,#3c534c 0%,#1a2e32 42%,#10181c 100%);box-shadow:0 20px 90px #000b;color:#fff}
h1,h2{margin:4px 0 12px;color:#f7e1ae}h1{font-size:clamp(25px,3vw,42px)}h2{font-size:clamp(22px,3vw,34px)}
#panel p{line-height:1.55;margin:9px 0}#panel .intro{color:#d7ddd3;font-size:14px}
.choices{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.pick{background:#19282b;border:2px solid #526961;padding:10px 12px;color:#fff;border-radius:14px;min-width:135px;flex:1}
.pick[aria-pressed=true]{border-color:#f6d895;background:#3b4b41}
.pick img{width:70px;height:95px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 2px 8px #000)}
.pick.scene{min-height:82px;text-align:left;padding:15px;background:linear-gradient(120deg,#4b615b,#192b32)}
.pick.scene.valley{background:linear-gradient(120deg,#304a40,#1b3131)}
.primary{padding:12px 20px;background:linear-gradient(#ffe3a3,#cb994e);border:0;color:#17201c;border-radius:12px;font-size:17px;font-weight:900;margin:9px 8px 4px 0}
.secondary{padding:11px 16px;background:#334b4f;color:#fff;border:1px solid #849e98;border-radius:11px;font-size:15px;margin:6px}
#rules{font-size:13px;line-height:1.6;color:#e3e9df}
#rules b{color:#ffe3a1}
@media(max-height:520px){
#hud{height:46px;padding:2px 7px}#hud .stats,#hud .right{font-size:10px;min-width:128px}
#hud .right{min-width:135px}#bottom{height:83px;padding:4px 7px}
.ctrl{height:64px;min-width:56px;font-size:22px;padding:4px 7px}
.ctrl small{font-size:10px}#team{min-width:120px;font-size:10px}#team strong{font-size:11px}
#shield{min-height:29px;padding:4px 6px;font-size:11px}#panel{padding:13px 18px}
.pick img{height:64px;width:60px}h1{margin:0 0 6px}
}
@media(max-width:650px){#bottom{gap:3px}#move,#fight{gap:3px}.ctrl{min-width:43px;padding:3px 5px}#team{min-width:94px}.ctrl small{font-size:9px}}
</style></head><body>
<div id="app">
<header id="hud"><div class="stats"><div id="stage">第 1 關</div><div id="life">♥♥♥</div></div><div id="question" class="question">2³ × 2⁴ = 2□</div><div class="right"><div id="hp">HP 100</div><div id="timer">倒數 22 秒</div></div></header>
<div id="field"><canvas id="game" aria-label="武俠闖關遊戲畫面"></canvas><div id="hint">先由小組解題，再操作角色頂方塊或射劍氣</div></div>
<div id="bottom"><div id="move"><button class="ctrl" id="left" aria-label="往左">◀<small>左</small></button><button class="ctrl" id="right" aria-label="往右">▶<small>右</small></button></div>
<div id="team"><strong>小組解題支援</strong><div id="teamline">喊出答案數字與位置</div><button id="shield">🛡 團隊護盾 ×2</button></div>
<div id="fight"><button class="ctrl jump" id="jump">⬆<small>跳／頂</small></button><button class="ctrl attack" id="wave">⚔<small>劍氣波</small></button><button class="ctrl" id="dash">💨<small>閃避</small></button></div></div>
</div>
<div id="overlay"><section id="panel"></section></div>
<script>
"use strict";
(function(){
const W=1100,H=620,G=515,BASE_TIME=24,canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let hero="yuanheng",scene=0,stage=0,round=0,bossCombo=0,lives=3,hp=100,shields=2,shieldUntil=0;
let phase="menu",question=null,blocks=[],enemies=[],shots=[],projectiles=[],effects=[],player={x:545,y:G,vx:0,vy:0,face:1,ground:true};
let keys={left:false,right:false},jumpBuffered=0,fireCool=0,dashCool=0,dashUntil=0,invuln=0,timeLeft=BASE_TIME;
let last=0,clock=0,combo=0,totalScore=0,msgUntil=0,audio=null,audioNext=0,noteIndex=0,musicOn=true;
let s=1,offx=0,offy=0,ratio=1;
const STAGES=[{name:"第一關｜煙雨古寺",label:"庭院試煉",rounds:8},{name:"第二關｜竹影劍谷",label:"竹林追擊",rounds:8},{name:"魔王戰｜五連勝",label:"劍氣終結",rounds:5}];
const platforms=[{x:108,y:455,w:205},{x:786,y:440,w:205}];
const images={};
for(const n of ["yuanheng","zhiyan"])for(const p of ["idle","run","jump","attack"]){
 const im=new Image;im.src="assets/new_poses-"+n+"-"+p+".webp";images[n+"-"+p]=im;
}
for(const n of ["art-tree-idle","art-armor-idle","art-ghost-idle","art-boss-idle"]){
 const im=new Image;im.src="assets/"+n+".webp";images[n]=im;
}
function resize(){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));
 ratio=d;s=Math.min(r.width/W,r.height/H);offx=(r.width-W*s)/2;offy=(r.height-H*s)/2;
 ctx.setTransform(d*s,0,0,d*s,d*offx,d*offy);
}
addEventListener("resize",resize);
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function choose(arr){return arr[rand(0,arr.length-1)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function menu(){
 phase="menu";$("hud").style.display="none";$("bottom").style.display="none";$("overlay").classList.remove("hidden");
 $("panel").innerHTML='<h1>⚔ 指數劍客 3.0</h1><p class="intro">寫實武俠 × 橫向跳躍 × 小組合作解題</p><p><b>選主角（沿用原本兩位角色）</b></p><div class="choices"><button class="pick" data-hero="yuanheng"><img src="assets/new_poses-yuanheng-idle.webp" alt="淵衡">淵衡｜青刃劍士</button><button class="pick" data-hero="zhiyan"><img src="assets/new_poses-zhiyan-idle.webp" alt="芷言">芷言｜翡翠劍士</button></div><p><b>兩個場景</b></p><div class="choices"><button class="pick scene" data-scene="0">🏯 煙雨古寺<br><small>霧山石階・暖金晨光</small></button><button class="pick scene valley" data-scene="1">🎋 竹影劍谷<br><small>翠竹幽谷・晨霧山巒</small></button></div><div id="rules"><b>一人操作：</b>左右跑、跳躍用頭頂答案、劍氣波擊中答案、閃避怪物。<br><b>小組支援：</b>看上方題目、口頭提示正確數字與位置，並可點擊「團隊護盾」。<br><b>危險：</b>答錯、大彈命中、HP 歸零都扣 1 命；最後魔王需連對 5 題。</div><button class="primary" id="start">▶ 開始合作闖關</button>';
 $("panel").querySelectorAll("[data-hero]").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.hero===hero);b.onclick=()=>{hero=b.dataset.hero;$("panel").querySelectorAll("[data-hero]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.hero===hero))}});
 $("panel").querySelectorAll("[data-scene]").forEach(b=>{b.setAttribute("aria-pressed",+b.dataset.scene===scene);b.onclick=()=>{scene=+b.dataset.scene;$("panel").querySelectorAll("[data-scene]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.scene===scene))}});
 $("start").onclick=()=>{sound("start");startGame()};
}
function startGame(){stage=0;round=0;bossCombo=0;lives=3;totalScore=0;startStage(0)}
function startStage(n){
 stage=n;round=0;bossCombo=0;shields=2;hp=100;shieldUntil=0;phase="play";
 player={x:545,y:G,vx:0,vy:0,face:1,ground:true};keys.left=keys.right=false;
 projectiles=[];shots=[];enemies=[];effects=[];dashCool=0;dashUntil=0;invuln=0;
 $("overlay").classList.add("hidden");$("hud").style.display="flex";$("bottom").style.display="flex";
 nextQuestion();refresh();
}
function makeQuestion(){
 const base=rand(2,7),a=rand(2,6),b=rand(1,4),kind=stage===0?rand(0,1):rand(0,3);let val,text,explain;
 if(kind===0){val=a+b;text=base+"<sup>"+a+"</sup> × "+base+"<sup>"+b+"</sup> = "+base+"<sup>□</sup>";explain="同底數相乘，指數相加："+a+"＋"+b+"＝"+val}
 else if(kind===1){const hi=a+b;val=a;text=base+"<sup>"+hi+"</sup> ÷ "+base+"<sup>"+b+"</sup> = "+base+"<sup>□</sup>";explain="同底數相除，指數相減："+hi+"－"+b+"＝"+val}
 else if(kind===2){val=a*b;text="("+base+"<sup>"+a+"</sup>)<sup>"+b+"</sup> = "+base+"<sup>□</sup>";explain="冪的乘方，指數相乘："+a+"×"+b+"＝"+val}
 else{const c=rand(1,a+b-1);val=a+b-c;text=base+"<sup>"+a+"</sup> × "+base+"<sup>"+b+"</sup> ÷ "+base+"<sup>"+c+"</sup> = "+base+"<sup>□</sup>";explain="先加後減："+a+"＋"+b+"－"+c+"＝"+val}
 const set=new Set([val]);for(const delta of shuffle([-3,-2,-1,1,2,3,4])){if(set.size>=4)break;const v=val+delta;if(v>=0)set.add(v)}
 while(set.size<4)set.add(val+set.size+2);
 return {text,explain,answer:val,options:shuffle([...set])}
}
function nextQuestion(){
 question=makeQuestion();timeLeft=stage===0?25:stage===1?22:20;
 // Four floating answer bricks, separated from the roaming enemies.
 const xs=[205,432,660,890],ys=[340,315,315,340];
 blocks=question.options.map((v,i)=>({x:xs[i],y:ys[i],w:76,h:52,value:v,hit:false}));
 projectiles=[];shots=[];enemies=[];fireCool=0;invuln=Math.max(invuln,clock+.65);
 spawnPatrols();msg("小組先解題！操作手跳起頂方塊，或用劍氣波命中",2.2);
 refresh();
}
function spawnPatrols(){
 const difficulty=stage===0?round:stage===1?round+4:10;
 // One patrol on each staircase, plus a ground crawler; cap crowding.
 enemies.push({x:177,y:platforms[0].y,lo:140,hi:274,dir:1,speed:38+difficulty*2,hp:2,kind:"art-tree-idle",dead:false});
 enemies.push({x:915,y:platforms[1].y,lo:817,hi:963,dir:-1,speed:39+difficulty*2,hp:2,kind:"art-armor-idle",dead:false});
 if(difficulty>=2)enemies.push({x:960,y:G,lo:750,hi:1010,dir:-1,speed:57+difficulty*2,hp:2,kind:"art-ghost-idle",dead:false});
}
function msg(t,d=1.2){$("hint").textContent=t;msgUntil=clock+d}
function sound(type){
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  let f={jump:460,hit:220,wrong:130,ok:770,shoot:580,death:98,dash:320,shield:620,start:520,stomp:390}[type]||300;
  const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;
  osc.type=type==="death"?"sawtooth":"triangle";osc.frequency.setValueAtTime(f,t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(50,f*(type==="wrong"?.52:1.42)),t+.15);
  gain.gain.setValueAtTime(.055,t);gain.gain.exponentialRampToValueAtTime(.001,t+.22);
  osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.23)
 }catch(e){}
}
function music(dt){
 if(!audio||audio.state!=="running"||phase!=="play"||!musicOn)return;
 if(audio.currentTime<audioNext)return;audioNext=audio.currentTime+(stage===2?.24:stage===1?.34:.43);
 const seq=stage===2?[147,175,196,220,196,175,165,147]:stage===1?[220,246,293,329,293,246,220,196]:[196,220,246,293,246,220,196,174];
 const osc=audio.createOscillator(),gain=audio.createGain();osc.type="sine";
 osc.frequency.value=seq[noteIndex++%seq.length];gain.gain.value=.019;
 gain.gain.setTargetAtTime(.0001,audio.currentTime+.09,.12);osc.connect(gain);gain.connect(audio.destination);
 osc.start();osc.stop(audio.currentTime+.28);
}
function refresh(){
 $("stage").textContent=STAGES[stage].name+"｜"+(round+1)+"/"+STAGES[stage].rounds;
 $("life").textContent="生命 "+lives+" ♥"+"♥".repeat(lives)+"｜分數 "+totalScore;
 $("question").innerHTML=question?question.text:"";
 $("hp").textContent="HP "+Math.ceil(hp)+"/100";
 $("timer").textContent="倒數 "+Math.ceil(timeLeft)+" 秒";
 $("teamline").textContent=stage===2?"小組提醒：連續答對 "+bossCombo+"/5":"喊出答案數字與左右方向";
 $("shield").textContent="🛡 團隊護盾 ×"+shields;
 $("shield").disabled=phase!=="play"||shields<=0;
}
function defend(){if(phase!=="play"||shields<=0)return;shields--;shieldUntil=clock+3.2;sound("shield");msg("小組護盾啟動！3 秒保護，趁現在作答",1.5);refresh()}
$("shield").addEventListener("click",defend);
function jump(){
 if(phase!=="play")return;
 if(player.ground){player.vy=-700;player.ground=false;sound("jump")}
 else if(clock<jumpBuffered){return}
 else{jumpBuffered=clock+.1}
}
function wave(){
 if(phase!=="play"||clock<fireCool)return;
 fireCool=clock+.36;sound("shoot");
 shots.push({x:player.x+player.face*30,y:player.y-149,vx:player.face*850,life:1.05});
 player.attackUntil=clock+.19;
}
function dash(){
 if(phase!=="play"||clock<dashCool)return;
 dashCool=clock+1.3;dashUntil=clock+.2;invuln=clock+.33;sound("dash");
 effects.push({x:player.x,y:player.y-55,t:.35,kind:"dash"});
}
function takeDamage(amt,reason){
 if(clock<invuln||clock<shieldUntil)return;
 hp=Math.max(0,hp-amt);invuln=clock+1.05;sound("hit");
 effects.push({x:player.x,y:player.y-65,t:.4,kind:"hurt"});
 if(hp<=0)die(reason||"HP 歸零");else msg("受到攻擊！HP 剩 "+hp,1);
 refresh();
}
function die(reason){
 if(phase!=="play")return;
 lives--;phase=lives<=0?"lost":"dead";sound("death");
 showPanel(lives<=0?"💀 全隊挑戰結束":"💔 失去一命",reason+"｜剩餘生命："+Math.max(0,lives),
  lives<=0?[["重新挑戰",startGame],["回選單",menu]]:
  [["原題復活",()=>{phase="play";hp=100;player.x=545;player.y=G;player.vy=0;player.ground=true;invuln=clock+2.4;shieldUntil=0;projectiles=[];shots=[];enemies=[];spawnPatrols();$("overlay").classList.add("hidden");msg("已復活！2 秒保護，繼續原題",1.8);refresh()}],["回選單",menu]]);
}
function showPanel(title,description,actions){
 $("overlay").classList.remove("hidden");
 $("panel").innerHTML="<h2>"+title+"</h2><p>"+description+"</p><div id='panelActions'></div>";
 for(const [label,fn] of actions){const b=document.createElement("button");b.className="primary";b.textContent=label;b.onclick=()=>{sound("start");fn()};$("panelActions").appendChild(b)}
}
function resolveAnswer(block,mode){
 if(phase!=="play"||block.hit)return;
 block.hit=true;sound(block.value===question.answer?"ok":"wrong");
 effects.push({x:block.x,y:block.y,t:.7,kind:"burst"});
 if(block.value!==question.answer){die("答錯答案："+block.value+"。正確答案是 "+question.answer+"。"+question.explain);return}
 totalScore+=100+(mode==="head"?30:10)+Math.ceil(timeLeft)*2;
 hp=Math.min(100,hp+12);combo++;
 phase="answer";
 msg("答對！"+question.explain,2);
 const prev=question;
 setTimeout(()=>{
  if(phase!=="answer"||question!==prev)return;
  round++;
  if(round>=STAGES[stage].rounds){
   if(stage===2){phase="won";showPanel("🏆 全員勝利！","最後魔王五題連續答對！合作通關，總分："+totalScore,[["再挑戰",startGame],["回選單",menu]])}
   else{phase="clear";showPanel("✨ "+STAGES[stage].name+" 通關","下一關會有不同場景與更快的怪物。", [["進入下一關",()=>startStage(stage+1)],["回選單",menu]])}
  }else{if(stage===2)bossCombo++;phase="play";nextQuestion()}
 },900);refresh();
}
function playerHitbox(){return {left:player.x-19,right:player.x+19,top:player.y-104,bottom:player.y}}
function update(dt){
 clock+=dt;music(dt);if(phase!=="play")return;
 timeLeft-=dt;if(timeLeft<=0){die("答題時間到");return}
 const dir=Number(keys.right)-Number(keys.left);
 const vx=clock<dashUntil?player.face*680:dir*295;
 if(dir)player.face=dir;
 const ox=player.x,oy=player.y,oldHead=oy-105;
 player.vx=vx;player.x=Math.max(25,Math.min(W-25,player.x+vx*dt));
 player.vy+=1550*dt;player.y+=player.vy*dt;
 // Hit answer bricks from below on upward motion, Mario-style.
 if(player.vy<0)for(const b of blocks){
  if(oldHead>=b.y+b.h-8&&player.y-105<=b.y+b.h+3&&Math.abs(player.x-b.x)<b.w/2+15){
   player.y=b.y+b.h+105;player.vy=130;resolveAnswer(b,"head");break;
  }
 }
 if(phase!=="play")return;
 // Land on staircase or ground while descending.
 if(player.vy>=0){
  let landing=G;
  for(const p of platforms)if(player.x>p.x+7&&player.x<p.x+p.w-7&&oy<=p.y+6&&player.y>=p.y)landing=Math.min(landing,p.y);
  if(player.y>=landing){player.y=landing;player.vy=0;player.ground=true}
  else player.ground=false;
 }else player.ground=false;
 // Detach from platform edges.
 if(player.vy===0&&player.y<G&&!platforms.some(p=>player.x>=p.x+6&&player.x<=p.x+p.w-6&&Math.abs(player.y-p.y)<5)){
  player.vy=45;player.ground=false;
 }
 // Enemy patrols: independent roaming, not homing onto player.
 for(const e of enemies){
  if(e.dead)continue;e.x+=e.dir*e.speed*dt;
  if(e.x<e.lo){e.x=e.lo;e.dir=1}else if(e.x>e.hi){e.x=e.hi;e.dir=-1}
  if(Math.abs(e.x-player.x)<40&&Math.abs(e.y-player.y)<95){
   const stomp=player.vy>110&&oy<=e.y-55&&player.y>=e.y-55;
   if(stomp){e.hp=0;e.dead=true;player.vy=-410;player.ground=false;totalScore+=30;sound("stomp");effects.push({x:e.x,y:e.y-30,t:.55,kind:"ink"});msg("踩怪成功！跳起來接著解題",.85)}
   else takeDamage(stage===0?13:19,"遭巡邏怪碰撞");
  }
 }
 enemies=enemies.filter(e=>!e.dead);
 for(let i=shots.length-1;i>=0;i--){
  let p=shots[i],oldx=p.x;p.x+=p.vx*dt;p.life-=dt;
  if(p.x<0||p.x>W||p.life<=0){shots.splice(i,1);continue}
  let used=false;
  for(const b of blocks){if(p.y>=b.y-12&&p.y<=b.y+b.h+12&&Math.min(oldx,p.x)<=b.x+b.w/2&&Math.max(oldx,p.x)>=b.x-b.w/2){resolveAnswer(b,"wave");used=true;break}}
  if(!used)for(const e of enemies){if(!e.dead&&Math.abs(e.x-p.x)<35&&Math.abs((e.y-40)-p.y)<47){e.hp--;effects.push({x:e.x,y:e.y-37,t:.35,kind:"ink"});if(e.hp<=0){e.dead=true;totalScore+=15}used=true;sound("hit");break}}
  if(used)shots.splice(i,1);
 }
 // Big projectile is deadly, but only after a clear warning and with cooldown.
 if((stage>0||round>=3)&&clock>=nextBullet){
  nextBullet=clock+(stage===2?4.2:stage===1?5.3:6.8);
  const big=(round%3===2||stage===2);
  projectiles.push({x:1080,y:big?G-58:G-35,warning:big?1.65:1.2,vx:big?-205:-240,big,life:8});
  msg(big?"⚠ 大彈警告！跳躍或閃避！":"⚠ 地面飛彈，快跳起！",1.25);
 }
 for(let i=projectiles.length-1;i>=0;i--){
  const p=projectiles[i];if(p.warning>0){p.warning-=dt;continue}
  p.x+=p.vx*dt;p.life-=dt;
  if(p.x<0||p.life<=0){projectiles.splice(i,1);continue}
  if(Math.abs(p.x-player.x)<(p.big?46:31)&&Math.abs(p.y-(player.y-50))<(p.big?61:49)){
   projectiles.splice(i,1);
   if(clock<invuln||clock<shieldUntil){effects.push({x:p.x,y:p.y,t:.4,kind:"burst"});continue}
   if(p.big){die("被大彈擊中，直接失去一命");return}
   takeDamage(stage===0?18:23,"小彈擊中");
  }
 }
 effects=effects.filter(e=>(e.t-=dt)>0);
 enemies=enemies.filter(e=>!e.dead);
 if(clock>msgUntil)$("hint").textContent="頂方塊或發射劍氣作答｜小組可喊答案、啟動護盾";
 if(Math.ceil(timeLeft)!==Math.ceil(timeLeft+dt))refresh();
}
let nextBullet=0;
function polygon(pts,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}
function drawBackdrop(){
 const forest=stage===1||(stage===0&&scene===1),boss=stage===2;
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,boss?"#10121c":forest?"#1b3333":"#27363e");
 sky.addColorStop(.55,boss?"#54383e":forest?"#587168":"#7f8880");
 sky.addColorStop(1,boss?"#2d1f23":forest?"#728579":"#b7a48a");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // Quiet painterly photographic-style atmospheric depth, never covers UI.
 polygon([[0,325],[120,242],[235,316],[345,193],[487,324],[625,215],[780,313],[913,221],[1100,319],[1100,515],[0,515]],forest?"#2d4e49":"#485b5b");
 polygon([[0,415],[130,331],[269,402],[430,293],[590,410],[761,318],[920,395],[1100,319],[1100,515],[0,515]],forest?"#25453f":"#344949");
 if(!forest){
  ctx.save();ctx.globalAlpha=.47;for(const [x,w,h] of [[62,180,135],[427,196,171],[807,160,121]]){
   ctx.fillStyle="#202e2c";ctx.fillRect(x,437-h,w,h);
   polygon([[x-20,437-h+10],[x+w/2,437-h-54],[x+w+22,437-h+10]],"#142a2d");
   ctx.fillStyle="#7a7b6a";for(let j=1;j<4;j++)ctx.fillRect(x+j*w/4,437-h+14,6,h-14)
  }ctx.restore();
 }else{
  ctx.save();ctx.globalAlpha=.5;for(let i=0;i<17;i++){
   const x=i*73+14,h=175+(i*37)%75;
   ctx.fillStyle="#142f2a";ctx.fillRect(x,440-h,8,h);
   ctx.strokeStyle="#8fa48d";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+4,440-h+35);ctx.lineTo(x+36,440-h+8);ctx.moveTo(x+4,440-h+75);ctx.lineTo(x-22,440-h+53);ctx.stroke()
  }ctx.restore()
 }
 const fog=ctx.createLinearGradient(0,320,0,520);
 fog.addColorStop(0,"#d4d8c900");fog.addColorStop(.55,"#d9d8c525");fog.addColorStop(1,"#18292766");
 ctx.fillStyle=fog;ctx.fillRect(0,310,W,215);
 ctx.fillStyle="#333b38";ctx.fillRect(0,G,W,H-G);
 ctx.strokeStyle="#afa28a";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();
 for(let x=0;x<W;x+=80){ctx.strokeStyle="#65706a";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,G+8);ctx.lineTo(x-20,H);ctx.stroke()}
 for(const p of platforms){
  ctx.shadowColor="#101719";ctx.shadowBlur=11;ctx.fillStyle="#505955";ctx.fillRect(p.x,p.y,p.w,19);
  ctx.shadowBlur=0;ctx.fillStyle="#a6a28d";ctx.fillRect(p.x,p.y,p.w,5);
  for(let j=1;j<4;j++){ctx.strokeStyle="#343c39";ctx.beginPath();ctx.moveTo(p.x+j*p.w/4,p.y+5);ctx.lineTo(p.x+j*p.w/4,p.y+19);ctx.stroke()}
 }
}
function image(key,x,y,w,h,flip=1){
 const im=images[key];if(!im||!im.complete||!im.naturalWidth)return false;
 ctx.save();if(flip===-1){ctx.translate(x+w,0);ctx.scale(-1,1);x=0}
 ctx.drawImage(im,x,y,w,h);ctx.restore();return true
}
function draw(){
 const d=Math.min(devicePixelRatio||1,2);ctx.setTransform(d*s,0,0,d*s,d*offx,d*offy);
 ctx.clearRect(-offx/s,-offy/s,canvas.width/(d*s),canvas.height/(d*s));
 drawBackdrop();
 if(phase==="menu")return;
 for(const b of blocks){
  if(b.hit)continue;ctx.save();ctx.shadowColor="#e9d39f";ctx.shadowBlur=7;
  ctx.fillStyle="#c6a875";ctx.strokeStyle="#f8dfac";ctx.lineWidth=4;
  ctx.beginPath();ctx.roundRect(b.x-b.w/2,b.y,b.w,b.h,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle="#6a513c";ctx.lineWidth=2;ctx.strokeRect(b.x-b.w/2+7,b.y+7,b.w-14,b.h-14);
  ctx.font="900 35px system-ui";ctx.textAlign="center";ctx.fillStyle="#17232a";ctx.fillText(String(b.value),b.x,b.y+39);ctx.restore();
 }
 for(const e of enemies){
  ctx.save();ctx.globalAlpha=.98;
  if(!image(e.kind,e.x-34,e.y-72,68,67,e.dir)) {
   ctx.fillStyle="#3b5444";ctx.strokeStyle="#d1b888";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(e.x,e.y-30,28,24,0,0,7);ctx.fill();ctx.stroke()
  }
  ctx.fillStyle="#171c20";ctx.fillRect(e.x-23,e.y-82,46,6);ctx.fillStyle="#d4aa75";ctx.fillRect(e.x-23,e.y-82,46*(e.hp/2),6);
  ctx.restore()
 }
 for(const p of projectiles){
  ctx.save();
  if(p.warning>0){
   ctx.strokeStyle=p.big?"#ffc69b":"#fff3b1";ctx.lineWidth=3;ctx.setLineDash([12,8]);
   ctx.beginPath();ctx.moveTo(760,p.y);ctx.lineTo(1070,p.y);ctx.stroke();ctx.setLineDash([]);
   ctx.textAlign="center";ctx.font="bold 20px system-ui";ctx.fillStyle="#fff3cc";ctx.fillText(p.big?"⚠ 致命大彈！":"⚠ 小彈",900,p.y-25);
  }else{ctx.shadowColor="#ff894e";ctx.shadowBlur=20;ctx.fillStyle=p.big?"#e35a43":"#b5c9af";ctx.beginPath();ctx.arc(p.x,p.y,p.big?31:17,0,7);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#ffe2a5";ctx.stroke()}
  ctx.restore()
 }
 for(const p of shots){
  ctx.save();ctx.shadowColor="#f6e9b0";ctx.shadowBlur=15;ctx.fillStyle="#f7e2aa";
  ctx.beginPath();ctx.ellipse(p.x,p.y,24,8,0,0,7);ctx.fill();ctx.globalAlpha=.6;ctx.fillStyle="#e4e5dd";ctx.fillRect(p.x-Math.sign(p.vx)*46,p.y-2,40,4);ctx.restore()
 }
 const pose=player.attackUntil>clock?"attack":!player.ground?"jump":Math.abs(player.vx)>20?"run":"idle";
 const heroKey=hero+"-"+pose;
 ctx.save();if(clock<invuln&&Math.floor(clock*14)%2===0)ctx.globalAlpha=.55;
 ctx.fillStyle="#0812168a";ctx.beginPath();ctx.ellipse(player.x,player.y+1,36,7,0,0,7);ctx.fill();
 if(!image(heroKey,player.x-53,player.y-135,106,143,player.face)){
  ctx.fillStyle="#e5dbb8";ctx.fillRect(player.x-15,player.y-95,30,76);ctx.beginPath();ctx.arc(player.x,player.y-108,16,0,7);ctx.fill()
 }
 if(clock<shieldUntil){ctx.strokeStyle="#9ff2d4";ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(player.x,player.y-68,58,90,0,0,7);ctx.stroke()}
 ctx.restore();
 for(const f of effects){
  ctx.save();ctx.globalAlpha=Math.min(1,f.t*2);
  ctx.strokeStyle=f.kind==="hurt"?"#ff6464":f.kind==="dash"?"#b7f3ed":"#e6deb8";
  ctx.lineWidth=6;ctx.beginPath();ctx.arc(f.x,f.y,13+(1-f.t)*42,0,Math.PI*2);ctx.stroke();
  if(f.kind==="ink"){ctx.fillStyle="#131c1c";for(let i=0;i<7;i++){let a=i*Math.PI/3.5;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*25,f.y+Math.sin(a)*25,4+i%4,0,7);ctx.fill()}}
  ctx.restore()
 }
}
function frame(ms){
 const dt=Math.min(.032,last?(ms-last)/1000:.016);last=ms;
 if(audio&&audio.state==="running")music(dt);
 update(dt);draw();requestAnimationFrame(frame)
}
function bindHold(id,key){
 const b=$(id);let pointer=null;
 b.addEventListener("pointerdown",e=>{e.preventDefault();if(phase!=="play")return;pointer=e.pointerId;keys[key]=true;b.classList.add("pressed");b.setPointerCapture?.(e.pointerId)});
 const end=e=>{if(pointer!==null&&(e.pointerId===pointer||e.type==="lostpointercapture")){keys[key]=false;pointer=null;b.classList.remove("pressed")}};
 for(const evt of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(evt,end);
}
bindHold("left","left");bindHold("right","right");
for(const [id,fn] of [["jump",jump],["wave",wave],["dash",dash]])$(id).addEventListener("pointerdown",e=>{e.preventDefault();if(phase!=="play")return;fn();$(id).classList.add("pressed")});
for(const id of ["jump","wave","dash"])for(const evt of ["pointerup","pointercancel","lostpointercapture"])$(id).addEventListener(evt,()=>$(id).classList.remove("pressed"));
addEventListener("keydown",e=>{
 const m={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"};
 if(m[e.code]){keys[m[e.code]]=true;e.preventDefault()}
 if(e.repeat)return;
 if(["Space","ArrowUp","KeyW","KeyJ"].includes(e.code)){jump();e.preventDefault()}
 if(["KeyK","KeyF"].includes(e.code)){wave();e.preventDefault()}
 if(["KeyL","ShiftLeft"].includes(e.code)){dash();e.preventDefault()}
 if(e.code==="KeyH"){defend();e.preventDefault()}
});
addEventListener("keyup",e=>{if(["ArrowLeft","KeyA"].includes(e.code))keys.left=false;if(["ArrowRight","KeyD"].includes(e.code))keys.right=false});
addEventListener("blur",()=>{keys.left=keys.right=false});
document.addEventListener("visibilitychange",()=>{if(document.hidden)keys.left=keys.right=false});
resize();menu();requestAnimationFrame(frame);
})();
</script></body></html>
