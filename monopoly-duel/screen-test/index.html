<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>城市大富翁｜16:9 大屏修正測試版</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071c30;overflow:hidden;font-family:system-ui,sans-serif}iframe{display:block;border:0;width:100%;height:100%;background:#e4f6ff}#label{position:fixed;z-index:99;bottom:5px;left:5px;padding:3px 8px;border-radius:6px;background:#09263dcc;color:#fff;font:11px system-ui;pointer-events:none}#status{position:fixed;z-index:99;top:8px;right:8px;background:#fffbe9;color:#184057;padding:7px 10px;border-radius:8px;font-size:12px;box-shadow:0 2px 12px #0004}#status:empty{display:none}</style></head>
<body><iframe id="gameframe" title="數學城市大富翁大屏測試" src="../?screen-test=169-20261123"></iframe><div id="label">16:9 大屏修正｜獨立測試版</div><div id="status">載入測試版…</div>
<script>
(function(){
const frame=document.getElementById('gameframe'),status=document.getElementById('status');
const css=`
/* Screen test override: after ALL existing game styles, never hide question side. */
html,body{min-width:0!important;max-width:100%!important;overflow-x:hidden!important}
#game{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important;min-height:0!important}
#game .top{min-width:0!important;max-width:100%!important;flex-shrink:0!important}
#game .layout,#game.big .layout,#game.duel .layout,
body.big #game .layout,body.duel #game .layout,
body.big .layout,body.duel .layout{
display:grid!important;
grid-template-columns:minmax(0,7fr) minmax(270px,3fr)!important;
grid-template-rows:minmax(0,1fr)!important;
gap:8px!important;
padding:8px!important;
width:100%!important;
max-width:100%!important;
min-width:0!important;
min-height:0!important;
align-items:stretch!important;
overflow:hidden!important;
}
#game .duelpanels{display:none!important}
#game .boardwrap{
grid-column:1!important;grid-row:1!important;
display:flex!important;flex-direction:column!important;
width:100%!important;min-width:0!important;min-height:0!important;
height:100%!important;max-height:100%!important;overflow:hidden!important;
}
#game .canvas,#game .big .canvas,#game.big .canvas,
body.big #game .canvas{
display:block!important;
width:100%!important;
height:100%!important;
flex:1 1 0!important;
min-width:0!important;
min-height:0!important;
max-width:100%!important;
max-height:100%!important;
aspect-ratio:auto!important;
object-fit:contain!important;
}
#game .legend{flex:0 0 auto!important;font-size:clamp(9px,.8vw,13px)!important;padding:4px 8px!important}
#game .side,#game.big .side,#game.duel .side,
body.big #game .side,body.duel #game .side{
grid-column:2!important;grid-row:1!important;
display:flex!important;flex-direction:column!important;
visibility:visible!important;opacity:1!important;
position:relative!important;
width:100%!important;min-width:0!important;
height:100%!important;min-height:0!important;
max-height:100%!important;overflow-y:auto!important;overflow-x:hidden!important;
padding:0!important;gap:7px!important;
}
#game .side .questioncard{
display:flex!important;flex-direction:column!important;
visibility:visible!important;opacity:1!important;
position:relative!important;top:auto!important;left:auto!important;
grid-column:auto!important;grid-row:auto!important;
width:100%!important;min-width:0!important;
height:auto!important;min-height:0!important;
max-height:none!important;overflow:visible!important;
padding:clamp(8px,1.1vw,15px)!important;
flex-shrink:0!important;
order:-10!important;
}
#game .turnlabel,#game #question,#game #answers,
#game .rollrow,#game #feedback{visibility:visible!important;opacity:1!important;max-width:100%!important}
#game #question{font-size:clamp(20px,2vw,32px)!important;line-height:1.32!important;overflow-wrap:anywhere!important;min-height:0!important;max-height:none!important}
#game #answers{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:5px!important;width:100%!important}
#game #answers button{font-size:clamp(15px,1.55vw,25px)!important;min-width:0!important;min-height:clamp(38px,5.2vh,58px)!important;white-space:normal!important;overflow-wrap:anywhere!important}
#game .rollrow{display:flex!important;flex-wrap:wrap!important;align-items:center!important;gap:7px!important;min-height:65px!important;overflow:visible!important}
#game #dice{flex:none!important;visibility:visible!important;overflow:visible!important;transform-origin:center center!important}
#game #action{min-width:120px!important;flex:1!important}
#game .side .rankingcard,#game .side>.card:not(.questioncard){flex-shrink:0!important}
@media (max-width:760px) and (orientation:portrait){
#game .layout,body.big #game .layout,body.duel #game .layout{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(230px,55dvh) auto!important;overflow-y:auto!important;height:auto!important}
#game .boardwrap{grid-column:1!important;grid-row:1!important;min-height:230px!important}
#game .side{grid-column:1!important;grid-row:2!important;height:auto!important;max-height:none!important;overflow:visible!important}
}
`;
function patch(){
try{
const doc=frame.contentDocument;if(!doc||!doc.head)return;
let style=doc.getElementById('hsin-screen-test-style');
if(!style){style=doc.createElement('style');style.id='hsin-screen-test-style';doc.head.appendChild(style)}
style.textContent=css;
const question=doc.getElementById('question');
status.textContent=question?'測試版已套用｜右側題目固定顯示':'測試版已套用｜請開始遊戲';
setTimeout(()=>{status.textContent=''},4500);
}catch(e){status.textContent='修正載入失敗，請重新整理';}
}
frame.addEventListener('load',()=>{patch();let runs=0;let timer=setInterval(()=>{patch();if(++runs>=5)clearInterval(timer)},1200)});
})();
</script></body></html>
