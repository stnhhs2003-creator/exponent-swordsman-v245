<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市大富翁 V3.7｜五輪迴歸測試</title><style>body{font:17px/1.7 system-ui;background:#101a2a;color:#fff;max-width:780px;margin:auto;padding:24px}button{font:inherit;padding:12px 20px;border:0;border-radius:10px;background:#85bbff;color:#081727;font-weight:700}pre{padding:20px;border:1px solid #53687e;border-radius:12px;white-space:pre-wrap}small{color:#bbcade}</style><h1>V3.7｜五輪回合保護測試</h1><p>測試事件模組的換組順序、模擬第二組新題目、事件不可重複結算，以及連續五輪（20 個組別回合）。</p><button id="run">執行測試</button><pre id="out">尚未執行</pre><small>本頁只測試獨立事件模組，不等同完整大富翁實機測試。正式版未修改。</small><script src="./v37-events.js"></script><script src="./v37-regression.js"></script><script>document.getElementById("run").onclick=function(){try{const r=MonopolyV37Regression.run();document.getElementById("out").textContent=(r.passed?"✅ 模組測試通過":"❌ 模組測試失敗")+"\n"+"檢查項目："+r.cases+"\n完成回合："+r.turns+" 次（"+r.completedRounds+" 輪）\n"+(r.failures.length?"錯誤："+r.failures.join("; "):"未發現事件模組迴歸錯誤")+"\n\n限制："+r.important;}catch(e){document.getElementById("out").textContent="❌ "+String(e);}};</script></html>
