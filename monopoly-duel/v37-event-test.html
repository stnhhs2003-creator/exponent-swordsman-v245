<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市大富翁 V3.7｜事件測試</title><style>body{font:18px system-ui,sans-serif;background:#101e33;color:white;max-width:850px;padding:22px;margin:auto}button,select{font:inherit;margin:5px;padding:12px;border-radius:9px;border:1px solid #6a9;cursor:pointer}article{background:#233853;border-radius:15px;padding:20px;margin:15px 0}small{color:#bdd}#log{white-space:pre-wrap;line-height:1.7}</style><h1>城市大富翁 V3.7｜獨立事件測試</h1><p>這不是正式遊戲；模擬四組依序抽卡，以檢查抽卡、解題、結算與下一組流程。</p><article><strong id="turn">第 1 輪｜第 1 組</strong><p id="event">請抽卡</p><button id="chance">抽機會卡</button><button id="fate">抽命運卡</button><div id="answers" hidden><button id="yes">挑戰成功</button><button id="no">挑戰失敗</button><button id="skip">放棄挑戰</button></div><p id="result"></p><button id="next" disabled>下一組</button></article><article><h2>測試紀錄</h2><small>可連續完成多輪，不會重複結算同一事件。</small><div id="log"></div></article><script src="./v37-events.js"></script><script>const engine=MonopolyV37Events.create();let player=0,round=1,current=null,position=[0,0,0,0],shield=[0,0,0,0],finished=false;const $=id=>document.getElementById(id);function update(){ $("turn").textContent="第 "+round+" 輪｜第 "+(player+1)+" 組｜第 "+position[player]+" 格";}function draw(type){if(current||finished)return;current=engine.draw(type,player,position[player]<Math.max(...position));$("event").textContent=current.event.title+"｜"+(current.event.challenge?"挑戰難度："+current.event.challenge:"直接事件");$("answers").hidden=false;$("chance").disabled=$("fate").disabled=true;}function resolve(correct,accept=true){if(!current||finished)return;const r=engine.resolve(current.token,player,{correct,accept,hasShield:shield[player]>0,roll:Math.floor(Math.random()*4),choice:"risk"});position[player]=Math.max(0,position[player]+r.steps);if(r.shieldUsed)shield[player]--;shield[player]=Math.min(1,shield[player]+r.shieldGain);$("result").textContent="事件完成：位移 "+r.steps+" 格"+(r.shieldGain?"；取得護盾":"");$("log").textContent+=`第${round}輪 第${player+1}組：${current.event.title} → ${r.steps} 格\n`;current=null;finished=true;$("answers").hidden=true;$("next").disabled=false;update();}function next(){if(!finished)return;player++;if(player===4){player=0;round++;}finished=false;$("result").textContent="";$("event").textContent="請抽卡";$("next").disabled=true;$("chance").disabled=$("fate").disabled=false;update();}$("chance").onclick=()=>draw("chance");$("fate").onclick=()=>draw("fate");$("yes").onclick=()=>resolve(true);$("no").onclick=()=>resolve(false);$("skip").onclick=()=>resolve(false,false);$("next").onclick=next;update();</script></html>
