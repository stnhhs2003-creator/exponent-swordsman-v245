const setupRules=document.querySelector('.rules');setupRules.innerHTML='🏁 <b>10 分鐘班級競賽</b>：由 GO 出發，先到第 31 格終點旗幟者獲勝。<br>⏱ 時間到若無人抵達：依前進格數 → 答對題數 → 城市星星 → 正確答題平均時間排名；完全相同時公平抽籤。<br>🎲 答對擲骰；簡單／普通／困難分別加 0／1／2 步。詳解、骰子和換人會自動推進，也可手動提早操作。<br>🎁 機會卡可前進；公益寶箱可得星星；休息站停留一回合。';
[...$('level').options].forEach((o,i)=>o.textContent=['簡單 · 25 秒','普通 · 20 秒','困難 · 15 秒'][i]);
const baseStart=startGame,baseNext=nextQuestion,baseAnswer=answer,baseRoll=roll,baseAdvance=advance,baseVictory=victory,baseHome=home;
function clearAuto(){if(autoTurn!==null){clearTimeout(autoTurn);autoTurn=null}}
function autoAction(expected,delay){clearAuto();const token=run,serial=turnSerial;autoTurn=setTimeout(()=>{autoTurn=null;if(token!==run||serial!==turnSerial||phase!==expected)return;if(Date.now()>=matchDeadline){finishTimed('時間到');return}if(expected==='roll')roll();else advance()},delay)}
function standings(){return [...players].sort((a,b)=>b.pos-a.pos||b.correct-a.correct||b.stars-a.stars||mean(a)-mean(b)||a.lottery-b.lottery)}
function mean(p){return p.correct?Math.round((p.answerMs||0)/p.correct):Infinity}
rankHTML=function(){return standings().map((p,i)=>`<div class="rankitem ${p.id===current?'active':''}"><span class="avatar" style="background:${p.color}">${i+1}</span><div><strong></strong><small>答對 ${p.correct}　⭐ ${p.stars}　${p.skip?'停留 1 回':''}${p.correct?'　平均 '+(mean(p)/1000).toFixed(1)+' 秒':''}</small></div><span class="distance">${p.pos}/31</span></div>`).join('')};
showRanks=function(){let sorted=standings();for(let id of ['rank','duelrank','finalrank']){$(id).innerHTML=rankHTML();[...$(id).querySelectorAll('strong')].forEach((el,i)=>el.textContent=sorted[i].name)}};
function updateMatchClock(){if(!matchDeadline||phase==='home'||phase==='win')return;let ms=Math.max(0,matchDeadline-Date.now()),s=Math.ceil(ms/1000);matchClock.textContent='🏁 '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');matchClock.style.background=s<=60?'#ffb9af':'#fff4ba';if(ms<=0)finishTimed('10 分鐘時間到')}
function snapshotScores(){return players.map(p=>({...p}))}
function tournamentStart(){clearAuto();matchDeadline=Date.now()+600000;finishReason='';lastRoundScores=null;turnSerial++;matchClock.textContent='🏁 10:00';matchClock.style.background='#fff4ba';baseStart();players.forEach((p,i)=>{p.answerMs=0;p.lottery=Math.random()});showRanks();$('meta').textContent+='｜限時 10 分鐘'}
function finishTimed(reason){if(phase==='home'||phase==='win')return;clearAuto();run++;moveAnim=null;finishReason=reason;let result=standings();current=result[0].id;phase='win';$('finish').querySelector('p').textContent=reason+'！依進度、正確題數、星星、平均答題時間排名。';$('boardstatus').textContent='競賽結束';baseVictory();matchClock.textContent='🏁 結算';if(result[0].pos===result[1]?.pos&&result[0].correct===result[1]?.correct&&result[0].stars===result[1]?.stars&&mean(result[0])===mean(result[1]))$('finish').querySelector('p').textContent=reason+'！同分同速，依開局公平隨機籤決定勝者。'}
nextQuestion=function(){clearAuto();turnSerial++;duration=[25,20,15][level];askedAt=performance.now();baseNext()};
answer=function(a,button){if(phase!=='question')return;if(Date.now()>=matchDeadline){finishTimed('10 分鐘時間到');return}if(a===question.answer){let p=players[current];p.answerMs=(p.answerMs||0)+Math.max(1,performance.now()-askedAt)}baseAnswer(a,button);if(phase==='roll')autoAction('roll',3500);else if(phase==='explain')autoAction('explain',5000)};
roll=async function(){if(phase!=='roll')return;clearAuto();if(Date.now()>=matchDeadline){finishTimed('10 分鐘時間到');return}let token=run;await baseRoll();if(token===run&&phase==='done')autoAction('done',3000)};
advance=function(){clearAuto();if(phase==='home'||phase==='win')return;if(Date.now()>=matchDeadline){finishTimed('10 分鐘時間到');return}if(current===players.length-1){lastRoundScores=snapshotScores();let remaining=matchDeadline-Date.now();let fairRoundBudget=players.length*([15,13,11][level]+6)*1000;if(remaining<fairRoundBudget){finishTimed('完整回合結束，剩餘時間不足再進行一輪');return}}baseAdvance()};
victory=function(){clearAuto();finishReason='抵達終點';$('finish').querySelector('p').textContent='率先抵達第 31 格終點！城市冒險成功！';baseVictory();matchClock.textContent='🏁 完賽'};
home=function(){clearAuto();matchDeadline=0;baseHome()};
$('start').onclick=tournamentStart;$('again').onclick=tournamentStart;$('back').onclick=home;
setInterval(()=>updateMatchClock(),200);document.addEventListener('visibilitychange',updateMatchClock);

const intro=document.createElement('div');intro.className='intro';intro.innerHTML='<span class="badge">CITY QUEST · 七年級數學</span><h1>數學<span>城市</span><br>大富翁</h1><p>四位冒險家 × 六大數學單元 × 10 分鐘競賽</p><div class="hero-gallery" id="hero-gallery"></div><p>答對・擲骰・穿越城市・搶先抵達旗幟！</p>';$('home').prepend(intro);document.querySelector('.setup h1').textContent='設定你的城市挑戰';document.querySelector('.setup .subtitle').textContent='選擇課程與角色，準備開始冒險。';
const gallery=$('hero-gallery');heroNames.forEach((name,i)=>{let div=document.createElement('div');div.className='hero-display';let c=document.createElement('canvas');c.width=180;c.height=220;c.dataset.hero=i;div.append(c);let s=document.createElement('strong');s.textContent=name;s.style.color=['#baccff','#efd0ff','#ffce94','#baffec','#afe6ff'][i];div.append(s);gallery.append(div)});
function drawHeroThumb(c,idx){let sheet=idx===4?heroFifth:heroSheet;if(!sheet.complete||!sheet.naturalWidth)return;let h=c.getContext('2d');h.clearRect(0,0,c.width,c.height);let cw=sheet.naturalWidth/(idx===4?1:4),ch=sheet.naturalHeight/2,scale=Math.min(c.width/cw,c.height/ch),w=cw*scale,d=ch*scale;h.drawImage(sheet,(idx===4?0:idx)*cw,0,cw,ch,(c.width-w)/2,(c.height-d)/2,w,d)}
heroSheet.onload=heroFifth.onload=()=>document.querySelectorAll('canvas[data-hero]').forEach(c=>drawHeroThumb(c,+c.dataset.hero));
const baseNames=makeNames;let heroChoice=[0,1,2,3,4];
function refreshHeroChoices(){let selectors=[...$('names').querySelectorAll('select')];selectors.forEach((s,i)=>{[...s.options].forEach(o=>o.disabled=false);let c=s.parentElement.querySelector('canvas');c.dataset.hero=s.value;drawHeroThumb(c,+s.value);heroChoice[i]=+s.value});}
