<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>城市大富翁 V3.1｜白色骰子測試</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(165deg,#cceefd,#eafaf0);color:#153a55}body{display:grid;place-items:center;padding:16px}.app{width:min(740px,100%);background:#ffffffd9;border:2px solid white;border-radius:24px;padding:20px;text-align:center;box-shadow:0 18px 40px #23516c26}h1{font-size:clamp(21px,4vw,30px);margin:0 0 8px}.note{font-size:14px;opacity:.8;margin:0}.arena{height:min(50vh,360px);min-height:250px;display:grid;place-items:center;perspective:900px;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at center,#f6fbff,#cae7db)}.arena:before{content:"";position:absolute;bottom:15%;width:250px;height:45px;border-radius:50%;background:#375f6540;filter:blur(17px);transform:scale(.8)}.cube{width:128px;height:128px;position:relative;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-31deg);transition:transform 1.15s cubic-bezier(.15,.8,.18,1.02);will-change:transform}.cube.rolling{animation:bounce 1.15s ease-in-out}.face{position:absolute;inset:0;background:linear-gradient(135deg,#fff,#f3f4f5);border:3px solid #e4e9ed;border-radius:20px;box-shadow:inset -9px -10px 18px #c5ced333,inset 7px 7px 14px #fff9;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:21px;gap:7px;backface-visibility:hidden}.pip{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4f5d68,#131b23 70%);box-shadow:inset 1px 2px 2px #0008;place-self:center}.f1{transform:translateZ(64px)}.f6{transform:rotateY(180deg) translateZ(64px)}.f2{transform:rotateY(90deg) translateZ(64px)}.f5{transform:rotateY(-90deg) translateZ(64px)}.f3{transform:rotateX(90deg) translateZ(64px)}.f4{transform:rotateX(-90deg) translateZ(64px)}.f1 .pip{grid-area:2/2}.f2 .pip:nth-child(1){grid-area:1/1}.f2 .pip:nth-child(2){grid-area:3/3}.f3 .pip:nth-child(1){grid-area:1/1}.f3 .pip:nth-child(2){grid-area:2/2}.f3 .pip:nth-child(3){grid-area:3/3}.f4 .pip:nth-child(1){grid-area:1/1}.f4 .pip:nth-child(2){grid-area:1/3}.f4 .pip:nth-child(3){grid-area:3/1}.f4 .pip:nth-child(4){grid-area:3/3}.f5 .pip:nth-child(1){grid-area:1/1}.f5 .pip:nth-child(2){grid-area:1/3}.f5 .pip:nth-child(3){grid-area:2/2}.f5 .pip:nth-child(4){grid-area:3/1}.f5 .pip:nth-child(5){grid-area:3/3}.f6 .pip:nth-child(1){grid-area:1/1}.f6 .pip:nth-child(2){grid-area:2/1}.f6 .pip:nth-child(3){grid-area:3/1}.f6 .pip:nth-child(4){grid-area:1/3}.f6 .pip:nth-child(5){grid-area:2/3}.f6 .pip:nth-child(6){grid-area:3/3}@keyframes bounce{0%{translate:0 -85px;scale:.78}55%{translate:0 8px;scale:1.05}78%{translate:0 -14px}100%{translate:0 0;scale:1}}.result{font-size:23px;font-weight:900;margin:12px 0}button{border:0;border-radius:13px;background:#116ca0;color:white;font-size:18px;font-weight:800;padding:13px 18px;min-height:48px;cursor:pointer}button:disabled{opacity:.5}.choices{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.choices button{background:#e1f2fb;color:#165272;min-width:48px;padding:10px}.foot{margin-top:14px;color:#567484;font-size:13px}.mini{font-size:12px;margin:8px} @media(max-height:510px) and (orientation:landscape){body{padding:7px}.app{padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;align-items:center}.arena{grid-row:1/5;grid-column:1;height:85vh;min-height:180px}h1,.note,.result,.choices,.foot,.mini{grid-column:2;margin:3px 0}.cube{scale:.85}.choices button{padding:6px;min-height:35px;font-size:14px}.foot{display:none}}
</style></head><body><main class="app"><h1>🎲 城市大富翁 V3.1</h1><p class="note">經典白色立體骰子｜獨立測試版（不影響正式遊戲）</p><section class="arena" aria-label="立體骰子展示"><div id="cube" class="cube" aria-hidden="true"></div></section><div class="result" id="result" role="status">準備擲骰</div><div><button id="roll">🎲 擲出骰子</button></div><div class="mini">指定點數檢查：點選 1～6，確認每個面朝向正確</div><div class="choices" id="choices"></div><div class="foot">此頁只測試 3D 骰子視覺與 1～6 點，不包含正式遊戲題庫、角色移動或計時。</div></main><script>
const cube=document.getElementById('cube'),result=document.getElementById('result'),roll=document.getElementById('roll'),choices=document.getElementById('choices');
for(let n=1;n<=6;n++){const f=document.createElement('div');f.className='face f'+n;for(let i=0;i<n;i++){const p=document.createElement('i');p.className='pip';f.appendChild(p)}cube.appendChild(f);const b=document.createElement('button');b.textContent=n+' 點';b.onclick=()=>throwDice(n);choices.appendChild(b)}
const orientation={1:[-24,-31],2:[-24,-121],3:[-114,-31],4:[66,-31],5:[-24,59],6:[-24,149]};let busy=false;let extraX=0,extraY=0;
function throwDice(n){if(busy)return;busy=true;roll.disabled=true;choices.querySelectorAll('button').forEach(b=>b.disabled=true);result.textContent='滾動中…';cube.classList.remove('rolling');void cube.offsetWidth;cube.classList.add('rolling');extraX+=1440;extraY+=1440;const [x,y]=orientation[n];cube.style.transform='rotateX('+(x-extraX)+'deg) rotateY('+(y+extraY)+'deg)';setTimeout(()=>{result.textContent='🎲 擲出 '+n+' 點';cube.classList.remove('rolling');busy=false;roll.disabled=false;choices.querySelectorAll('button').forEach(b=>b.disabled=false)},1200)}
roll.onclick=()=>throwDice(Math.floor(Math.random()*6)+1);
</script></body></html>
