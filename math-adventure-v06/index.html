:env(safe-area-inset-bottom)}#controls button{min-width:0;min-height:42px;padding:5px 11px}#panel{inset:2%;z-index:3}header{font-size:clamp(12px,1.5vw,20px)}#home{font-size:12px;padding:4px 9px}@media(orientation:landscape) and (max-height:500px){#app{width:100%;height:100dvh;max-width:none;grid-template-columns:minmax(0,1fr) minmax(145px,26%);gap:3px;padding:3px max(5px,env(safe-area-inset-right)) 3px max(5px,env(safe-area-inset-left))}#mission{font-size:12px;padding:6px;line-height:1.4}#controls button{min-height:34px;padding:3px 9px;font-size:13px}#msg{font-size:12px;padding:3px 6px}header{padding:3px 6px}#panel{font-size:13px}}@media(orientation:portrait){#app{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto}#mission,#game{grid-column:1;grid-row:auto}#game{aspect-ratio:16/9}#controls{flex-wrap:wrap}#mission{white-space:normal;font-size:14px}}</style><div id="app"><header><span>15 ｜ 數學幻境</span><span id="hud">一元一次方程式</span><button id="home">首頁</button></header><section id="start"><small style="letter-spacing:3px;color:#e3bd80">CASE 015 · 校園封鎖事件</small><h1>校園迷案｜現場調查 V0.6</h1><p>校園出口遭到封鎖。調查五處現場，蒐集證詞、紀錄與干擾資訊，找出未知數、建立方程式、求解並驗證，最後帶著檔案逃離守衛。</p><p>方向鍵／觸控移動，靠近物件按互動。調查與解題期間安全，取得證物後守衛才會造成傷害。每區找到兩份線索、取得磁卡、自行輸入方程式、求解並尋找正確編號的證物，再於45秒內抵達出口。最後組合五個數字碎片。逾時重啟該區封印；三顆心耗盡即失敗，完成五區即勝利。</p><label>難度 <select id="level"><option>初階</option><option>進階</option></select></label> <button id="begin">開始冒險</button></section><div id="mission" hidden></div><main id="game" hidden><canvas id="c" width="960" height="540"></canvas><section id="panel" hidden><h2 id="pt"></h2><div id="body"></div><div id="options"></div></section></main><div id="msg" aria-live="polite"></div><div id="controls" hidden><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button><button id="act">調查 E</button><button id="dash">閃避</button><button id="notes">線索簿</button><button id="sound">音效 開</button></div></div><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let cardFound=false,escape=0,decoded=false,fragments=[];let errors={read:0,eq:0,calc:0,verify:0},cool=0;let stage=0,hp=3,seen=[],solved=false,playing=false,modal=false,px=1,py=1,keys={},last=0,immune=0,elapsed=0,mute=false,audio,phase=0,questions=[],dash=0,feedback='';const themes=['神秘福利社','魔法圖書館','地下檔案室','校園地下水道','時空鐘塔'],colors=['#315e68','#52446d','#675244','#28606c','#4c386b'];const spots=[{x:2,y:6,n:'收據／證詞',type:0},{x:7,y:1,n:'付款／紀錄',type:1},{x:4,y:1,n:'上鎖抽屜',type:4},{x:1,y:4,n:'現場紀錄',type:5},{x:7,y:6,n:'密碼台',type:2},{x:9,y:4,n:'出口',type:3},{x:2,y:3,n:'物件甲',type:6},{x:5,y:5,n:'物件乙',type:7},{x:8,y:2,n:'物件丙',type:8}];function make(i,hard){let x=3+Math.floor(Math.random()*8),a=hard?4:2,b=hard?15:5;switch(i){case 0:return {cl:[`福利社收據：買了 ${a} 本同價筆記本，另買一支 ${b} 元的筆。`,`付款紀錄：共付 ${a*x+b} 元。`],ask:'一本筆記本多少元？設 x 為一本筆記本的價錢。',eq:[`${a}x + ${b} = ${a*x+b}`,`${a}(x + ${b}) = ${a*x+b}`,`x + ${a+b} = ${a*x+b}`],x,unit:'元'};case 1:return {cl:[`甲書架的書比乙書架的 ${a} 倍多 ${b} 本。`,`兩架共有 ${(a+1)*x+b} 本書。`],ask:'乙書架有幾本書？設 x 為乙書架的書量。',eq:[`x + ${a}x + ${b} = ${(a+1)*x+b}`,`${a}x + ${b} = ${(a+1)*x+b}`,`x + ${a}x − ${b} = ${(a+1)*x+b}`],x,unit:'本'};case 2:return {cl:[`哥哥比妹妹大 ${b} 歲。`,`兩人目前年齡總和是 ${2*x+b} 歲。`],ask:'妹妹現在幾歲？設 x 為妹妹年齡。',eq:[`x + (x + ${b}) = ${2*x+b}`,`x + ${b} = ${2*x+b}`,`2(x + ${b}) = ${2*x+b}`],x,unit:'歲'};case 3:return {cl:[`維修車每分鐘前進 ${a*10} 公尺。`,`從入口到控制室共 ${a*10*x} 公尺。`],ask:'車輛需要行駛幾分鐘？設 x 為行駛時間。',eq:[`${a*10}x = ${a*10*x}`,`x + ${a*10} = ${a*10*x}`,`x − ${a*10} = ${a*10*x}`],x,unit:'分鐘'};default:return {cl:[`甲組晶石數是乙組的 ${a} 倍。`,`甲乙兩組合計 ${(a+1)*x} 枚晶石。`],ask:'乙組有幾枚？設 x 為乙組晶石數。',eq:[`x + ${a}x = ${(a+1)*x}`,`${a}x = ${(a+1)*x}`,`x + ${a} = ${(a+1)*x}`],x,unit:'枚'}}}function beep(f=440){if(mute)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.frequency.value=f;v.gain.setValueAtTime(.07,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch(e){}}function say(s){$('msg').textContent=s;mission()}function mission(){let m=$('mission');m.hidden=!playing;if(!playing)return;m.textContent='案件 '+(stage+1)+'／5　'+themes[stage]+'\n──────────\n目前目標\n'+(solved?'前往綠色出口！':decoded?'尋找 '+questions[stage].x+' 號'+objectNames[stage]:cardFound?'調查金色密碼台，列出方程式':seen.length===2?'調查上鎖抽屜，取得磁卡':'走到收據及付款紀錄旁，按調查')+'\n\n調查清單\n'+(seen.includes(0)?'✓':'○')+' 第一份文件\n'+(seen.includes(1)?'✓':'○')+' 第二份文件\n'+(cardFound?'✓':'○')+' 磁卡\n'+(decoded?'✓':'○')+' 數學推理\n'+(solved?'✓':'○')+' 關鍵證物\n\n操作：方向鍵移動，靠近物件按調查。閱讀期間安全。'}function hud(){mission();$('hud').textContent=`${stage+1}/5 ${themes[stage]} ｜ ${'♥'.repeat(hp)} ｜ 晶石 ${stage+(solved?1:0)}/5${solved?' ｜ 逃生 '+Math.ceil(escape)+'秒':''}`}function reset(){decoded=false;cardFound=false;escape=0;seen=[];solved=false;px=1;py=1;immune=2;hud();say('調查兩處線索，再找出隱藏磁卡。')}function start(){fragments=[];errors={read:0,eq:0,calc:0,verify:0};cool=0;questions=themes.map((_,i)=>make(i,$('level').selectedIndex===1));stage=0;hp=3;elapsed=0;playing=true;modal=false;$('start').hidden=true;$('game').hidden=false;$('controls').hidden=false;$('panel').hidden=true;reset();beep()}function close(){mission();modal=false;$('panel').hidden=true;keys={};immune=Math.max(immune,1)}function panel(t,html,buttons){modal=true;keys={};$('panel').hidden=false;$('pt').textContent=t;$('body').innerHTML=html;$('options').replaceChildren();for(let [label,fn] of buttons){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('options').append(b)}}function notes(){if(!playing||modal)return;panel('線索簿與背包',`<p>磁卡：${cardFound?'已取得':'未取得'}｜晶石：${stage+(solved?1:0)}</p>`+(seen.length?seen.map(i=>`<p>${questions[stage].cl[i]}</p>`).join(''):'尚未取得線索。'),[['返回',close]])}function lose(reason){hp--;beep(150);hud();say(reason+'，扣除一顆心。');immune=2;if(hp<=0)end(false)}function end(win){playing=false;panel(win?'校園解封！成功通關':'冒險失敗',`<p>完成 ${win?5:stage} 個區域，剩餘生命 ${hp}，探索時間 ${Math.floor(elapsed)} 秒。</p><p>閱讀判斷錯誤 ${errors.read} 次｜列式 ${errors.eq} 次｜求解 ${errors.calc} 次｜驗證 ${errors.verify} 次</p><p>${win?'五枚晶石已歸位。':'生命已耗盡，可以重新挑戰。'}</p>`,[['再玩一次',start],['首頁',home]])}function home(){playing=false;close();$('start').hidden=false;$('game').hidden=true;$('controls').hidden=true;say('')}function equation(){let q=questions[stage];panel('偵探手記：建立方程式',q.cl.map(s=>'<p>'+s+'</p>').join('')+'<p><b>'+q.ask+'</b></p><p>請自行列式，可用數字、x、加減乘除及括號。</p><input id="formula" style="max-width:100%;width:95%" placeholder="輸入方程式" autocapitalize="off" autocomplete="off"><p id="eqhint"></p>',[['確認列式',()=>{let norm=s=>s.toLowerCase().replace(/\s/g,'').replace(/[×＊*]/g,'').replace(/[−－]/g,'-').replace(/＝/g,'=').replace(/（/g,'(').replace(/）/g,')');let v=norm($('formula').value),e=norm(q.eq[0]);if(v===e||v===e.split('=').reverse().join('=')){beep(680);answer()}else{errors.eq++;$('eqhint').textContent='請依兩份證據列出未化簡的等式，並確認兩邊代表相同數量。';beep(180)}}],['提示',()=>{$('eqhint').textContent='先寫出兩個數量的關係，再用等號連結總量。'}],['返回',close]])}const unknowns=[['一本筆記本的價錢','原子筆的價錢','總付款金額'],['乙書架的書量','甲書架的書量','兩架書的總量'],['妹妹現在的年齡','哥哥現在的年齡','兩人的年齡差'],['行駛時間','每分鐘行駛距離','入口至控制室的距離'],['乙組晶石數','甲組晶石數','兩組晶石總數']];
const objectNames=['置物櫃','書籍','人物檔案','水閘','能源機關'];const targetIndex=[1,2,0,2,1];function objectNumber(i){return questions[stage].x+i-targetIndex[stage]}const noise=['福利社今天下午四點打烊。','圖書館的窗簾是深藍色。','檔案室位於地下第一層。','維修車的車身是黃色。','鐘塔的門上有一個星形標誌。'];
function puzzle(){let q=questions[stage];let opts=unknowns[stage].map((v,i)=>[v,i]).sort(()=>Math.random()-.5);panel('閱讀推理：找出未知數',q.cl.map(s=>`<p>${s}</p>`).join('')+`<p>現場紀錄：${noise[stage]}</p><p><b>${q.ask.split('設 x')[0]}</b></p><p>要用 x 表示哪個量，才能直接回答問題？</p><p id="readhint"></p>`,[...opts.map(([v,i])=>[v,()=>{if(i===0)relevance();else{errors.read++;$('readhint').textContent='請看清楚題目問的是哪一個量。';beep(180)}}]),['返回探索',close]])}
function relevance(){panel('閱讀推理：排除無關資訊',`<p>哪項資料不影響本題的數量關係？</p><p id="relhint"></p>`,[...[[noise[stage],1],...questions[stage].cl.map(v=>[v,0])].sort(()=>Math.random()-.5).map(([v,i])=>[v,()=>{if(i)equation();else{errors.read++;$('relhint').textContent='這項資料是列式需要的條件。';}}]),['返回',puzzle]])}
function verify(){let q=questions[stage];decoded=true;beep(740);panel('推理完成：尋找實物','<p>你推得 x = '+q.x+' '+q.unit+'。</p><p>請到地圖上尋找編號 '+q.x+' 的'+objectNames[stage]+'，取得本案證物。答案本身不能開門。</p>',[['出發調查',close]])}function answer(){let q=questions[stage];panel('求解並驗證',`<p>${q.eq[0]}</p><label>x = <input id="ans" type="number" inputmode="numeric"> ${q.unit}</label><p id="hint"></p>`,[['驗證',()=>{let v=$('ans').value;if(v!==''&&Number(v)===q.x){verify()}else{errors.calc++;$('hint').textContent='答案不符，請移項或代入檢查。';beep(170)}}],['重新列式',puzzle]])}function interact(){if(!playing||modal)return;let s=spots.slice().sort((a,b)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(b.x-px,b.y-py)).find(s=>Math.hypot(s.x-px,s.y-py)<1.3);if(!s){say('靠近發光物件再按互動。');return}if(s.type>=6){if(!decoded){say('請先從證據建立方程式並求解，再確認正確編號。');return}let n=objectNumber(s.type-6);if(n!==questions[stage].x){say('編號 '+n+' 與推理結果不符，繼續調查。');return}if(solved){say('證物已取得，請前往出口。');return}solved=true;escape=45;hud();beep(880);panel('找到關鍵證物！','<p>編號 '+n+' 的'+objectNames[stage]+'已解鎖。取得數字碎片。</p><p>離開面板後有45秒逃生時間。</p>',[['逃離密室',close]]);return}if(s.type===4){if(seen.length<2){say('抽屜需要兩份線索才能打開。');return}panel('隱藏抽屜：拼合證據','<p>兩張線索都已找到。請選擇可用來建立方程式的證據組合。</p><p>'+questions[stage].cl.join('<br>')+'</p><p id="drawerHint"></p>',[['兩張數量紀錄',()=>{cardFound=true;beep(740);close();say('取得磁卡！前往方程式機關。')}],['只看現場裝飾',()=>{$('drawerHint').textContent='裝飾無法提供完整數量關係。'}],['返回',close]]);return}if(s.type===5){panel('現場紀錄',`<p>${noise[stage]}</p><p>這項資訊有用嗎？請自行判斷。</p>`,[['返回',close]]);return}if(s.type<2){if(!seen.includes(s.type))seen.push(s.type);beep(580);panel(s.n,`<p>${questions[stage].cl[s.type]}</p>`,[['收錄並返回',close]])}else if(s.type===2){if(solved)say('機關已解鎖，前往出口。');else if(decoded)say('請找出符合答案編號的實物。');else if(seen.length<2)say('需先蒐集兩個線索。');else if(!cardFound)say('需要抽屜中的磁卡，才能啟動機關。');else puzzle()}else if(!solved)say('出口封印中，先解開方程式機關。');else {fragments.push(questions[stage].x);if(stage===4)finalLock();else{stage++;reset();beep(740)}}}function finalLock(){let code=fragments.slice().sort((a,b)=>a-b).map(n=>n%10).join('');panel('最後的校園密碼','<p>取得的證物碎片：'+fragments.join('、')+'</p><p>研究員留言：將碎片數值由小到大排列，依序取個位數。</p><input id="finalcode" inputmode="numeric" maxlength="5" placeholder="五位密碼"><p id="finalhint"></p>',[['解鎖',()=>{if($('finalcode').value===code)end(true);else $('finalhint').textContent='順序或個位數有誤，再閱讀留言。'}]])}function iso(x,y,z=0){return [435+(x-y)*47,86+(x+y)*23-z]}function poly(p,col){g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=col;g.fill()}function tile(x,y,col){poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],col)}function block(x,y,h,col){poly([iso(x,y+1),iso(x+1,y+1),iso(x+1,y+1,h),iso(x,y+1,h)],'#1d303e');poly([iso(x+1,y),iso(x+1,y+1),iso(x+1,y+1,h),iso(x+1,y,h)],'#253c4a');poly([iso(x,y,h),iso(x+1,y,h),iso(x+1,y+1,h),iso(x,y+1,h)],col)}function label(x,y,t,col='#fff'){g.font='bold 19px system-ui';g.textAlign='center';g.strokeStyle='#152030';g.lineWidth=4;g.strokeText(t,x,y);g.fillStyle=col;g.fillText(t,x,y)}function actor(x,y,enemy){let [u,v]=iso(x+.5,y+.5);g.fillStyle='#0006';g.beginPath();g.ellipse(u,v,18,8,0,0,7);g.fill();g.fillStyle=enemy?'#682e42':'#253c55';g.fillRect(u-12,v-17,9,17);g.fillRect(u+3,v-17,9,17);g.fillStyle=enemy?'#b84651':'#42aaca';g.beginPath();g.roundRect(u-12,v-38,24,31,8);g.fill();g.fillStyle=enemy?'#f8ae64':'#ffe0ae';g.beginPath();g.arc(u,v-42,13,0,7);g.fill();g.fillStyle='#172638';g.fillRect(u-6,v-44,3,4);g.fillRect(u+3,v-44,3,4);g.fillStyle=enemy?'#4d2636':'#67503a';g.beginPath();g.ellipse(u,v-52,14,7,0,0,7);g.fill();g.fillRect(u-17,v-48,34,4);if(!enemy){g.fillStyle='#e8b76f';g.fillRect(u-4,v-30,8,17)}label(u,v-69,enemy?'守衛':'偵探',enemy?'#ff9995':'#bff5ff')}function drawProp(s,u,v){let t=s.type;g.save();g.translate(u,v);const rect=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};const frame=(x,y,w,h,c)=>{rect(x,y,w,h,c);g.strokeStyle='#302b2a';g.lineWidth=2;g.strokeRect(x,y,w,h)};if(t===3){frame(-24,-91,48,88,'#5c4331');frame(-18,-84,36,78,sol ,v]=iso(-.02,y+.5,32);g.fillStyle='#6b4b35';g.fillRect(u-17,v-14,34,29);for(let k=0;k<5;k++){g.fillStyle=['#c39558','#567b81','#884f52'][k%3];g.fillRect(u-15+k*6,v-10,4,20)}}}let objects=spots.map(s=>({...s,kind:'spot'}));objects.push({x:px,y:py,kind:'player'},{x:4+Math.sin(phase*(stage===4?1.8:1))*2.4,y:4+Math.cos(phase)*1.4,kind:'enemy'});objects.sort((a,b)=>a.x+a.y-b.x-b.y);for(let s of objects){if(s.kind==='spot'){let [u,v]=iso(s.x+.5,s.y+.5);g.fillStyle='#edc36b44';g.beginPath();g.ellipse(u,v,30,15,0,0,7);g.fill();block(s.x+.15,s.y+.15,22,s.type===3?(solved?'#56d89b':'#a34a56'):s.type===2?'#e5b457':s.type===4?(cardFound?'#65c7a3':'#a2a0c5'):s.type===5?'#a2a0c5':seen.includes(s.type)?'#65c7a3':'#77c9ff');drawProp(s,u,v);let near=Math.hypot(s.x-px,s.y-py)<1.3;if(near&&!modal){g.strokeStyle='#ffe8a0';g.lineWidth=3;g.beginPath();g.ellipse(u,v,36,18,0,0,7);g.stroke();label(u,v+28,'按互動','#ffe49a')}label(u,v-(s.type===3?104:s.type===4||s.type>=6?82:72),s.type>=6?objectNumber(s.type-6)+'號'+objectNames[stage]:s.n,s.type===2?'#ffda85':'#fff')}else actor(s.x,s.y,s.kind==='enemy')}label(480,28,`${themes[stage]} · ${solved?'前往出口':'蒐集線索並破解機關'}`);if(immune>0){let [u,v]=iso(px+.5,py+.5);g.strokeStyle='#89e5ff';g.beginPath();g.ellipse(u,v,23,11,0,0,7);g.stroke()}}requestAnimationFrame(loop)}const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};addEventListener('keydown',e=>{if(!playing||modal)return;if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}if(e.key.toLowerCase()==='e')interact();if(e.code==='Space'){e.preventDefault();if(cool<=0){dash=.25;cool=1.5;immune=Math.max(immune,.35)}}});addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});addEventListener('blur',()=>keys={});document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[d]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[d]=false});$('act').onclick=interact;$('notes').onclick=()=>{if(playing&&!modal)notes()};$('dash').onclick=()=>{if(!modal){if(cool<=0){dash=.25;cool=1.5;immune=Math.max(immune,.35)}}};$('sound').onclick=()=>{mute=!mute;$('sound').textContent='音效 '+(mute?'關':'開');beep()};$('begin').onclick=start;$('home').onclick=()=>{if(!playing||confirm('確定返回首頁？本局進度將清除。'))home()};requestAnimationFrame(loop);
