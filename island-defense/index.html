L400 163M670 207L461 143"/></g></svg><div class="arcade-number">ARCADE 13</div></div><div class="arcade-copy"><h1>數學島嶼保衛戰</h1><p class="arcade-en">MATH ISLAND DEFENSE</p><p>守護五座魔幻島嶼，解題補彈，破解魔王護盾！</p><div class="arcade-tags"><span>五座島嶼</span><span>蓄力砲擊</span><span>八種數學單元</span><span>三階段挑戰</span></div><button id="enter" type="button" class="arcade-enter">進入遊戲設定 ▶</button></div></section><section id="home" class="hide"><h1>選擇守城任務</h1><label>單元 <select id="unit"><option value="0">指數律</option><option value="1">分數四則</option><option value="2">一元一次式</option><option value="3">一元一次方程式</option><option value="4">最大公因數與最小公倍數</option><option value="5">正負數四則</option><option value="6">因數倍數質數</option><option value="7">混合複習</option></select></label> <label>難度 <select id="difficulty"><option value="0">基礎</option><option value="1" selected>普通</option><option value="2">挑戰</option></select></label><h2>五大島嶼</h2><div class="grid" id="islands"></div><p>方向鍵或觸控移動砲手；空白鍵射擊。點選答案瞄準，再按射擊命中答案補彈；也可切換直接作答。長按射擊850毫秒可發射蓄力砲；砲台持續自動防守。三階段魔王，最後連續答對五題破盾。</p><button id="start">開始守城 ▶</button></section><section id="game" class="hide"><div class="hud"><span id="hp"></span><span id="ammo"></span><span id="wave"></span><span id="clock"></span><span id="gold"></span></div><div id="question" class="question"></div><canvas id="canvas" width="960" height="440"></canvas><div class="grid answers" id="answers"></div><div style="text-align:center;margin:5px"><button id="aimMode">模式：瞄準射擊</button> <button id="battleAim">轉向敵軍</button> <span id="aimHint" aria-live="polite">點選答案瞄準，再按射擊</span></div><div class="controls"><button id="left">◀</button><button id="fire">射擊 / 蓄力</button><button id="right">▶</button><button id="upgrade">升級砲台</button><button id="music">音效</button><button id="quit">返回</button></div><div id="notice"></div></section></main><div id="modal" class="overlay hide"><div class="panel"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="reward" class="grid"></div></div></div><script>const $=id=>document.getE
