function ask(n,isUrgent=false){if(answering)return;activeNode=n;urgent=isUrgent;for(let i=0;i<80;i++){question=qgen();if(!seen.has(question.p))break}seen.add(question.p);answering=true;deadline=elapsed+(urgent?10:$('level').selectedIndex?25:35);$('prompt').textContent=question.p.replace(/\^(\d+|□)/g,(_,n)=>[...n].map(x=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+x]||'□').join(''));$('answers').innerHTML='';question.opts.forEach((a,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'　'+a;b.onclick=()=>answer(i);$('answers').append(b)});news(urgent?'魔王蓄力！10秒內破解':'機關啟動，解開數學封印')}

function answer(i){if(!answering||state!=='run')return;let good=question.opts[i]===question.v;total++;answering=false;document.querySelectorAll('#answers button').forEach(b=>b.disabled=true);if(good){correct++;streak++;if(urgent){if(boss)boss.h-=boss.max*.28;freezeUntil=elapsed+3;news('破解成功！魔王必殺反彈');effects.push({x:p.x,y:p.y,r:350,t:elapsed,k:2})}else if(activeNode&&!activeNode.done){activeNode.done=true;solved++;summon();if(stage===2)shieldUntil=elapsed+5}if(solved>=needed&&stage===3&&boss)boss.h-=boss.max*.12;updateTask()}else{streak=0;if(urgent)takeDamage(25,'魔王必殺破解失敗');else {retryAt=elapsed+2.5;news('正確答案：'+question.v+'，稍後可重新挑戰機關');}tone(120,.3,'sawtooth')}urgent=false;activeNode=null;$('combo').textContent='連擊 '+streak+'｜答對 '+correct;$('status').textContent=good?'封印解除／召喚成功':'正確答案 '+question.v}

function tick(dt){elapsed+=dt;stageTime+=dt;let dx=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0),dy=(keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0),l=Math.hypot(dx,dy)||1,s=elapsed-dashAt<.35?450:210;p.x=Math.max(42,Math.min(918,p.x+dx/l*s*dt));p.y=Math.max(92,Math.min(460,p.y+dy/l*s*dt));if(stage===4&&stageTime>60){lastCause='最終60秒逃生倒數結束';end(false);return}if(!answering&&elapsed>=retryAt){let n=nodes.find(n=>!n.done&&Math.hypot(p.x-n.x,p.y-n.y)<72);if(n){keys.clear();ask(n)}}if(answering&&elapsed>=deadline)answer(-1);if(state!=='run')return;if(stage===3&&boss&&boss.h>0&&solved>=1&&!castDone&&!answering&&stageTime>8){castDone=true;ask(null,true)}if(elapsed>=spawnAt&&enemies.length<12){spawnAt=elapsed+(quick?5:4);if(stage>0||solved>=needed)spawn()}if(elapsed>=attackAt){attackAt=elapsed+.65;let living=enemies.filter(e=>e.h>0).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));for(let e of living.slice(0,Math.max(1,levels[0]+levels[2]))){if(Math.hypot(e.x-p.x,e.y-p.y)<180+levels[2]*40){let d=12+levels[0]*7+levels[1]*5+levels[5]*9;if(e.boss&&stage===3&&solved<needed)d*=.15;e.h-=d;effects.push({x:e.x,y:e.y,r:35,t:elapsed,k:levels[2]?2:0});tone(200,.07,'triangle',.025)}}}for(let e of enemies){if(e.h<=0)continue;let x=p.x-e.x,y=p.y-e.y,d=Math.hypot(x,y)||1,m=e.speed*(elapsed<freezeUntil?0.1:answering?.3:1);e.x+=x/d*m*dt;e.y+=y/d*m*dt;if(d<(e.boss?55:34)&&elapsed-hurtAt>1.5&&!urgent)takeDamage(e.boss?20:8,e.boss?'魔王追擊':'怪物撞擊')}enemies=enemies.filter(e=>e.h>0);if(stage===2&&p.x<Math.min(250,stageTime*3)&&elapsed-hurtAt>2)takeDamage(8,'熔岩逼近');if(solved>=needed&&(stage!==3||!boss||boss.h<=0)&&!gemTaken&&Math.hypot(p.x-gem.x,p.y-gem.y)<55){gemTaken=true;gems++;exitOpen=true;news('取得封印寶石！出口開啟');tone(880,.4);updateTask()}if(exitOpen&&Math.hypot(p.x-890,p.y-270)<35)interact();if(state!=='run')return;effects=effects.filter(e=>elapsed-e.t<.5);if(elapsed>=musicAt){musicAt=elapsed+(stage>=3?.24:.34);let notes=[146,174,220,196,130,164,196,174];tone(notes[beat++%8],.28,'triangle',.04,true);if(beat%4===0)tone(55,.35,'sine',.08,true)}$('health').textContent='HP '+Math.ceil(hp);$('hpfill').style.width=hp+'%';$('hpfill').style.background=hp<30?'#ff6464':'#80d99e';$('clock').textContent=stage===4?'逃生 '+Math.max(0,Math.ceil(60-stageTime))+'秒':Math.floor(stageTime)+'秒';if(answering)$('status').textContent=(urgent?'魔王必殺破解':'機關解謎')+'・剩 '+Math.max(0,Math.ceil(deadline-elapsed))+' 秒';if(noticeUntil<elapsed)$('notice').textContent=exitOpen?'向右進入出口':'靠近發光符文，題目自動出現';$('interact').disabled=answering||!nodes.some(n=>!n.done&&Math.hypot(p.x-n.x,p.y-n.y)<100);$('dash').textContent=elapsed-dashAt>=4?'閃避':'閃避 '+Math.ceil(4-(elapsed-dashAt))+'秒';updateTask()}
function draw(){let c=ctx,theme=[['#292a3b','#454353','#6c6170'],['#3e302b','#695041','#9d7952'],['#35232b','#694034','#a85e38'],['#29243d','#49375a','#766189'],['#30212e','#64404a','#a45b55']][stage];c.fillStyle=theme[0];c.fillRect(0,0,960,540);function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}for(let y=70;y<480;y+=40)for(let x=15;x<950;x+=60){rect(x,y,58,38,theme[1]);rect(x+2,y+2,54,2,'#ffffff0d')}for(let x=0;x<960;x+=80){rect(x,40,77,52,theme[2]);rect(x,40,77,7,'#ffffff22');rect(x,465,77,45,theme[2]);rect(x,465,77,6,'#ffffff22')}for(let x=60;x<960;x+=180){rect(x,55,20,65,'#211e2a');rect(x+4,70,12,22,'#d98b43');rect(x+7,63,6,14,'#ffd986')}for(let i=0;i<10;i++){let x=(i*151+80)%910,y=120+(i*89)%310;rect(x,y,18,4,'#ffffff12')}for(let i=0;i<5;i++){let x=100+i*180;rect(x,88,35,25,'#100e1899');rect(x-4,40,43,60,theme[2]);rect(x+2,45,8,47,'#ffffff18');rect(x+31,47,5,50,'#00000044')}let glow=c.createRadialGradient(p.x,p.y,60,p.x,p.y,520);glow.addColorStop(0,'#00000000');glow.addColorStop(1,'#05030c85');c.fillStyle=glow;c.fillRect(0,0,960,540);if(stage===2){let edge=Math.min(250,stageTime*3);rect(0,90,edge,375,'#b73e24');for(let i=0;i<18;i++)rect((i*31+elapsed*25)%Math.max(1,edge),100+i*20,14,3,'#ffb34a')}function sprite(x,y,s,col,evil=false){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#0a0b17aa';c.beginPath();c.ellipse(0,8,19,6,0,0,7);c.fill();rect(-11,-13,22,22,'#202333');rect(-9,-12,18,17,col);rect(-7,-27,14,13,evil?'#a7856c':'#efc69a');rect(-10,-30,20,7,col);rect(-6,-21,4,3,'#252132');rect(3,-21,4,3,'#252132');rect(-11,7,7,8,'#373348');rect(4,7,7,8,'#373348');rect(12,-19,4,26,'#dbe4e7');if(evil){rect(-15,-35,6,15,'#bf7659');rect(9,-35,6,15,'#bf7659')}c.restore()}nodes.forEach(n=>{c.save();c.shadowColor=n.done?'#8fffd0':'#cda0ff';c.shadowBlur=18;rect(n.x-28,n.y-18,56,36,n.done?'#36584d':'#61477a');c.restore();if(!n.done){c.strokeStyle='#d8b7ff88';c.lineWidth=2;c.beginPath();c.ellipse(n.x,n.y,39+Math.sin(elapsed*4)*4,27,0,0,7);c.stroke();}c.strokeStyle=n.done?'#9ce9b5':'#d5a2ff';c.lineWidth=3;c.strokeRect(n.x-28,n.y-18,56,36);c.fillStyle='#fff1c0';c.font='bold 21px system-ui';c.textAlign='center';c.fillText(n.done?'✓':'?',n.x,n.y+7);c.textAlign='left'});c.save();c.translate(890,270);c.strokeStyle=exitOpen?'#a6f7cf':'#775966';c.lineWidth=9;c.beginPath();c.ellipse(0,0,28,65,0,0,7);c.stroke();c.fillStyle=exitOpen?'#8be6b755':'#1c182a';c.fill();c.restore();if(solved>=needed&&!gemTaken&&(stage!==3||!boss||boss.h<=0)){c.fillStyle='#ffe188';c.beginPath();c.moveTo(gem.x,gem.y-25);c.lineTo(gem.x+20,gem.y);c.lineTo(gem.x,gem.y+25);c.lineTo(gem.x-20,gem.y);c.fill()}for(let e of enemies){sprite(e.x,e.y,e.boss?3.5:1.65,e.boss?'#b64d55':'#929464',true);rect(e.x-24,e.y-(e.boss?118:56),48,5,'#3b2432');rect(e.x-24,e.y-(e.boss?118:56),48*Math.max(0,e.h/e.max),5,'#ff816f')}sprite(p.x,p.y,2.45,elapsed-hurtAt<.2?'#ff7d7d':'#82ccdb');if(elapsed<shieldUntil||elapsed-dashAt<.55){c.strokeStyle='#a2f0b4';c.lineWidth=4;c.beginPath();c.arc(p.x,p.y,42,0,7);c.stroke()}for(let e of effects){c.strokeStyle=colors[e.k];c.globalAlpha=Math.max(0,1-(elapsed-e.t)/.5);c.lineWidth=5;c.beginPath();c.arc(e.x,e.y,e.r*(1+(elapsed-e.t)),0,7);c.stroke();c.globalAlpha=1}if(urgent){c.fillStyle='#ac25352e';c.fillRect(0,0,960,540);c.fillStyle='#fff0c0';c.font='bold 38px system-ui';c.fillText('魔王蓄力 '+Math.max(0,Math.ceil(deadline-elapsed))+'秒',300,135)}if(elapsed-hurtAt<.25){c.strokeStyle='#ff6868';c.lineWidth=12;c.strokeRect(0,0,960,540)}}
function frame(t){let dt=Math.min(.05,(t-(last||t))/1000);last=t;try{if(state==='run'&&!document.hidden)tick(dt);draw()}catch(e){state='error';$('notice').textContent='遊戲執行異常，請重新整理：'+e.message;console.error(e);return}requestAnimationFrame(frame)}
$('start').onclick=()=>{try{ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}quick=$('mode').value==='quick';state='run';$('cover').classList.add('hidden');startStage();drawSlots()};$('sound').onclick=()=>{$('audio').hidden=!$('audio').hidden};$('close').onclick=()=>{$('audio').hidden=true};$('dash').onclick=dodge;$('interact').onclick=interact;document.addEventListener('keydown',e=>{if(state!=='run'||['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key.startsWith('Arrow')||e.code==='Space')e.preventDefault();keys.add(e.key);if(e.code==='Space'&&!e.repeat)dodge();if(e.key.toLowerCase()==='e'&&!e.repeat)interact();if(['1','2','3','4'].includes(e.key)&&!e.repeat)answer(+e.key-1)});document.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});drawSlots();requestAnimationFrame(frame);
