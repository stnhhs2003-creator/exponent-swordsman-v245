'use strict';const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');const PI=Math.PI,TAU=PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);let W=1,H=1,scale=1,originX=0,originY=0;let arena=8.6,arenaX=8.6,arenaZ=8.6,groundX=10,groundZ=10,tilt=.59,actorScale=1;
// Independent curriculum adapters. All answers are generated algebraically, not parsed from display text.
const units={equation:{label:'一元一次方程式',make(level){let x=rnd(-9,12),a=rnd(2,8),b=rnd(1,12),c=rnd(1,7);if(level===0)return{text:`x + ${b} = ${x+b}`,answer:x,why:`兩邊同減 ${b}，x = ${x}`};if(level===1)return{text:`${a}x − ${b} = ${a*x-b}`,answer:x,why:`兩邊同加 ${b}，得 ${a}x = ${a*x}，再除以 ${a}，x = ${x}`};if(level===2)return{text:`${a}(x + ${b}) = ${a*(x+b)}`,answer:x,why:`兩邊除以 ${a} 再減 ${b}，x = ${x}`};return{text:`${a+c}x + ${b} = ${a}x ${c*x+b<0?'−':'+'} ${Math.abs(c*x+b)}`,answer:x,why:`兩邊減 ${a}x 和 ${b}，得 ${c}x = ${c*x}，所以 x = ${x}`}}}};Object.assign(units,{exp:{label:'指數律',make(l){let a=rnd(2,6),m=rnd(1,5),n=rnd(1,5);if(l<2)return{text:`${a}^${m} × ${a}^${n} = ${a}^?`,answer:m+n,why:`同底數相乘，指數相加 ${m}+${n}=${m+n}`};if(l===2)return{text:`(${a}^${m})^${n} = ${a}^?`,answer:m*n,why:`次方的次方，指數相乘 ${m}×${n}=${m*n}`};return{text:`${a}^${m+n} ÷ ${a}^${n} = ${a}^?`,answer:m,why:`同底數相除，指數相減 ${m+n}−${n}=${m}`}}},fraction:{label:'分數四則',make(l){let d=rnd(2,9),n=rnd(1,8),k=rnd(2,5);if(l<2)return{text:`${n*d-k}/${d} + ${k}/${d} = ?`,answer:n,why:`同分母相加得 ${n*d}/${d}=${n}`};if(l===2)return{text:`${n*d}/${k} × ${k}/${d} = ?`,answer:n,why:`約分後等於 ${n}`};return{text:`${n*k}/${d} ÷ ${k}/${d} = ?`,answer:n,why:`乘以倒數並約分得 ${n}`}}},algebra:{label:'一元一次式',make(l){let a=rnd(2,9),b=rnd(1,8),c=rnd(1,6),v=rnd(-4,5);if(l<2)return{text:`${a}x + ${b}x = ?x`,answer:a+b,why:`同類項係數相加 ${a}+${b}=${a+b}`};if(l===2)return{text:`${a}(x + ${b}) − ${c}x = ?x + ${a*b}`,answer:a-c,why:`分配律後 x 的係數為 ${a}−${c}=${a-c}`};return{text:`${a}x + ${b}，當 x = ${v} 時為？`,answer:a*v+b,why:`代入 ${a}×(${v})+${b}=${a*v+b}`}}},gcd:{label:'最大公因數與最小公倍數',make(l){let a=rnd(2,18),b=rnd(2,18),g=(x,y)=>y?g(y,x%y):x,d=g(a,b),lc=a*b/d;return l%2?{text:`${a}、${b} 的最小公倍數 = ?`,answer:lc,why:`兩數相乘除以最大公因數 ${d}，得 ${lc}`}:{text:`${a}、${b} 的最大公因數 = ?`,answer:d,why:`共同因數中的最大者為 ${d}`}}},signed:{label:'正負數四則運算',make(l){let a=rnd(-12,12),b=rnd(-8,8)||2,c=rnd(-5,5);if(l===0)return{text:`(${a}) + (${b}) = ?`,answer:a+b,why:`正負數加法得 ${a+b}`};if(l===1)return{text:`(${a}) − (${b}) = ?`,answer:a-b,why:`減去一個數等於加其相反數，得 ${a-b}`};if(l===2)return{text:`(${a}) × (${b}) = ?`,answer:a*b,why:`先確認正負號，再相乘得 ${a*b}`};return{text:`(${a*b}) ÷ (${b}) + (${c}) = ?`,answer:a+c,why:`先除後加，得 ${a}+(${c})=${a+c}`}}}});let selectedUnit='equation',question,used=new Set(),state='menu',phase='wave',kills=0,bossHits=0,energy=0,hp=3,remaining=600,player={x:0,z:3.5,dir:0,walk:0,inv:0,dash:0},mobs=[],effects=[],warnings=[],nextThreat=2,nextQuestion=0,noticeUntil=0,elapsed=0,answered=0,wrong=0,guard=0,score=0;const stages=['魔法森林','水晶洞窟','古代遺跡','黑暗神殿','魔王聖殿'];let stageIndex=0,stageHits=0,preview=false,tutorial=0,tutorialOrigin=null;const held=new Set();function tutorialStep(n){tutorial=n;const h=$("tutorialHint");h.hidden=!n;h.textContent=({1:"① 按方向鍵移動角色",2:"② 計算上方題目，點選右下正確答案",3:"③ 答對後自動施放魔法劍",4:"④ 紅圈：即將受傷的區域！按閃避或移動離開"})[n]||"";if(n===4){warnings=[{x:player.x,z:player.z,r:2.1,t:5,done:false}];player.dash=0}if(n===0){warnings=[];$("tutorialHint").hidden=true}}let audio,music,sfx,nextNote=0,noteIndex=0;function audioStart(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();music=audio.createGain();sfx=audio.createGain();let comp=audio.createDynamicsCompressor();music.connect(comp);sfx.connect(comp);comp.connect(audio.destination)}audio.resume().catch(()=>{});volume()}catch{}}function volume(){if(!audio)return;music.gain.setTargetAtTime(+$('musicVol').value/100*.20,audio.currentTime,.05);sfx.gain.setTargetAtTime(+$('sfxVol').value/100*.28,audio.currentTime,.05)}function tone(hz,time,dur,bus,type='sine',amp=.5){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=hz;g.gain.setValueAtTime(.001,time);g.gain.exponentialRampToValueAtTime(amp,time+.024);g.gain.exponentialRampToValueAtTime(.001,time+dur);o.connect(g);g.connect(bus);o.start(time);o.stop(time+dur+.02)}function sound(n){if(audio)tone(n,audio.currentTime,.23,sfx,'triangle',.65)}function musicTick(){if(!audio||audio.state!=='running'||state!==
