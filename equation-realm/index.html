<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091325;color:#fff;font-family:system-ui,sans-serif}button,select,input{font:inherit}button,select{color:#fff;background:#253b55;border:1px solid #7ca6c3;border-radius:12px;padding:10px;cursor:pointer}button:active{filter:brightness(1.5)}button:focus-visible{outline:3px solid #fbe293}button:disabled{opacity:.48}#app{height:100dvh;display:flex;flex-direction:column;max-width:1800px;margin:auto}header{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 14px;background:#101e31;border-bottom:1px solid #49657e;font-size:clamp(12px,1.5vw,19px)}header strong{color:#ffd98a}#hud{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#hud span{white-space:nowrap}#question{flex:none;background:linear-gradient(120deg,#182d48,#382b50);border-bottom:2px solid #b79459;padding:6px 12px;text-align:center}#questionText{font-size:clamp(23px,4.1vw,54px);font-weight:850;line-height:1.15;color:#fff6dc}#answers{display:flex;justify-content:center;gap:7px;padding-top:5px}#answers button{min-width:72px;width:min(19vw,200px);font-size:clamp(17px,2.7vw,36px);font-weight:800;padding:5px 8px;background:#152e48}#answers small{font-size:.45em;color:#bcd2e3;margin-right:5px}#stage{flex:1;min-height:0;position:relative;background:#0d172a;overflow:hidden}canvas{width:100%;height:100%;display:block}#message{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:94%;text-align:center;padding:6px 18px;border-radius:8px;background:#0c1834da;color:#ffe6a8;font-weight:750;pointer-events:none}#bossbar{position:absolute;top:48px;left:50%;transform:translateX(-50%);width:min(65%,440px);height:12px;border:1px solid #f1d7a0;border-radius:10px;background:#341b35;overflow:hidden;display:none}#bossfill{height:100%;background:linear-gradient(90deg,#ed5b77,#ffbd65);width:100%}#controls{flex:none;display:flex;justify-content:center;align-items:center;gap:clamp(16px,4vw,65px);p </style></head><body><div id="app"><header><strong>14 · 方程秘境</strong><div id="hud"><span id="life">♥♥♥</span><span id="energy">✦ 0</span><span id="progress">小怪 0/6</span><span id="clock">10:00</span></div><button id="sound" aria-label="音量設定">♫</button><button id="pause">暫停</button></header><div id="question"><div id="questionText">解開符文，掌握魔法</div><div id="answers"></div></div><div id="stage"><canvas id="view" aria-label="3D 魔法遺跡戰場"></canvas><div id="message">準備挑戰</div><div id="bossbar"><div id="bossfill"></div></div><div id="settings" hidden><label>配樂 <input id="musicVol" type="range" min="0" max="100" value="22"></label><label>音效 <input id="sfxVol" type="range" min="0" max="100" value="55"></label><button id="closeSound">關閉</button></div></div><div id="controls"><div id="dirs"><button id="up" data-dir="up" aria-label="向上">↑</button><button id="left" data-dir="left" aria-label="向左">←</button><button id="down" data-dir="down" aria-label="向下">↓</button><button id="right" data-dir="right" aria-label="向右">→</button></div><div id="actions"><button id="dash">閃避<small>X / Shift</small></button><button id="cast">魔法<small>Z / 空白鍵</small></button></div></div></div><div id="overlay"><div class="panel" id="panel"></div></div>
<script>
'use strict';const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');const PI=Math.PI,TAU=PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);let W=1,H=1,scale=1,originX=0,originY=0;const arena=8.6;
// Independent curriculum adapters. All answers are generated algebraically, not parsed from display text.
const units={equation:{label:'一元一次方程式',make(level){let x=rnd(-9,12),a=rnd(2,8),b=rnd(1,12),c=rnd(1,7);if(level===0)return{text:`x + ${b} = ${x+b}`,answer:x,why:`兩邊同減 ${b}，x = ${x}`};if(level===1)return{text:`${a}x − ${b} = ${a*x-b}`,answer:x,why:`兩邊同加 ${b}，得 ${a}x = ${a*x}，再除以 ${a}，x = ${x}`};if(level===2)return{text:`${a}(x + ${b}) = ${a*(x+b)}`,answer:x,why:`兩邊除以 ${a} 再減 ${b}，x = ${x}`};return{text:`${a+c}x + ${b} = ${a}x ${c*x+b<0?'−':'+'} ${Math.abs(c*x+b)}`,answer:x,why:`兩邊減 ${a}x 和 ${b}，得 ${c}x = ${c*x}，所以 x = ${x}`}}}};let selectedUnit='equation',question,used=new Set(),state='menu',phase='wave',kills=0,bossHits=0,energy=0,hp=3,remaining=600,player={x:0,z:3.5,dir:0,walk:0,inv:0,dash:0},mobs=[],effects=[],warnings=[],nextThreat=2,nextQuestion=0,noticeUntil=0,elapsed=0,answered=0,wrong=0,guard=0,score=0;const held=new Set();let audio,music,sfx,nextNote=0,noteIndex=0;function audioStart(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();music=audio.createGain();sfx=audio.createGain();let comp=audio.createDynamicsCompressor();music.connect(comp);sfx.connect(comp);comp.connect(audio.destination)}audio.resume().catch(()=>{});volume()}catch{}}function volume(){if(!audio)return;music.gain.setTargetAtTime(+$('musicVol').value/100*.20,audio.currentTime,.05);sfx.gain.setTargetAtTime(+$('sfxVol').value/100*.28,audio.currentTime,.05)}function tone(hz,time,dur,bus,type='sine',amp=.5){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=hz;g.gain.setValueAtTime(.001,time);g.gain.exponentialRampToValueAtTime(amp,time+.024);g.gain.exponentialRampToValueAtTime(.001,time+dur);o.connect(g);g.connect(bus);o.start(time);o.stop(time+dur+.02)}function sound(n){if(audio)tone(n,audio.currentTime,.23,sfx,'triangle',.65)}function musicTick(){if(!audio||audio.state!=='running'||state!=='play')return;let t=audio.currentTime;if(nextNote<t)nextNote=t+.05;const notes=[196,261.63,329.63,293.66,196,246.94,293.66,329.63];while(nextNote<t+.15){let n=notes[noteIndex++%notes.length];tone(n,nextNote,.65,music,'sine',.3);tone(n/2,nextNote,.65,music,'triangle',.13);nextNote+=phase==='boss'?.37:.53}}
function say(s,secs=2){$('message').textContent=s;noticeUntil=elapsed+secs}function newQuestion(){let level=phase==='boss'?Math.min(3,1+Math.floor(bossHits/2)):Math.min(2,Math.floor(kills/2));let q;for(let i=0;i<50;i++){q=units[selectedUnit].make(level);if(!used.has(q.text))break}used.add(q.text);let a=[q.answer];while(a.length<4){let d=rnd(-7,7);if(d&&!a.includes(q.answer+d))a.push(q.answer+d)}for(let i=3;i>0;i--){let j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}question={...q,options:a,locked:false};$('questionText').textContent=q.text+'　x = ?';$('answers').replaceChildren(...a.map((v,i)=>{let b=document.createElement('button');b.innerHTML='<small>'+ (i+1)+'</small>'+v;b.onclick=()=>answer(i);return b}));}
function answer(i){if(state!=='play'||!question||question.locked)return;question.locked=true;let buttons=[...$('answers').children];buttons.forEach(b=>b.disabled=true);if(question.options[i]===question.answer){answered++;score+=100;energy=Math.min(3,energy+1);buttons[i].style.background='#23765f';sound(740);say('答對！獲得魔法能量 ✦',1.6);nextQuestion=elapsed+1.05}else{wrong++;buttons[i].style.background='#96354f';buttons[question.options.indexOf(question.answer)].style.background='#23765f';sound(160);say('訂正：'+question.why,3.1);guard=3;nextQuestion=elapsed+3.3}updateHud()}
function spawn(){mobs=Array.from({length:6},(_,i)=>{let a=TAU*i/6;return{x:Math.sin(a)*6,z:Math.cos(a)*6,kind:i%2,h:1,walk:i,cd:1+i*.6}})}function updateHud(){$('life').textContent='♥'.repeat(hp)+'♡'.repeat(3-hp);$('energy').textContent='✦ '+energy;$('progress').textContent=phase==='wave'?'小怪 '+kills+'/6':'Boss '+bossHits+'/5';$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(Math.floor(remaining%60)).padStart(2,'0');$('cast').disabled=energy===0||state!=='play';$('bossbar').style.display=phase==='boss'?'block':'none';$('bossfill').style.width=(100-bossHits*20)+'%'}function start(){audioStart();state='play';$('overlay').hidden=true;held.clear();phase='wave';kills=bossHits=energy=answered=wrong=score=0;hp=3;remaining=600;elapsed=0;guard=0;nextThreat=2.5;nextQuestion=0;player={x:0,z:3.5,dir:0,walk:0,inv:2,dash:0};effects=[];warnings=[];used.clear();spawn();newQuestion();say('小組解題・代表操作；答對後消耗能量施法',4);updateHud()}function finish(win){state='end';held.clear();showPanel(win?'全員勝利！':'秘境挑戰結束',`答對 ${answered} 題・答錯 ${wrong} 題・分數 ${score}・小怪 ${kills}/6・Boss ${bossHits}/5`,true);sound(win?1046:130)}function showPanel(title,desc,again=false){$('overlay').hidden=false;$('panel').innerHTML='<div class="brand">HSIN HSIEN · MATH ADVENTURE / 14</div><h1>'+title+'</h1><p>'+desc+'</p><label>課程單元 <select id="unitSelect"><option value="equation">七年級｜一元一次方程式</option></select></label><p>方向鍵移動｜1–4 選答案｜Z 施法｜X 閃避<br>一人操作，組員解題。先完成六隻小怪，再破解五次 Boss 符文。</p><button class="primary" id="start">'+(again?'再挑戰':'進入方程秘境')+'</button><p style="font-size:12px">V1.0 原型｜原創低多邊形 3D 幾何美術・無需外部素材下載</p>';$('start').onclick=()=>{selectedUnit=$('unitSelect').value;start()}}function pause(){if(state==='play'){state='pause';held.clear();$('overlay').hidden=false;$('panel').innerHTML='<h1>遊戲暫停</h1><p>老師可利用此時講解方程式。</p><button class="primary" id="resume">繼續挑戰</button> <button id="restart">重新開始</button>';$('resume').onclick=()=>{state='play';$('overlay').hidden=true;audioStart();updateHud()};$('restart').onclick=start}else if(state==='pause')$('resume').click()}
function cast(){if(state!=='play'||energy<=0)return;let target=mobs.filter(m=>m.h>0).sort((a,b)=>dist(a,player)-dist(b,player))[0];if(!target)return;if(dist(target,player)>7.8){say('靠近怪物再施法，能量未消耗');return}energy--;player.dir=Math.atan2(target.x-player.x,target.z-player.z);effects.push({x:target.x,z:target.z,t:.75,type:'magic'},{x:player.x,z:player.z,t:.45,type:'magic'});sound(430);if(phase==='wave'){target.h=0;kills++;score+=50;if(kills===6){phase='boss';mobs=[{x:0,z:-4,kind:2,h:1,walk:0,cd:2}];warnings=[];guard=2;energy=0;nextQuestion=0;newQuestion();say('符文魔像甦醒！答題累積能量，破解五層護盾',4);sound(90)}}else{bossHits++;score+=150;if(bossHits>=5){target.h=0;finish(true)}else say(bossHits>=3?'魔像進入狂暴階段！':'護盾破解 '+bossHits+'/5',2)}updateHud()}
function dash(){if(state==='play'&&player.dash<=0){player.dash=2;player.inv=Math.max(player.inv,.75);player.x=clamp(player.x+Math.sin(player.dir)*2.4,-arena,arena);player.z=clamp(player.z+Math.cos(player.dir)*2.4,-arena,arena);effects.push({x:player.x,z:player.z,t:.5,type:'dash'});sound(290)}}function damage(){if(player.inv>0||guard>0)return;hp--;player.inv=2.2;energy=Math.max(0,energy-1);effects.push({x:player.x,z:player.z,t:.6,type:'hurt'});say('受到魔法衝擊！能量減少，注意閃避',2);sound(110);if(hp===0)finish(false);updateHud()}
const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};addEventListener('keydown',e=>{if(keyMap[e.key]){e.preventDefault();if(state==='play')held.add(keyMap[e.key]);return}if(e.repeat)return;if(['1','2','3','4'].includes(e.key))answer(+e.key-1);if(['z','Z',' '].includes(e.key)){e.preventDefault();cast()}if(['x','X','Shift'].includes(e.key))dash();if(e.key==='Escape')pause()});addEventListener('keyup',e=>{if(keyMap[e.key])held.delete(keyMap[e.key])});for(let b of document.querySelectorAll('[data-dir]')){let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(d)});for(let type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>held.delete(d))}addEventListener('blur',()=>held.clear());document.addEventListener('visibilitychange',()=>{held.clear();if(document.hidden&&state==='play')pause()});addEventListener('orientationchange',()=>held.clear());$('cast').onclick=cast;$('dash').onclick=dash;$('pause').onclick=pause;$('sound').onclick=()=>{$('settings').hidden=!$('settings').hidden};$('closeSound').onclick=()=>{$('settings').hidden=true};$('musicVol').oninput=$('sfxVol').oninput=volume;
function update(dt){if(state!=='play')return;elapsed+=dt;remaining=Math.max(0,remaining-dt);if(remaining<=0){finish(false);return}player.inv=Math.max(0,player.inv-dt);player.dash=Math.max(0,player.dash-dt);guard=Math.max(0,guard-dt);$('dash').disabled=player.dash>0;$('dash').firstChild.nodeValue=player.dash>0?'冷卻 '+player.dash.toFixed(1):'閃避';let mx=(held.has('right')?1:0)-(held.has('left')?1:0),mz=(held.has('down')?1:0)-(held.has('up')?1:0);let len=Math.hypot(mx,mz);if(len){mx/=len;mz/=len;player.x=clamp(player.x+mx*4.7*dt,-arena,arena);player.z=clamp(player.z+mz*4.7*dt,-arena,arena);player.dir=Math.atan2(mx,mz);player.walk+=dt*10}if(nextQuestion&&elapsed>=nextQuestion){nextQuestion=0;newQuestion()}for(let m of mobs){if(!m.h)continue;let d=dist(m,player);if(m.kind!==2&&d>2){m.x+=(player.x-m.x)/d*dt*.8;m.z+=(player.z-m.z)/d*dt*.8;m.walk+=dt*4}if(m.kind!==2&&d<1.25)damage()}if(elapsed>=nextThreat){nextThreat=elapsed+(phase==='boss'?(bossHits>=3?2.7:4.1):4.5);let target={x:clamp(player.x+rnd(-1,1),-arena,arena),z:clamp(player.z+rnd(-1,1),-arena,arena),r:phase==='boss'?2.2:1.5,t:1.35,done:false};warnings.push(target);if(phase==='boss'&&bossHits>=3)warnings.push({x:clamp(target.x+3,-arena,arena),z:clamp(target.z-2,-arena,arena),r:1.7,t:1.6,done:false})}for(let w of warnings){w.t-=dt;if(w.t<=0&&!w.done){w.done=true;effects.push({x:w.x,z:w.z,t:.6,type:'hurt'});if(dist(w,player)<w.r)damage()}}warnings=warnings.filter(w=>w.t>0);effects.forEach(e=>e.t-=dt);effects=effects.filter(e=>e.t>0);if(elapsed>noticeUntil)$('message').textContent=energy?'有能量！靠近敵人施放魔法':'等待組員解題，同時閃避紅色警示圈';musicTick();updateHud()}
// True 3-dimensional vertices projected onto a fixed elevated camera. Polygon depth sorting makes lightweight offline 3D possible without third-party libraries.
function resize(){let r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);let d=Math.min(2,devicePixelRatio||1);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(W/20.5,H/13.7);originX=W/2;originY=H*.53}new ResizeObserver(resize).observe(canvas);resize();function project(x,y,z){return[originX+x*scale,originY+(z*.59-y*.81)*scale,z*.81+y*.59]}let faces=[];function poly(vertices,color,stroke=null){let p=vertices.map(v=>project(...v));faces.push({p,color,stroke,depth:p.reduce((s,v)=>s+v[2],0)/p.length})}function shade(hex,f){let n=parseInt(hex.slice(1),16);return '#'+[n>>16&255,n>>8&255,n&255].map(v=>Math.floor(clamp(v*f,0,255)).toString(16).padStart(2,'0')).join('')}function box(x,y,z,w,h,d,color,rot=0){let c=Math.cos(rot),s=Math.sin(rot);let pts=[[-w/2,0,-d/2],[w/2,0,-d/2],[w/2,0,d/2],[-w/2,0,d/2],[-w/2,h,-d/2],[w/2,h,-d/2],[w/2,h,d/2],[-w/2,h,d/2]].map(([a,b,k])=>[x+a*c-k*s,y+b,z+a*s+k*c]);[[[0,1,5,4],.67],[[1,2,6,5],.78],[[2,3,7,6],.98],[[3,0,4,7],.87],[[4,5,6,7],1.16]].forEach(([ix,f])=>poly(ix.map(i=>pts[i]),shade(color,f)))}function crystal(x,y,z,r,h,color,n=6){let ring=Array.from({length:n},(_,i)=>[x+Math.sin(i*TAU/n)*r,y+h*.38,z+Math.cos(i*TAU/n)*r]);for(let i=0;i<n;i++){let a=ring[i],b=ring[(i+1)%n];poly([a,b,[x,y+h,z]],shade(color,.74+i/n*.5));poly([[x,y,z],b,a],shade(color,.5+i/n*.5))}}function sphere(x,y,z,rx,ry,rz,color,n=9){let a=[];for(let j=0;j<=6;j++){let lat=-PI/2+j*PI/6;a.push(Array.from({length:n},(_,i)=>[x+Math.cos(lat)*Math.cos(i*TAU/n)*rx,y+Math.sin(lat)*ry,z+Math.cos(lat)*Math.sin(i*TAU/n)*rz]))}for(let j=0;j<6;j++)for(let i=0;i<n;i++){let k=(i+1)%n;poly([a[j][i],a[j][k],a[j+1][k],a[j+1][i]],shade(color,.68+.32*Math.sin(j*PI/6)+.18*Math.sin(i*TAU/n)))} }
function circle(x,z,r,fill,stroke){let p=project(x,.025,z);ctx.beginPath();ctx.ellipse(p[0],p[1],r*scale,r*scale*.59,0,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function label(x,y,z,t,color='#fff'){let p=project(x,y,z);ctx.font='bold '+Math.max(13,scale*.36)+'px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#101728';ctx.strokeText(t,p[0],p[1]);ctx.fillStyle=color;ctx.fillText(t,p[0],p[1])}function hero(p){let swing=Math.sin(p.walk)*.13;box(p.x-.23,0,p.z+swing,.30,.46,.32,'#2c3b58');box(p.x+.23,0,p.z-swing,.30,.46,.32,'#2c3b58');box(p.x,.40,p.z,.8,.72,.52,'#4d77aa',p.dir);box(p.x,.45,p.z-.25,.96,.70,.14,'#553e92',p.dir);sphere(p.x,1.35,p.z,.35,.38,.32,'#e6bc94');crystal(p.x,1.54,p.z,.40,.57,'#7199cc');box(p.x-.52,.5,p.z,.22,.64,.28,'#e1c27e');box(p.x+.52,.48,p.z,.22,.64,.25,'#e1c27e');box(p.x+.77,.1,p.z,.085,1.73,.085,'#ae7951');crystal(p.x+.77,1.7,p.z,.22,.62,'#b4f2ff');}function monster(m){let bounce=Math.sin(m.walk)*.10;if(m.kind===0){sphere(m.x,.55+bounce,m.z,.67,.54,.61,'#57c8a6');box(m.x-.22,.69+bounce,m.z+.46,.13,.13,.08,'#26324e');box(m.x+.22,.69+bounce,m.z+.46,.13,.13,.08,'#26324e');crystal(m.x,.99+bounce,m.z,.19,.37,'#c8f0a9')}else {let s=m.kind===2?1.65:.75;for(let k of [-1,1]){box(m.x+k*.34*s,0,m.z,.5*s,.7*s,.55*s,'#77758e');box(m.x+k*.75*s,.7*s,m.z,.44*s,.95*s,.5*s,'#8b829f');}box(m.x,.62*s,m.z,1.12*s,1.03*s,.75*s,m.kind===2?'#705288':'#685f7e');box(m.x,1.6*s,m.z,.71*s,.64*s,.62*s,'#b2a0b1');box(m.x,1.84*s,m.z+.31*s,.49*s,.10*s,.06*s,'#ff9f89');crystal(m.x,1.8*s,m.z+.43*s,.28*s,.43*s,m.kind===2?'#f5ab83':'#a5e2ff')}}
function render(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#152c46');g.addColorStop(1,'#080f1e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<24;i++){let x=(i*137.51)%W,y=(i*41.3)%H;ctx.fillStyle='#a8cde522';ctx.beginPath();ctx.arc(x,y,1.5,0,TAU);ctx.fill()}let ground=[project(-10,0,-10),project(10,0,-10),project(10,0,10),project(-10,0,10)];ctx.beginPath();ground.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='#273a4e';ctx.fill();ctx.strokeStyle='#a5b5a4';ctx.lineWidth=3;ctx.stroke();for(let i=-9;i<=9;i+=2){for(let j=-9;j<=9;j+=2){let p=project(i,0,j);ctx.fillStyle=(i+j)%4?'#334a56':'#2c424f';ctx.fillRect(p[0]-scale*.95,p[1]-scale*.55,scale*1.9,scale*1.1)}}circle(0,0,6.9,null,'#7aaa9c80');circle(0,0,5.9,null,'#bca87677');circle(0,0,2.2,'#5b53982b','#b6acf0ac');for(let i=0;i<8;i++){let a=i*TAU/8;let p=project(Math.sin(a)*6.4,0,Math.cos(a)*6.4);ctx.fillStyle='#c6b582';ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(-a);ctx.fillRect(-scale*.09,-scale*.28,scale*.18,scale*.56);ctx.restore()}faces=[];for(let x of [-9,9])for(let z of [-8,-2,5]){circle(x,z,.65,'#020b1c55');box(x,0,z,1.1,.35,1.1,'#778d98');box(x,.35,z,.66,2.2,.66,'#465f76');box(x,2.45,z,.96,.27,.96,'#91a7ac');crystal(x,2.72,z,.35,.85,'#85c5b8')}for(let x of [-6,-3,0,3,6]){box(x,0,-9.5,2.8,.6,.7,'#536877');if(x!==0)box(x,.6,-9.5,2.25,.59,.7,'#40566c')}for(let x of [-7.5,7.5]){crystal(x,0,8.3,.54,1.4,'#a497dd');crystal(x+.5,0,8.1,.27,.72,'#6fb9bb')}for(let w of warnings){circle(w.x,w.z,w.r,'#ed55664b','#ff7c83');circle(w.x,w.z,w.r*(1-clamp(w.t/1.6,0,1)),null,'#ffc56e')}for(let e of effects){circle(e.x,e.z,(1-e.t/.8)*2.2+.2,e.type==='magic'?'#93dcff35':'#f09b6a30',e.type==='magic'?'#bff3ff':'#ffae88')}for(let m of mobs)if(m.h){circle(m.x,m.z,m.kind===2?1.6:.8,'#0007');monster(m)}circle(player.x,player.z,.65,'#0008',player.inv>0?'#85e6ff':null);hero(player);faces.sort((a,b)=>a.depth-b.depth);for(let f of faces){ctx.beginPath();f.p.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=f.color;ctx.fill()}if(state!=='menu'){label(player.x,2.44,player.z,'守護者','#cfedff');for(let m of mobs)if(m.h&&m.kind===2)label(m.x,4.1,m.z,'符文魔像','#ffe1a1')}for(let e of effects){let p=project(e.x,.75,e.z),r=scale*.9*(1-e.t/.9);ctx.strokeStyle=e.type==='magic'?'#c3f5ff':'#ffb088';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p[0],p[1],Math.max(2,r),0,TAU);ctx.stroke()}}
let last=performance.now();function frame(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);render();requestAnimationFrame(frame)}spawn();showPanel('方程秘境・3D 守護者','穿越符文遺跡，從數學中汲取魔法能量。');requestAnimationFrame(frame);
