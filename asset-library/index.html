<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學遊戲素材選擇中心</title><style>*{box-sizing:border-box}body{margin:0;background:#172238;color:#f5f7ff;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px}h1{color:#f9dba0}p{line-height:1.6;color:#c8d4e6}button,input,select,textarea{font:inherit;border:1px solid #7185a3;border-radius:9px;padding:10px}button{background:#344e71;color:white;cursor:pointer}button.active{background:#f2d69a;color:#172238}input,select,textarea{width:100%;background:#24334c;color:white}a{color:#a1dcff}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:#24334c;border:2px solid #4a5e7c;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.card.chosen{border-color:#f2d69a}.art{height:128px;display:grid;place-items:center;background:linear-gradient(145deg,#435a7e,#26334e);border-radius:10px;font-size:48px}.art img{width:100%;height:128px;object-fit:contain}.card h3{margin:0;font-size:16px}.card button{margin-top:auto}small{color:#cbd6e8}audio{width:100%}label{display:block;margin:12px 0 5px}section{margin:24px 0}textarea{min-height:120px}#status{color:#f9dba0}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:8px}.art,.art img{height:100px}}</style></head><body><main><a href="../game-center/">← 數學遊戲中心</a><h1>數學遊戲素材選擇中心</h1><p>十二款遊戲共用素材目錄。先選遊戲，再挑選素材。預設圖示代表設計類型，並非已取得的正式素材。可加入自己挑選的圖片或音訊網址。選擇只儲存在此瀏覽器，不會直接修改原遊戲。</p><a href="https://larch.ink/" target="_blank" rel="noopener noreferrer">開啟 Larch 挑選正式素材 ↗</a><label>遊戲</label><select id="game"></select><div class="bar" id="tabs"></div><div id="cards" class="grid"></div><section><h2>新增自訂素材</h2><label>名稱</label><input id="name"><label>類型</label><select id="type"></select><label>圖片／音訊網址（HTTPS）</label><input id="url" type="url" placeholder="https://..."><label>來源及授權備註</label><input id="license" placeholder="例如：Larch，授權待確認"><div class="bar"><button id="add">加入素材庫</button></div><small>未確認授權的素材不得直接發布至遊戲。</small></section><section><h2>本款遊戲已選素材</h2><div id="summary"></div><div class="bar"><button id="export">匯出配置 JSON</button><button id="clear">清除此款選擇</button></div><textarea id="output" readonly placeholder="匯出後可複製設定"></textarea><p id="status" role="status"></p></section></main><script>
const catalog={"主角":[["武俠劍士","⚔️"],["星羽弓手","🏹"],["烈橙探險家","🧭"],["銀霧術士","🔮"],["史萊姆","💧"],["潛水員","🤿"],["機甲戰士","🤖"],["飛行員","🧑‍✈️"]],"怪物／魔王":[["炎刃魔將","🔥"],["森林樹妖","🌳"],["深海鯊魚","🦈"],["章魚魔王","🐙"],["機甲魔王","🤖"],["水晶史萊姆","💎"]],"背景":[["武俠竹林","🎋"],["山水古城","🏯"],["魔法競技場","🏟️"],["糖果森林","🍄"],["夕光樂園","🎠"],["夢幻水晶星境","💎"],["深海遺跡","🪸"],["太空戰場","🌌"],["立體城市","🏙️"],["古堡迷宮","🏰"]],"配樂":[["史萊姆戰鬥（待確認授權）","🎵","https://pub-4b20b43f5acf4dfaa3f6ab842daa51cf.r2.dev/2d3b0242-9a6d-4051-9825-46aa4efd064a/larch/built-in-assets/packs/chibi-adventure/music/1793224614208_slime-battle.mp3"],["輕快冒險","🎼"],["武俠戰鬥","🥁"],["魔王緊張配樂","🎻"],["深海探索","🌊"],["勝利樂章","🏆"]],"音效":[["答對","✅"],["答錯","❌"],["命中","💥"],["跳躍","🦘"],["噗噗車喇叭","🚗"],["勝利","🎉"]],"特效":[["劍氣拖尾","⚔️"],["魔法粒子","✨"],["水晶爆破","💎"],["連擊閃光","⚡"],["勝利彩帶","🎊"],["傳送門","🌀"]]},games=['01 數學空戰','02 指數劍客','03 螺絲戰機','04 數學格鬥競技場','05 數學冒險大富翁','06 口袋工坊','07 式靈大冒險','08 古堡殘響 3D','09 深海方程式','10 數學城市大富翁','11 數學記憶戰','12 史萊姆大冒險'];const $=id=>document.getElementById(id);let saved={custom:[],picks:{}};try{saved=JSON.parse(localStorage.getItem('math-materials-v1'))||saved}catch(e){}let tab='主角';function store(){try{localStorage.setItem('math-materials-v1',JSON.stringify(saved))}catch(e){$('status').textContent='瀏覽器無法儲存，請匯出配置。'}}function el(tag,text){let a=document.createElement(tag);if(text!==undefined)a.textContent=text;return a}function items(){return Object.entries(catalog).flatMap(([type,arr])=>arr.map(([name,icon,url],i)=>({id:type+i,type,name,icon,url:url||'',license:'待確認／設計候選'}))).concat(saved.custom)}function selected(){return saved.picks[$('game').value]||[]}function render(){ $('tabs').replaceChildren();for(let type of Object.keys(catalog)){let b=el('button',type);b.className=tab===type?'active':'';b.onclick=()=>{tab=type;render()};$('tabs').append(b)}$('cards').replaceChildren();for(let a of items().filter(v=>v.type===tab)){let card=el('article');card.className='card'+(selected().includes(a.id)?' chosen':'');let art=el('div',a.icon||'🎨');art.className='art';if(a.url&&['主角','背景','怪物／魔王','特效'].includes(a.type)){let img=el('img');img.src=a.url;img.alt=a.name;img.loading='lazy';art.replaceChildren(img)}card.append(art,el('h3',a.name),el('small',a.license));if(a.url&&['配樂','音效'].includes(a.type)){let audio=el('audio');audio.controls=true;audio.preload='none';audio.src=a.url;card.append(audio)}let b=el('button',selected().includes(a.id)?'✓ 已選擇（取消）':'選擇素材');b.onclick=()=>{let p=selected();saved.picks[$('game').value]=p.includes(a.id)?p.filter(v=>v!==a.id):[...p,a.id];store();render()};card.append(b);$('cards').append(card)}$('summary').replaceChildren();let list=items().filter(a=>selected().includes(a.id));if(!list.length)$('summary').append(el('p','尚未挑選素材'));for(let a of list)$('summary').append(el('div',a.type+'｜'+a.name));}
for(let g of games)$('game').append(el('option',g));$('game').value=games[11];for(let t of Object.keys(catalog))$('type').append(el('option',t));$('game').onchange=render;$('add').onclick=()=>{let name=$('name').value.trim(),url=$('url').value.trim();if(!name||!url.startsWith('https://')){$('status').textContent='請輸入名稱及 HTTPS 網址';return}try{new URL(url)}catch(e){return}saved.custom.push({id:'custom-'+Date.now(),name,url,type:$('type').value,license:$('license').value.trim()||'待確認',icon:'🎨'});tab=$('type').value;store();render();$('name').value=$('url').value=$('license').value=''};$('clear').onclick=()=>{if(confirm('清除此遊戲的選擇？')){saved.picks[$('game').value]=[];store();render()}};$('export').onclick=()=>{let data=JSON.stringify({game:$('game').value,assets:items().filter(a=>selected().includes(a.id)),musicVolume:.35,sfxVolume:.9},null,2);$('output').value=data;let a=el('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='game-assets.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='配置已產生；未修改遊戲。'};render();
</script></body></html>
