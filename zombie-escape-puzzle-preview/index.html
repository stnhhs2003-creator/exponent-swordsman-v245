<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>殭屍末日：數學逃生 V0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#101a20;color:#eee;font:clamp(16px,2.2vw,26px) system-ui}main{max-width:1500px;margin:auto;padding:12px}header,footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;color:inherit;background:#23343d;border:1px solid #78909c;border-radius:10px;padding:12px;touch-action:manipulation}button:focus-visible{outline:3px solid gold}button:hover{background:#36515b}canvas{width:100%;height:auto;max-height:62dvh;object-fit:contain;background:#0a1014;display:block}#panel{padding:10px;background:#19292e;border-radius:8px}#controls{display:flex;justify-content:center;gap:8px;margin:8px}#controls button{min-width:55px}#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px}#modal[hidden]{display:none}article{background:#17272e;padding:24px;border:1px solid #78909c;border-radius:14px;max-width:580px;width:100%}small{color:#b9cbd0} @media(max-height:480px){canvas{max-height:48dvh}button,select,input{padding:6px}main{padding:4px}#panel{padding:4px}}</style><main><header><strong>殭屍末日：數學逃生</strong><small>V0.1 機關測試版</small><select id="unit"><option>正負數</option><option>整數四則</option><option>指數律</option><option>分數運算</option><option>一元一次式</option><option>一元一次方程式</option></select><select id="difficulty"><option>初階</option><option>進階</option></select><button id="start">開始／重玩</button></header><div id="panel" aria-live="polite">選擇單元後開始。方向鍵移動，E 互動，空白鍵射擊。</div><canvas id="game" width="960" height="480"></canvas><div id="controls"><button data-dir="left">◀</button><button data-dir="up">▲</button><button data-dir="down">▼</button><button data-dir="right">▶</button><button id="interact">互動 E</button><button id="shoot">射擊</button></div><footer><small>教室大屏：方向鍵／WASD 移動，E 互動，空白鍵射擊。手機使用下方按鍵。</small></footer></main><div id="modal" hidden><article><h2 id="mt"></h2><div id="msg"></div><form id="form"><input id="answer" inputmode="numeric" autocomplete="off" placeholder="輸入三位密碼" aria-label="密碼"><button>確認</button></form><button id="close" type="button">返回</button></article></div><script>
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d');let p={x:100,y:240},stage=0,found=[],questions=[],z=[],hp=100,ammo=6,active=false,keys=new Set(),last=0,elapsed=0,notice='',cool=0;const spots=[{x:230,y:100,n:'研究文件 A'},{x:450,y:350,n:'研究文件 B'},{x:650,y:105,n:'研究文件 C'}],door={x:845,y:240,n:'安全門密碼鎖'},power={x:710,y:365,n:'總電源'},exit={x:920,y:80,n:'撤離出口'};let ac;function tone(f){try{ac??=new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.06,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}}function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}function question(){let d=rand(2,9),a=rand(2,8),b=$('difficulty').selectedIndex?rand(4,9):2;switch($('unit').selectedIndex){case 0:return [(-a)+' + '+(a+d),d];case 1:return [b+' × '+a+' − '+(b*a-d),d];case 2:return ['2^'+(d+b)+' ÷ 2^'+b+' = 2^?',d];case 3:return [d*b+'/'+(b*10)+' = ?/10（等值分數）',d];case 4:return [b+'x − '+(b*a-d)+'，x = '+a,d];default:return [b+'x + '+a+' = '+(b*d+a),d]}}function start(){p={x:100,y:240};stage=0;found=[];questions=spots.map(question);z=[{x:740,y:180},{x:600,y:420},{x:870,y:420}];hp=100;ammo=6;elapsed=0;cool=0;notice='';active=true;keys.clear();$('modal').hidden=true;tone(400)}$('start').onclick=start;function target(){return stage===0?spots.find((s,i)=>!found.includes(i)):stage===1?door:stage===2?power:exit}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function show(t,m,form=false){$('mt').textContent=t;$('msg').textContent=m;$('form').hidden=!form;$('answer').value='';$('modal').hidden=false;keys.clear()}$('close').onclick=()=>{$('modal').hidden=true;keys.clear()};function interact(){if(!active||!$('modal').hidden)return;let t=target();if(dist(p,t)>85){notice='請靠近 '+t.n;return}if(stage===0){let i=spots.indexOf(t);found.push(i);show(t.n,'第 '+(i+1)+' 位密碼：'+questions[i][0]);tone(650);if(found.length===3)stage=1}else if(stage===1){show('安全門密碼鎖',questions.map((q,i)=>(i+1)+'. '+q[0]).join(' ｜ '),true)}else if(stage===2){stage=3;ammo+=3;z.push({x:850,y:300});notice='電力已恢復！前往撤離出口';tone(780)}else{active=false;show('撤離成功','完成全部機關！用時 '+Math.floor(elapsed)+' 秒，生命 '+Math.ceil(hp));tone(900)}}$('form').onsubmit=e=>{e.preventDefault();if($('answer').value.trim()===questions.map(q=>q[1]).join('')){stage=2;ammo+=3;$('modal').hidden=true;notice='密碼正確，前往總電源';tone(880)}else{$('msg').textContent='密碼錯誤，重新計算：'+questions.map(q=>q[0]).join(' ｜ ');tone(150)}};function shoot(){if(!active||!$('modal').hidden||ammo<=0)return;let near=z.slice().sort((a,b)=>dist(p,a)-dist(p,b))[0];ammo--;if(near&&dist(p,near)<260)z.splice(z.indexOf(near),1);tone(100)}$('interact').onclick=interact;$('shoot').onclick=shoot;let map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};addEventListener('keydown',e=>{if(!$('modal').hidden)return;if(map[e.key]){e.preventDefault();keys.add(map[e.key])}if(e.key==='e'&&!e.repeat)interact();if(e.code==='Space'&&!e.repeat){e.preventDefault();shoot()}});addEventListener('keyup',e=>keys.delete(map[e.key]));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.dir)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.dir)});function draw(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(active&&$('modal').hidden){elapsed+=dt;let x=Number(keys.has('right'))-Number(keys.has('left')),y=Number(keys.has('down'))-Number(keys.has('up'));p.x=Math.max(28,Math.min(932,p.x+x*dt*210));p.y=Math.max(28,Math.min(452,p.y+y*dt*210));if(stage>=1){for(let a of z){let d=dist(a,p);if(d>24){a.x+=(p.x-a.x)/d*dt*36;a.y+=(p.y-a.y)/d*dt*36}else hp-=dt*($('difficulty').selectedIndex?18:9)}}if(hp<=0){active=false;show('逃生失敗','重新開始挑戰。')}}g.fillStyle='#26373c';g.fillRect(0,0,960,480);for(let y=0;y<480;y+=60)for(let x=0;x<960;x+=80){g.fillStyle=(x/80+y/60)%2?'#27383c':'#2d4043';g.fillRect(x+1,y+1,78,58)}g.fillStyle='#131f25';g.fillRect(0,0,960,20);g.fillRect(0,460,960,20);g.fillRect(0,0,20,480);g.fillRect(940,0,20,480);function mark(t,color){g.fillStyle=color;g.fillRect(t.x-22,t.y-17,44,34);g.fillStyle='#fff';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText(t.n,t.x,t.y-28)}spots.forEach((s,i)=>mark(s,found.includes(i)?'#38614e':'#877044'));mark(door,stage>=2?'#39765d':'#84433b');mark(power,stage>=3?'#39765d':'#496174');mark(exit,'#376b78');let t=target();if(active&&t){g.strokeStyle='#ffe19a';g.lineWidth=3;g.setLineDash([8,8]);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(t.x,t.y);g.stroke();g.setLineDash([]);g.strokeRect(t.x-28,t.y-23,56,46)}function person(a,enemy){g.fillStyle='#0006';g.beginPath();g.ellipse(a.x+5,a.y+12,19,12,0,0,7);g.fill();g.fillStyle=enemy?'#6f8061':'#486e9b';g.fillRect(a.x-13,a.y-8,26,26);g.fillStyle=enemy?'#9da88b':'#d3b69a';g.beginPath();g.arc(a.x,a.y-14,10,0,7);g.fill()}z.forEach(a=>person(a,true));person(p,false);if(active&&t)$('panel').textContent='生命 '+Math.max(0,Math.ceil(hp))+' ｜ 彈藥 '+ammo+' ｜ 文件 '+found.length+'/3 ｜ 目標：'+t.n+'（'+Math.ceil(dist(p,t)/25)+' m）'+(notice?' ｜ '+notice:'');requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
