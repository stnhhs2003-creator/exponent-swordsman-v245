<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101c30"><title>數學幻境｜3D 遊戲總入口</title><style>
:root{color-scheme:dark;--bg:#101c30;--surface:#1a2c46;--edge:#4c6680;--gold:#ffdc98;--text:#f1f6ff;--muted:#bac9d9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#294968 0,#101c30 55%);color:var(--text);font:500 16px/1.55 system-ui,"Noto Sans TC",sans-serif}main{max-width:880px;margin:auto;padding:24px 16px 42px}header{text-align:center;margin-bottom:20px}h1{font-size:clamp(26px,6vw,38px);line-height:1.2;color:var(--gold);margin:12px 0}h2{font-size:18px;margin:0 0 10px}p{color:var(--muted);margin:7px 0 12px}.steps{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:19px 0}.steps span{font-size:12px;padding:6px 9px;border:1px solid #647d91;border-radius:30px;background:#162a41}.steps .now{background:#4f6681;color:#fff;border-color:#c2d9e6}.panel{background:#172b42ed;border:1px solid #617e99;border-radius:18px;padding:18px;margin-bottom:13px;box-shadow:0 8px 26px #060f1a45}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}button{font:700 16px system-ui,"Noto Sans TC",sans-serif;cursor:pointer}button.choice{padding:14px 10px;background:#213954;border:2px solid #58718c;color:#fff;border-radius:13px;min-height:76px;touch-action:manipulation}button.choice small{font-size:12px;color:#d1dfeb;font-weight:400;display:block;margin-top:5px}button.choice.selected{border-color:var(--gold);background:#375270;box-shadow:0 0 0 1px #ffdc9888}button.choice:disabled{opacity:.45;cursor:not-allowed}.step{display:flex;align-items:center;gap:9px}.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#d7b66f;color:#182331;font-weight:900}#summary{line-height:1.8;padding:12px;background:#0d1e33;border-radius:12px;margin:12px 0;color:#f7e5bc}#go{display:block;width:100%;min-height:58px;padding:12px;border:0;border-radius:13px;background:linear-gradient(#ffe7ab,#e3b362);color:#2b220e;font-size:21px;font-weight:900;touch-action:manipulation}#go:disabled{background:#49576a;color:#d5dde7}#message{font-size:14px;color:#e4d2a9;padding-top:7px;min-height:32px}.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid #7c9eab;color:#b8dede}.muted{color:var(--muted);font-size:13px}.links{margin-top:17px;display:flex;flex-wrap:wrap;gap:9px}.links a{color:#c9eaff;text-decoration:underline;font-size:13px}@media(max-width:520px){main{padding:18px 11px 36px}.panel{padding:14px}.choice-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}button.choice{font-size:14px;min-height:72px}}@media(prefers-reduced-motion:no-preference){button.choice{transition:background .15s,border .15s}}
</style></head><body><main><header><div class="pill">七年級｜3D 數學冒險</div><h1>數學幻境</h1><p>一次選好數學單元、主角、場景及玩法，再進入遊戲。</p><div class="steps"><span class="now">1 單元</span><span>2 主角</span><span>3 場景</span><span>4 玩法</span><span>5 開始</span></div></header>
<section class="panel"><h2 class="step"><span class="num">1</span>選擇數學單元</h2><div class="choice-grid" id="units">
<button class="choice selected" data-unit="exp">指數<small>指數律與運算</small></button>
<button class="choice" data-unit="frac">分數<small>分數四則運算</small></button>
<button class="choice" data-unit="expr">一元一次式<small>同類項、去括號、化簡</small></button>
<button class="choice" data-unit="eq">一元一次方程式<small>移項、求未知數</small></button></div></section>
<section class="panel"><h2 class="step"><span class="num">2</span>選擇主角</h2><div class="choice-grid" id="heroes"><button class="choice selected" data-hero="yuan">⚔️ 淵衡<small>玄藍武俠劍客</small></button><button class="choice" data-hero="zhi">🌸 芷言<small>白紫武俠劍客</small></button></div><p class="muted">選角目前會記錄在首頁；既有遊戲尚未全部支援角色同步。</p></section>
<section class="panel"><h2 class="step"><span class="num">3</span>選擇場景</h2><div class="choice-grid three" id="scenes">
<button class="choice selected" data-scene="city">🏙️ 城市街道<small>都市與棋盤風格</small></button><button class="choice" data-scene="wuxia">🏯 古城山谷<small>武俠冒險風格</small></button><button class="choice" data-scene="zombie">🧟 廢棄迷宮<small>殭屍探索風格</small></button>
</div><p class="muted">場景會決定推薦的玩法；既有頁面尚不能隨意切換地圖素材。</p></section>
<section class="panel"><h2 class="step"><span class="num">4</span>選擇遊戲玩法</h2><div class="choice-grid three" id="modes"><button class="choice selected" data-mode="city">🎲 3D 城市大富翁<small>擲骰、走格、答題</small></button><button class="choice" data-mode="wuxia">⚔️ 3D 武俠打怪<small>移動、跳躍、劍氣</small></button><button class="choice" data-mode="zombie">🎯 3D 殭屍戰場<small>迷宮、射擊、答題</small></button></div></section>
<section class="panel"><h2 class="step"><span class="num">5</span>開始遊戲</h2><div id="summary" aria-live="polite"></div><button id="go" type="button">選擇對應遊戲 ▶</button><div id="message" role="status" aria-live="polite"></div><div class="links"><a href="../" target="_blank" rel="noopener">原版《指數劍客》</a><a href="https://stnhhs2003-creator.github.io/fraction-charge/" target="_blank" rel="noopener">分數舊版遊戲</a><a href="https://stnhhs2003-creator.github.io/equation-city-3d/" target="_blank" rel="noopener">方程式城市舊版</a><a href="../linear3d/" target="_blank" rel="noopener">3D 武俠雙版本</a><a href="../zombie3d/" target="_blank" rel="noopener">3D 殭屍雙版本</a></div></section>
<p class="muted">整合版 v1｜同一入口串接現有遊戲。未完成的單元×場景×玩法組合不會假裝已開放。遊戲需在支援 WebGL 的瀏覽器中執行。</p></main>
<script>(()=>{"use strict";const state={unit:"exp",hero:"yuan",scene:"city",mode:"city"},names={unit:{exp:"指數",frac:"分數",expr:"一元一次式",eq:"一元一次方程式"},hero:{yuan:"淵衡",zhi:"芷言"},scene:{city:"城市街道",wuxia:"古城山谷",zombie:"廢棄迷宮"},mode:{city:"3D 城市大富翁",wuxia:"3D 武俠打怪",zombie:"3D 殭屍戰場"}};const available={
"exp:wuxia":"../",

"expr:wuxia":"../linear3d/expression.html",
"eq:wuxia":"../linear3d/equation.html",
"expr:zombie":"../zombie3d/expression.html",
"eq:zombie":"../zombie3d/equation.html",

};const $=x=>document.querySelector(x),sections={unit:"#units",hero:"#heroes",scene:"#scenes",mode:"#modes"};
function update(){const destination=available[state.unit+":"+state.mode];const matching=state.scene===state.mode;$("#summary").textContent=names.unit[state.unit]+" → "+names.hero[state.hero]+" → "+names.scene[state.scene]+" → "+names.mode[state.mode];$("#go").disabled=!destination||!matching;$("#go").textContent=!matching?"場景與玩法不相符":destination?"開始遊戲 ▶":"此組合尚未開放";$("#message").textContent=!matching?"請選相對應的場景與玩法（城市／古城／迷宮）。":!destination?"此單元的這種玩法尚未完成，請選其他玩法。":"目前連結既有版本；主角及場景外觀不一定會同步。";for(const [kind,sel] of Object.entries(sections)){document.querySelectorAll(sel+" button").forEach(b=>b.classList.toggle("selected",b.dataset[kind]===state[kind]))}}
for(const [kind,sel] of Object.entries(sections)){document.querySelectorAll(sel+" button").forEach(b=>b.addEventListener("click",()=>{state[kind]=b.dataset[kind];if(kind==="scene")state.mode=state.scene;if(kind==="mode")state.scene=state.mode;update()}))}
$("#go").addEventListener("click",()=>{const url=available[state.unit+":"+state.mode];if(!url||state.scene!==state.mode)return;try{sessionStorage.setItem("mathRealmSelection",JSON.stringify(state))}catch(_e){}location.href=url});update()})();</script></body></html>
