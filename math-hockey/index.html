ion id="summary" hidden><h2 id="summaryTitle"></h2><div id="summaryStats"></div><button id="nextStage">下一關</button><button id="finish">返回選單</button></section></main><script>
const $=id=>document.getElementById(id),c=$('field'),g=c.getContext('2d'),W=1200,H=500;let phase='menu',stage=0,mode='sync',score=[0,0],streak=[0,0],locked=[false,false],q,deadline=0,serve=0,boost=0,keys=new Set(),p=[{x:220,y:250},{x:980,y:250}],b={x:600,y:250,vx:0,vy:0},last=0,ac,music=true,beat=0,aiTime=0,particles=[],trail=[],round=0;const colors=['#39aaff','#ff535e'],themes=['#d6a24a','#72d9ff','#ff7033','#d77aff','#55efcf'],names=['鋼鐵機甲競技場','極地冰封神殿','熔岩機械工廠','幻影忍者神殿','終極機甲龍王基地'];function tone(f,d=.12,v=.05,type='triangle'){if(!ac||!music)return;let o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}function announce(s){$('banner').textContent=s}function speech(s){if(music&&window.speechSynthesis){let u=new SpeechSynthesisUtterance(s);u.lang='zh-TW';u.rate=1.25;speechSynthesis.speak(u)}}function rand(n){return Math.floor(Math.random()*n)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}const curriculum={"up":[["1-1 正數與負數",1],["1-2 正負數的加減",1],["1-3 正負數的乘除",1],["1-4 指數記法與科學記號",4],["2-1 質因數分解",2],["2-2 最大公因數與最小公倍數",2],["2-3 分數的加減運算",3],["2-4 分數的乘除運算與指數律",4],["3-1 式子的運算",5],["3-2 解一元一次方程式",5],["3-3 應用問題",6]],"down":[["1-1 二元一次方程式",1],["1-2 解二元一次聯立方程式",1],["1-3 應用問題",1],["2-1 直角坐標平面",2],["2-2 二元一次方程式的圖形",2],["3-1 比例式",3],["3-2 正比與反比",3],["4-1 一元一次不等式的解及圖示",4],["4-2 解一元一次不等式及其應用",4],["5 統計圖表與統計數據",5],["6 線對稱與三視圖",6]]};const units={up:curriculum.up.map(a=>a[0]),down:curriculum.down.map(a=>a[0])};const termChoices={up:0,down:0};function loadUnits(){let term=$('semester').value,arr=['全冊綜合複習',...units[term]];$('termUp').setAttribute('aria-pressed',String(term==='up'));$('termDown').setAttribute('aria-pressed',String(term==='down'));$('unit').replaceChildren(...arr.map((n,i)=>{let e=document.createElement('option');e.value=i;e.textContent=n;return e}));$('unit').value=termChoices[term];$('unitCards').replaceChildren(...arr.map((n,i)=>{let e=document.createElement('button');e.type='button';e.textContent=(i?i+'. ':'')+n;e.setAttribute('aria-pressed',String(i===termChoices[term]));e.onclick=()=>{termChoices[term]=i;$('unit').value=i;for(let k of $('unitCards').children)k.setAttribute('aria-pressed',String(k===e))};return e}))}function switchTerm(t){$('semester').value=t;loadUnits()}$('termUp').onclick=()=>switchTerm('up');$('termDown').onclick=()=>switchTerm('down');$('semester').onchange=loadUnits;loadUnits();function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}function challengeQ(down,u){let a=rand(5)+2,b=rand(5)+2,x=rand(7)+2,y=rand(7)+2,s,ans,opts=[];const sup=n=>String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join(''),pow=(v,n)=>String(v)+sup(n),fac=(i,j,k)=>pow(2,i)+' × '+pow(3,j)+' × '+pow(5,k),frac=(n,d)=>{let k=gcd(n,d);return d/k===1?String(n/k):(n/k)+'/'+(d/k)};if(!down){switch(u){case 1:s='數線上距離 −'+a+' 為 '+(a+x)+' 的兩點，其坐標和？';ans=-2*a;break;case 2:s='−'+a+' − (−'+b+') − ('+x+' − '+y+') = ?';ans=-a+b-x+y;break;case 3:s='(−'+a+') × ['+b+' − ('+(b+x)+')] ÷ '+a+' = ?';ans=x;break;case 4:s='('+pow(2,a)+' × '+pow(2,b)+') ÷ '+pow(2,x)+' 的指數？';if(x>a+b){s='('+pow(2,a)+' × '+pow(2,b)+') 的指數？';ans=a+b}else ans=a+b-x;break;case 5:s=(2**a*3**b*5)+' 的標準分解式？';ans=fac(a,b,1);opts=[ans,fac(b+1,a,1),fac(a,b+1,1),fac(a,b,2)];break;case 6:{let l=rand(2),i=a,j=b,k=x%3+1;s=fac(i,j+1,k)+'、'+fac(i+1,j,k+1)+' 的'+(l?'最小公倍數':'最大公因數')+'？';ans=l?fac(i+1,j+1,k+1):fac(i,j,k);opts=[fac(i,j,k),fac(i+1,j+1,k+1),fac(i,j+1,k),fac(i+1,j,k+1)];break}case 7:s=a+'/'+b+' − '+x+'/'+(2*b)+' + 1 = ?';{let n=2*a-x+2*b,d=2*b;ans=frac(n,d);opts=[ans,frac(n+1,d),frac(n-1,d),frac(n+2,d)]}break;case 8:{let n=a*b-x;if(n<1){x=1;n=a*b-x}s='('+pow(3,a)+')'+sup(b)+' ÷ '+pow(3,x)+' = ?';ans=pow(3,n);opts=[ans,pow(3,n+1),pow(3,n+2),pow(3,n-1)];break}case 9:s=a+'(x − '+b+') − '+b+'(x + '+a+')，常數項？';ans=-2*a*b;break;case 10:s=a+'(x − '+b+') + '+(a
