<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學對決｜大屏音量面板收合及倒數偵測 V4</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071624}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="play" title="數學對決大屏音效測試" src="../screen-test/"></iframe><script>
(function(){
const frame=document.getElementById('play');
function patch(){
try{
const w=frame.contentWindow,d=w.document;if(!d||!d.body||d.getElementById('hsin-audio-unlock'))return;
const css=d.createElement('style');css.textContent='#hsin-audio-unlock{position:fixed!important;z-index:2147483000!important;right:12px!important;bottom:12px!important;border:2px solid #ffe59a!important;background:#163d5c!important;color:#fff!important;border-radius:12px!important;padding:12px 16px!important;font:800 17px system-ui!important;box-shadow:0 4px 15px #0008!important;cursor:pointer!important;touch-action:manipulation!important}#hsin-audio-unlock.on{background:#216348!important}';d.head.append(css);
const button=d.createElement('button');button.id='hsin-audio-unlock';button.textContent='🔊 大屏配樂增強';button.title='教室大屏若無配樂，點擊以啟動瀏覽器音效';
function unlock(){
try{
const status=w.eval("(function(){try{ctx ||=new (window.AudioContext||window.webkitAudioContext)();sound=true;duelChoice='rock';duelMusicVol=Math.max(Number(duelMusicVol)||0,.9);duelNext=0;const tr=document.getElementById('duelTrack');if(tr)tr.value='rock';const vol=document.getElementById('duelMusicVol');if(vol)vol.value=Math.round(duelMusicVol*100);const s=document.getElementById('sound');if(s)s.value='1';return ctx.resume()}catch(e){return Promise.reject(e)}})()");
Promise.resolve(status).then(()=>{button.textContent='✅ 配樂已提升至 90%';button.classList.add('on');setTimeout(()=>{button.textContent='🔊 重設大屏音量'},2600)}).catch(()=>button.textContent='🔇 請再點一次啟用配樂');
}catch(e){button.textContent='🔇 請再點一次啟用配樂'}
}
button.addEventListener('click',unlock);d.body.append(button);
const row=d.createElement('div');row.id='hsin-volume-control';row.innerHTML='<div class="hsin-bgm-head"><label for="hsin-bgm-slider">🎵 背景音樂 <strong id="hsin-bgm-percent">90%</strong></label><button id="hsin-bgm-close" type="button" aria-label="收起音量控制">× 收起</button></div><input id="hsin-bgm-slider" aria-label="背景音樂音量" type="range" min="0" max="100" value="90" step="5">';
const style=d.createElement('style');style.textContent='#hsin-volume-control{position:fixed!important;z-index:2147483000!important;right:12px!important;bottom:72px!important;display:flex!important;flex-direction:column!important;gap:5px!important;min-width:180px!important;border:1px solid #6ed2ed!important;background:#08273ce8!important;color:#fff!important;padding:9px 12px!important;border-radius:12px!important;font:700 14px system-ui!important;box-shadow:0 4px 14px #0008!important}#hsin-volume-control input{width:100%!important;accent-color:#5de9cf!important}';d.head.append(style);d.body.append(row);
const foldStyle=d.createElement('style');foldStyle.textContent='#hsin-volume-control .hsin-bgm-head{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important}#hsin-volume-control #hsin-bgm-close{background:#20475d!important;border:1px solid #a9cede!important;border-radius:7px!important;color:#fff!important;font:700 12px system-ui!important;cursor:pointer!important;padding:5px 8px!important;white-space:nowrap!important}#hsin-volume-control.hsin-folded{min-width:0!important;width:auto!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important}#hsin-volume-control.hsin-folded .hsin-bgm-head,#hsin-volume-control.hsin-folded input{display:none!important}#hsin-volume-control #hsin-bgm-open{display:none!important}#hsin-volume-control.hsin-folded #hsin-bgm-open{display:block!important;background:#07304cd9!important;color:#fff!important;border:1px solid #6ed2ed!important;border-radius:12px!important;padding:8px 11px!important;font:700 13px system-ui!important;cursor:pointer!important}#hsin-audio-unlock{bottom:12px!important;right:12px!important}#hsin-volume-control{bottom:72px!important;right:12px!important}@media(max-height:490px){#hsin-audio-unlock{bottom:5px!important;padding:5px 9px!important;font-size:12px!important;right:5px!important}#hsin-volume-control{bottom:47px!important;right:5px!important;padding:6px 9px!important}}';d.head.append(foldStyle);
const openBtn=d.createElement('button');openBtn.id='hsin-bgm-open';openBtn.type='button';openBtn.textContent='🎵 音量';openBtn.setAttribute('aria-label','展開音量控制');row.append(openBtn);
const fold=()=>{row.classList.add('hsin-folded');openBtn.focus({preventScroll:true})};
const unfold=()=>{row.classList.remove('hsin-folded');row.querySelector('#hsin-bgm-slider').focus({preventScroll:true})};
row.querySelector('#hsin-bgm-close').addEventListener('click',fold);
openBtn.addEventListener('click',unfold);
row.classList.add('hsin-folded');
row.querySelector('input').addEventListener('input',function(){const num=Number(this.value);row.querySelector('strong').textContent=num+'%';try{w.eval('duelMusicVol='+JSON.stringify(num/100)+';sound=true;duelNext=0;');const v=d.getElementById('duelMusicVol');if(v)v.value=String(num);const snd=d.getElementById('sound');if(snd)snd.value='1'}catch(e){}});
function installCountdownAudio(){
  if(d.getElementById('hsin-countdown-status'))return;
  const info=d.createElement('div');info.id='hsin-countdown-status';info.textContent='⏱️ 最後30秒音效：偵測計時中';
  info.style.cssText='position:fixed;z-index:2147482999;left:8px;bottom:8px;padding:7px 10px;border-radius:10px;background:#0a2948de;border:1px solid #d4b867;color:#fff;font:700 12px system-ui;pointer-events:none';
  d.body.append(info);
  const selectors=['#timer','#clock','#time','#timeLeft','#time-left','#countdown','#remaining-time','.timer','.countdown','.time-left','[data-testid="timer"]'];
  function parse(raw){
    const t=String(raw||'').trim();
    const time=t.match(/(\\d{1,2}):(\\d{2})(?!\\d)/);
    if(time&&Number(time[2])<60)return Number(time[1])*60+Number(time[2]);
    const seconds=t.match(/(?:剩餘|剩下|時間|倒數|⏱️)?\\s*(\\d{1,3})\\s*秒/);
    if(seconds)return Number(seconds[1]);
    return null;
  }
  function remaining(){
    for(const sel of selectors){
      const el=d.querySelector(sel);
      if(el&&el.getClientRects().length&&el.children.length<3){
        const n=parse(el.textContent);if(n!==null)return n;
      }
    }
    const candidates=[...d.querySelectorAll('[id*="time" i],[id*="clock" i],[class*="timer" i],[class*="countdown" i]')].slice(0,45);
    for(const el of candidates){
      if(el.getClientRects().length&&el.children.length===0){
        const n=parse(el.textContent);if(n!==null)return n;
      }
    }
    return null;
  }
  let last=null,lastNote=-1,playedEnd=false,ctxLocal=null;
  function unlockCueContext(){
    try{ctxLocal||=new (w.AudioContext||w.webkitAudioContext)();if(ctxLocal.state==='suspended')ctxLocal.resume().catch(()=>{});}catch(e){}
  }
  d.addEventListener('pointerdown',unlockCueContext,{capture:true});
  d.addEventListener('keydown',unlockCueContext,{capture:true});
  function tone(hz,duration=.11,type='sine',amplitude=.1){
    try{
      ctxLocal||=new (w.AudioContext||w.webkitAudioContext)();
      if(ctxLocal.state==='suspended')return;
      const osc=ctxLocal.createOscillator(),gain=ctxLocal.createGain();
      osc.type=type;osc.frequency.setValueAtTime(hz,ctxLocal.currentTime);
      gain.gain.setValueAtTime(.0001,ctxLocal.currentTime);
      gain.gain.exponentialRampToValueAtTime(amplitude,ctxLocal.currentTime+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,ctxLocal.currentTime+duration);
      osc.connect(gain).connect(ctxLocal.destination);osc.start();osc.stop(ctxLocal.currentTime+duration+.01);
    }catch(e){}
  }
  function cue(sec){
    if(sec===0){tone(660,.17,'triangle',.12);setTimeout(()=>tone(440,.19,'triangle',.12),180);setTimeout(()=>tone(330,.48,'sawtooth',.10),380);return;}
    if(sec<=5){tone(980,.17,'square',.08);return;}
    if(sec<=10){tone(790,.12,'triangle',.12);return;}
    if(sec===30||sec===20){tone(530,.11,'sine',.09);setTimeout(()=>tone(670,.1,'sine',.09),125);}
  }
  let prevActive=false;
  setInterval(()=>{
    if(d.hidden)return;
    const n=remaining();
    if(n===null){info.textContent='⏱️ 倒數音效：等待遊戲計時';last=null;prevActive=false;return;}
    info.textContent=n<=30?'🔔 最後 '+n+' 秒音效已待命':'⏱️ 最後30秒開始音效';
    if(last===null){last=n;prevActive=true;playedEnd=false;return;}
    if(n>last+1){last=n;lastNote=-1;playedEnd=false;return;}
    if(n===last)return;
    if(n<last){
      if(n===0&&!playedEnd){cue(0);playedEnd=true;}
      else if(n>0&&n<=30&&n!==lastNote&&(n===30||n===20||n<=10)){cue(n);lastNote=n;}
    }
    last=n;
  },250);
}
installCountdownAudio();


const start=d.getElementById('start');if(start)start.addEventListener('click',unlock,{capture:true});
const mute=d.getElementById('mute');if(mute)mute.addEventListener('click',()=>{try{w.eval("if(ctx&&ctx.state==='suspended')ctx.resume()")}catch(e){}});
d.addEventListener('visibilitychange',()=>{if(!d.hidden){try{w.eval("if(ctx&&ctx.state==='suspended')ctx.resume()")}catch(e){}}});
}catch(e){}
}
frame.addEventListener('load',()=>{patch();setTimeout(patch,700);setTimeout(patch,1800)});
})();
</script></body></html>
