function generateProgress(u,d,stage){
 const N=3+d+stage, dice=(a,b)=>r(a,b),nz=()=>dice(1,N)*(r(0,1)?1:-1),a=dice(2,N),b=dice(2,N),c=dice(1,N-1),x=nz(),op=r(0,1),p=n=>`(${n})`;let q,ans,opts,ex;
 function number(v){ans=String(v);let delta=Math.max(1,stage===3?Math.round(Math.abs(v)*.1):1);opts=[v,v+delta,v-delta,v+delta*2].map(String)}
 function rational(A,B){ans=frac(A,B);opts=[ans,frac(A+B,B),frac(A-B,B),frac(A+1,B)];if(new Set(opts).size!==4)opts=[ans,frac(A+1,B),frac(A-1,B),frac(A+2,B)]}
 if(u===0){const base=r(2,4),e=r(1,3),f=r(1,3),g=r(1,2);let power;if(stage===1){if(op){q=`${pow(base,e)} × ${pow(base,f)} = ?`;power=e+f}else{q=`${pow(base,e+f)} ÷ ${pow(base,f)} = ?`;power=e}ans=pow(base,power);opts=[power,power+1,power-1,power+2].map(t=>pow(base,t))}else if(stage===2){q=`(${pow(base,e)})<sup>${f}</sup> × ${pow(base,g)} = ?`;power=e*f+g;ans=pow(base,power);opts=[power,power+1,power-1,power+2].map(t=>pow(base,t))}else{q=op?`(${pow(base,e)} + ${pow(base,f)}) × ${base} = ?`:`${pow(base,e+2)} − ${pow(base,f)} × ${base} = ?`;number(op?(base**e+base**f)*base:base**(e+2)-base**f*base)}}
 else if(u===1){let den=r(2,5+d),den2=stage===1?den:r(2,7),n=r(1,den-1),m=r(1,den2-1),A,B;if(stage===1){q=`${frac(n,den)} ${op?'＋':'−'} ${frac(m,den2)} = ?`;A=n*den2+(op?1:-1)*m*den;B=den*den2}else if(stage===2){q=`${frac(n,den)} ${op?'×':'÷'} ${frac(m,den2)} = ?`;A=op?n*m:n*den2;B=op?den*den2:den*m}else{let k=r(2,4);q=`${frac(n,den)} − ${frac(m,den2)} × ${frac(1,k)} = ?`;A=n*den2*k-m*den;B=den*den2*k}rational(A,B)}

 else if(u===3){if(stage===1)q=`${lin(a,b)} = ${a*x+b}，x = ?`;else if(stage===2)q=`${a}(x ${sg(b)}) = ${a*(x+b)}，x = ?`;else{let coef=a===c?c+1:c;q=`${a}(x ${sg(b)}) = ${lin(coef,a*(x+b)-coef*x)}，x = ?`}number(x)}
 else if(u===4){let e=r(1,stage===1?2:3),f=r(1,3),h=r(1,3),i=r(1,3),j=stage===3?r(1,2):0,k=stage===3?r(1,2):0,A=2**e*3**f*5**j,B=2**h*3**i*5**k,isG=!!op;let standard=(v,w,z)=>`${pow(2,v)}×${pow(3,w)}${z?'×'+pow(5,z):''}`;q=`${stage===1?A:standard(e,f,j)} 與 ${stage===1?B:standard(h,i,k)}<br>的${isG?'最大公因數':'最小公倍數'}？`;let v=isG?gcd(A,B):A*B/gcd(A,B);ans=String(v);opts=[v,v*2,v*3,v+1].map(String)}
 else{let y=nz(),z=nz();if(stage===1){q=`${p(x)} ${op?'＋':'−'} ${p(y)} = ?`;number(op?x+y:x-y)}else if(stage===2){q=op?`${p(x)} × ${p(y)} = ?`:`${p(x*y)} ÷ ${p(y)} = ?`;number(op?x*y:x)}else{q=`${p(x)} − ${p(y)} × ${p(z)} = ?`;number(x-y*z)}}

</style></head><body><main id="menu"><div class="tag">MATH • DUEL / V1.2</div><h1>數學對屏競技場</h1><h2>紅藍拔河之戰</h2><div class="versus-banner"><div class="vr">紅隊<small>RED TEAM</small></div><div class="vb">藍隊<small>BLUE TEAM</small></div><strong>VS</strong></div><p>兩人面對面，共用一台裝置。答對就拉動能量旗幟！</p><div class="card"><label>課程單元<select id="unit"><option>指數律</option><option>分數四則</option><option>一元一次式</option><option>一元一次方程式</option><option>最大公因數與最小公倍數</option><option>正負數四則運算</option></select></label><label>顯示方式<select id="displayMode"><option value="auto">自動（手機／大屏）</option><option value="phone">手機對屏（上下）</option><option value="wide">教室大屏（左右）</option></select></label><label>難度<select id="difficulty"><option value="1">基礎</option><option value="2">進階</option><option value="3">挑戰</option></select></label><label>題數<select id="amount"><option>5</option><option selected>10</option><option>20</option></select></label><label>作答時間<select id="duration"><option value="90">90 秒</option><option value="180">180 秒</option><option value="300">300 秒</option></select></label><label>音效<select id="sound"><option value="1">開啟</option><option value="0">關閉</option></select></label><button id="start">開始對決 ▶</button></div><p>每局題目由暖身、進階至挑戰，自動逐步加難。答對拉旗一步、錯答不加分。先拉至底線即勝利；時間到依旗幟位置判定，平手則比較答對數。雙方題庫相同，選項各自洗牌。</p><p class="tiny">鍵盤：紅隊 1–4，藍隊 7–0；亦可直接觸控。中央旗幟左側為紅隊、右側為藍隊。</p></main><div id="arena" class="hide"><section class="side red" id="red"></section><div class="rope"><button id="exit">結束</button><span id="clock">00:00</span><div class="track"><span class="flag" id="flag">🚩</span></div><button id="mute">🔊</button></div><section class="side blue" id="blue"></section></div><div class="count hide" id="count"></div><main class="result hide" id="result"><div class="tag">DUEL COMPLETE</div><strong id="winner"></strong><div class="card" id="summary"></div><button id="again">再戰一局</button><button id="home">返回設定</button></main><script>
const $=id=>document.getElementById(id),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),frac=(a,b)=>{if(b<0){a=-a;b=-b}let g=gcd(a,b);a/=g;b/=g;return b===1?String(a):`<span class="frac"><span>${a}</span><span>${b}</span></span>`},pow=(a,b)=>`${a}<sup>${b}</sup>`,sg=n=>n<0?`− ${-n}`:`+ ${n}`,lin=(a,b)=>`${a===0?'':a===1?'x':a===-1?'−x':a+'x'}${b===0?(a===0?'0':''):a===0?b:' '+sg(b)}`;
function generate(u,d){let a=r(2,4+d),b=r(2,4+d),c=r(1,3+d),n=r(-5-d,5+d),k=r(1,4+d),q,ans,opts,ex;const make=(x)=>[x,x+1,x-1,x+2];if(u===0){let e=r(1,Math.min(4,2+d)),f=r(1,Math.min(4,2+d)),base=r(2,4),kind=r(0,d===1?1:3);if(kind===0){q=`${pow(base,e)} × ${pow(base,f)} = ?`;ans=base**(e+f)}else if(kind===1){q=`${pow(base,e+f)} ÷ ${pow(base,f)} = ?`;ans=base**e}else if(kind===2){q=`(${pow(base,e)})<sup>${f}</sup> = ?`;ans=base**(e*f)}else{q=`${pow(base,e)} + ${pow(base,f)} = ?`;ans=base**e+base**f}opts=make(ans);ex=`答案：${ans}`}else if(u===1){let den=r(2,5+d),den2=d===1?den:r(2,7),num=r(1,den-1),num2=r(1,den2-1),op=r(0,d===1?1:3),A,B; if(op===0){A=num*den2+num2*den;B=den*den2}else if(op===1){A=num*den2-num2*den;B=den*den2}else if(op===2){A=num*num2;B=den*den2}else{A=num*den2;B=den*num2}q=`${frac(num,den)} ${['＋','−','×','÷'][op]} ${frac(num2,den2)} = ?`;ans=frac(A,B);opts=[ans,frac(A+1,B),frac(A-1,B),frac(A+2,B)];ex=`答案：${ans}`}else if(u===2){q=d===1?`${lin(a,b)} ${sg(c)} − ${k}x 化簡`:`${a}(x ${sg(b)}) − ${c}(x ${sg(k)}) 化簡`;let A=d===1?a-k:a-c,B=d===1?b+c:a*b-c*k;ans=lin(A,B);opts=[ans,lin(A+1,B),lin(A,B+1),lin(A-1,B)];ex=`合併同類項：${ans}`}else if(u===3){q=d===1?`${lin(a,b)} = ${a*n+b}，x = ?`:`${a}(x ${sg(b)}) = ${a*(n+b)}，x = ?`;ans=n;opts=make(n);ex=`x = ${n}`}else if(u===4){let e=r(1,3),f=r(1,3),h=r(1,3),i=r(1,3),A=2**e*3**f,B=2**h*3**i,isG=!!r(0,1);q=`${d===1?A:pow(2,e)+' × '+pow(3,f)} 與 ${d===1?B:pow(2,h)+' × '+pow(3,i)} 的${isG?'最大公因數':'最小公倍數'}？`;ans=isG?gcd(A,B):A*B/gcd(A,B);opts=[ans,ans*2,ans*3,ans+1];ex=`答案：${ans}`}else{let x=r(-9,9),y=r(-9,9),z=r(-5,5);q=d===1?`(${x}) + (${y}) = ?`:`(${x}) − (${y}) × (${z}) = ?`;ans=d===1?x+y:x-y*z;opts=make(ans);ex=`答案：${ans}`}return {q,ans:String(ans),opts:opts.map(String),ex}}
let bank=[],state=[],active=false,session=0,timer,remaining,total,pull=0,limit=3,sound=true,ctx;function tone(ok){if(!sound)return;try{ctx ||=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:180;g.gain.setValueAtTime(.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.start();o.stop(ctx.currentTime+.18)}catch{}}
function render(i){let s=state[i],e=$(i?'blue':'red'),q=bank[s.idx];e.innerHTML=`<div class="head"><span>${i?'🔵 藍隊':'🔴 紅隊'}　${Math.min(s.idx+1,total)}/${total} <small class="level-tag">${q?.level||"完成"}</small></span><span class="badge">${s.score} 分</span></div><div class="progress"><i style="width:${s.idx/total*100}%"></i></div><div class="q">${q?q.q:'已完成！等待對手'}</div><div class="choices">${q?shuffle(q.opts).map((v,j)=>`<button data-idx="${j}" data-key="${(i?"7890":"1234")[j]}" ${!active?'disabled':''}>${v}</button>`).join(''):''}</div><div class="feedback">${s.note||''}</div>`;e.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>answer(i,b))}
function finish(){if(!active)return;active=false;clearInterval(timer);session++;$('arena').classList.add('hide');$('result').classList.remove('hide');let win=pull<0?'🔴 紅隊勝利！':pull>0?'🔵 藍隊勝利！':state[0].score>state[1].score?'🔴 紅隊勝利！':state[1].score>state[0].score?'🔵 藍隊勝利！':'🤝 平手！';$('winner').textContent=win;$('summary').innerHTML=state.map((s,i)=>`<b>${i?'藍隊':'紅隊'}：${s.score} 分</b><span>答對 ${s.score} 題／已答 ${s.idx} 題</span>`).join('');tone(true)}
function answer(i,b){let s=state[i];if(!active||s.lock||s.idx>=total)return;s.lock=true;let q=bank[s.idx],ok=b.innerHTML===q.ans; // compare rendered normalized HTML below
let probe=document.createElement('div');probe.innerHTML=q.ans;ok=b.innerHTML===probe.innerHTML;b.classList.add(ok?'ok':'no');s.idx++;if(ok){s.score++;pull+=i?1:-1;$('flag').style.left=`${50+pull/limit*45}%`}s.note=ok?'✓ 答對！拉旗成功':`✕ ${q.ex}`;$(i?'blue':'red').querySelector('.feedback').innerHTML=s.note;tone(ok);if(Math.abs(pull)>=limit){finish();return}let token=session;setTimeout(()=>{if(token!==session||!active)return;s.lock=false;render(i);if(state.every(x=>x.idx===total&&!x.lock))finish()},ok?420:1150)}
function tick(){$('clock').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}
function start(){applyLayout();clearInterval(timer);let token=++session;active=false;total=+$('amount').value;limit=Math.max(3,Math.ceil(total/2));remaining=+$('duration').value;sound=$('sound').value==='1';pull=0;$('flag').style.left='50%';$('mute').textContent=sound?'🔊':'🔇';bank=[];let seen=new Set(),attempts=0;while(bank.length<total&&attempts++<3000){let q=generateProgress($('unit').selectedIndex,+$('difficulty').value,Math.min(3,1+Math.floor(bank.length*3/total)));if(!seen.has(q.q)&&new Set(q.opts).size===4){seen.add(q.q);bank.push(q)}}total=bank.length;state=[{idx:0,score:0,lock:false},{idx:0,score:0,lock:false}];$('menu').classList.add('hide');$('result').classList.add('hide');$('arena').classList.remove('hide');tick();render(0);render(1);tone(true);$('count').classList.remove('hide');let c=3;$('count').dataset.n=c;const interval=setInterval(()=>{if(token!==session){clearInterval(interval);return}c--;$('count').dataset.n=c||'GO!';if(c===0){clearInterval(interval);setTimeout(()=>{if(token!==session)return;$('count').classList.add('hide');active=true;render(0);render(1);timer=setInterval(()=>{remaining--;tick();if(remaining<=0)finish()},1000)},450)}},750)}
function home(){session++;active=false;clearInterval(timer);$('count').classList.add('hide');$('arena').classList.add('hide');$('result').classList.add('hide');$('menu').classList.remove('hide')}window.addEventListener("resize",applyLayout);$('start').onclick=start;$('again').onclick=start;$('home').onclick=home;$('exit').onclick=home;$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊':'🔇'};document.addEventListener('keydown',e=>{if(!active||e.repeat)return;let a='1234'.indexOf(e.key),b='7890'.indexOf(e.key);if(a>=0)$('red').querySelectorAll('.choices button')[a]?.click();if(b>=0)$('blue').querySelectorAll('.choices button')[b]?.click()});</script></body></html>
