<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學對屏競技場｜拔河之戰</title><style>
*{box-sizing:border-box}body{margin:0;background:#070e20;color:#fff;font-family:system-ui,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:default}main{max-width:760px;margin:auto;padding:28px 20px}h1{font-size:clamp(30px,7vw,56px);margin:8px 0;background:linear-gradient(95deg,#ff617a,#fff,#4ab8ff);background-clip:text;color:transparent}p{color:#b9c9e3}.tag{letter-spacing:3px;color:#60d9ff;font-weight:800}.card{background:#111e36;border:1px solid #354b6d;border-radius:20px;padding:20px;margin:20px 0;display:grid;gap:12px}label{display:grid;gap:5px;font-weight:bold}select,button{background:#192a48;border:1px solid #426187;border-radius:12px;padding:12px}#start,#again{background:linear-gradient(110deg,#dc385d,#286dea);font-weight:900;font-size:22px;border:0}.hide{display:none!important}#arena{height:100dvh;min-height:470px;display:grid;grid-template-rows:1fr 58px 1fr;overflow:hidden}.side{min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(8px,2vw,20px);gap:clamp(4px,1vh,12px);background:radial-gradient(ellipse at 10% 15%,#19426f,#101d33 70%);color:#e8f4ff}.red{transform:rotate(180deg);background:radial-gradient(ellipse at 10% 15%,#692034,#241323 70%)}.head{display:flex;justify-content:space-between;align-items:center;font-weight:900}.badge{border-radius:99px;background:#ffffff20;padding:4px 12px}.red .badge{color:#ff9caf}.blue .badge{color:#88dfff}.progress{height:5px;background:#ffffff20;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:currentColor;transition:width .2s}.q{font-size:clamp(16px,4.1vw,30px);text-align:center;font-weight:750;min-height:1.5em;display:flex;align-items:center;justify-content:center;gap:4px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choices button{font-size:clamp(17px,4vw,28px);font-weight:800;min-height:44px;padding:5px 8px;background:#0b172c;border:2px solid #334969;display:flex;align-items:center;justify-content:center}.red .choices button{border-color:#704154;background:#241320}.choices button.ok{background:#147c55;border-color:#5ef5a8}.choices button.no{background:#a22540;border-color:#ff7294}.feedback{height:1.2em;text-align:center;font-size:clamp(12px,2.6vw,16px);font-weight:700}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.03;margin:0 3px}.frac span:first-child{border-bottom:1.5px solid;padding:0 3px}.frac span:last-child{padding:0 3px}sup{font-size:.65em}.rope{position:relative;background:#111827;border-top:3px solid #f35e73;border-bottom:3px solid #47b6ff;display:flex;align-items:center;justify-content:space-around;overflow:hidden}.track{height:18px;width:50%;border-radius:12px;background:linear-gradient(90deg,#fd4160,#7a3146 47%,#285572 53%,#40aeff);position:relative;box-shadow:0 0 20px #ffffff20}.track:before{content:'';position:absolute;left:50%;height:100%;border-left:2px dashed #fff8}.flag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;transition:left .35s cubic-bezier(.2,.8,.3,1.2);filter:drop-shadow(0 0 5px white)}.rope button{font-size:14px;padding:5px 8px}.count{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:5;font-size:clamp(60px,24vw,150px);font-weight:1000;color:#ffd16c;pointer-events:none;text-shadow:0 0 28px #ff872b}.result{text-align:center}.result strong{font-size:42px;display:block;margin:20px}.tiny{font-size:12px;color:#9db0ce}@media(min-width:800px){#arena{max-width:1100px;margin:auto}.side{padding:12px 10%}.q{font-size:30px}.choices button{font-size:25px}}@media(max-height:610px){.side{gap:3px;padding:5px 14px}.q{font-size:17px}.choices button{min-height:32px;font-size:17px}.feedback{font-size:12px}.head{font-size:13px}#arena{grid-template-rows:1fr 42px 1fr}}
</style></head><body><main id="menu"><div class="tag">MATH • DUEL / V1.0</div><h1>數學對屏競技場</h1><h2>紅藍拔河之戰</h2><p>兩人面對面，共用一台裝置。答對就拉動能量旗幟！</p><div class="card"><label>課程單元<select id="unit"><option>指數律</option><option>分數四則</option><option>一元一次式</option><option>一元一次方程式</option><option>最大公因數與最小公倍數</option><option>正負數四則運算</option></select></label><label>難度<select id="difficulty"><option value="1">基礎</option><option value="2">進階</option><option value="3">挑戰</option></select></label><label>題數<select id="amount"><option>5</option><option selected>10</option><option>20</option></select></label><label>作答時間<select id="duration"><option value="90">90 秒</option><option value="180">180 秒</option><option value="300">300 秒</option></select></label><label>音效<select id="sound"><option value="1">開啟</option><option value="0">關閉</option></select></label><button id="start">開始對決 ▶</button></div><p>答對拉旗一步、錯答不加分。先拉至底線即勝利；時間到依旗幟位置判定，平手則比較答對數。雙方題庫相同，選項各自洗牌。</p><p class="tiny">鍵盤：紅隊 1–4，藍隊 7–0；亦可直接觸控。中央旗幟左側為紅隊、右側為藍隊。</p></main><div id="arena" class="hide"><section class="side red" id="red"></section><div class="rope"><button id="exit">結束</button><span id="clock">00:00</span><div class="track"><span class="flag" id="flag">🚩</span></div><button id="mute">🔊</button></div><section class="side blue" id="blue"></section></div><div class="count hide" id="count"></div><main class="result hide" id="result"><div class="tag">DUEL COMPLETE</div><strong id="winner"></strong><div class="card" id="summary"></div><button id="again">再戰一局</button><button id="home">返回設定</button></main><script>
const $=id=>document.getElementById(id),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),frac=(a,b)=>{if(b<0){a=-a;b=-b}let g=gcd(a,b);a/=g;b/=g;return b===1?String(a):`<span class="frac"><span>${a}</span><span>${b}</span></span>`},pow=(a,b)=>`${a}<sup>${b}</sup>`,sg=n=>n<0?`− ${-n}`:`+ ${n}`,lin=(a,b)=>`${a===0?'':a===1?'x':a===-1?'−x':a+'x'}${b===0?(a===0?'0':''):a===0?b:' '+sg(b)}`;
function generate(u,d){let a=r(2,4+d),b=r(2,4+d),c=r(1,3+d),n=r(-5-d,5+d),k=r(1,4+d),q,ans,opts,ex;const make=(x)=>[x,x+1,x-1,x+2];if(u===0){let e=r(1,Math.min(4,2+d)),f=r(1,Math.min(4,2+d)),base=r(2,4),kind=r(0,d===1?1:3);if(kind===0){q=`${pow(base,e)} × ${pow(base,f)} = ?`;ans=base**(e+f)}else if(kind===1){q=`${pow(base,e+f)} ÷ ${pow(base,f)} = ?`;ans=base**e}else if(kind===2){q=`(${pow(base,e)})<sup>${f}</sup> = ?`;ans=base**(e*f)}else{q=`${pow(base,e)} + ${pow(base,f)} = ?`;ans=base**e+base**f}opts=make(ans);ex=`答案：${ans}`}else if(u===1){let den=r(2,5+d),den2=d===1?den:r(2,7),num=r(1,den-1),num2=r(1,den2-1),op=r(0,d===1?1:3),A,B; if(op===0){A=num*den2+num2*den;B=den*den2}else if(op===1){A=num*den2-num2*den;B=den*den2}else if(op===2){A=num*num2;B=den*den2}else{A=num*den2;B=den*num2}q=`${frac(num,den)} ${['＋','−','×','÷'][op]} ${frac(num2,den2)} = ?`;ans=frac(A,B);opts=[ans,frac(A+1,B),frac(A-1,B),frac(A+2,B)];ex=`答案：${ans}`}else if(u===2){q=d===1?`${lin(a,b)} ${sg(c)} − ${k}x 化簡`:`${a}(x ${sg(b)}) − ${c}(x ${sg(k)}) 化簡`;let A=d===1?a-k:a-c,B=d===1?b+c:a*b-c*k;ans=lin(A,B);opts=[ans,lin(A+1,B),lin(A,B+1),lin(A-1,B)];ex=`合併同類項：${ans}`}else if(u===3){q=d===1?`${lin(a,b)} = ${a*n+b}，x = ?`:`${a}(x ${sg(b)}) = ${a*(n+b)}，x = ?`;ans=n;opts=make(n);ex=`x = ${n}`}else if(u===4){let e=r(1,3),f=r(1,3),h=r(1,3),i=r(1,3),A=2**e*3**f,B=2**h*3**i,isG=!!r(0,1);q=`${d===1?A:pow(2,e)+' × '+pow(3,f)} 與 ${d===1?B:pow(2,h)+' × '+pow(3,i)} 的${isG?'最大公因數':'最小公倍數'}？`;ans=isG?gcd(A,B):A*B/gcd(A,B);opts=[ans,ans*2,ans*3,ans+1];ex=`答案：${ans}`}else{let x=r(-9,9),y=r(-9,9),z=r(-5,5);q=d===1?`(${x}) + (${y}) = ?`:`(${x}) − (${y}) × (${z}) = ?`;ans=d===1?x+y:x-y*z;opts=make(ans);ex=`答案：${ans}`}return {q,ans:String(ans),opts:opts.map(String),ex}}
let bank=[],state=[],active=false,session=0,timer,remaining,total,pull=0,limit=3,sound=true,ctx;function tone(ok){if(!sound)return;try{ctx ||=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:180;g.gain.setValueAtTime(.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.start();o.stop(ctx.currentTime+.18)}catch{}}
function render(i){let s=state[i],e=$(i?'blue':'red'),q=bank[s.idx];e.innerHTML=`<div class="head"><span>${i?'🔵 藍隊':'🔴 紅隊'}　${Math.min(s.idx+1,total)}/${total}</span><span class="badge">${s.score} 分</span></div><div class="progress"><i style="width:${s.idx/total*100}%"></i></div><div class="q">${q?q.q:'已完成！等待對手'}</div><div class="choices">${q?shuffle(q.opts).map((v,j)=>`<button data-idx="${j}" ${!active?'disabled':''}>${v}</button>`).join(''):''}</div><div class="feedback">${s.note||''}</div>`;e.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>answer(i,b))}
function finish(){if(!active)return;active=false;clearInterval(timer);session++;$('arena').classList.add('hide');$('result').classList.remove('hide');let win=pull<0?'🔴 紅隊勝利！':pull>0?'🔵 藍隊勝利！':state[0].score>state[1].score?'🔴 紅隊勝利！':state[1].score>state[0].score?'🔵 藍隊勝利！':'🤝 平手！';$('winner').textContent=win;$('summary').innerHTML=state.map((s,i)=>`<b>${i?'藍隊':'紅隊'}：${s.score} 分</b><span>答對 ${s.score} 題／已答 ${s.idx} 題</span>`).join('');tone(true)}
function answer(i,b){let s=state[i];if(!active||s.lock||s.idx>=total)return;s.lock=true;let q=bank[s.idx],ok=b.innerHTML===q.ans; // compare rendered normalized HTML below
let probe=document.createElement('div');probe.innerHTML=q.ans;ok=b.innerHTML===probe.innerHTML;b.classList.add(ok?'ok':'no');s.idx++;if(ok){s.score++;pull+=i?1:-1;$('flag').style.left=`${50+pull/limit*45}%`}s.note=ok?'✓ 答對！拉旗成功':`✕ ${q.ex}`;$(i?'blue':'red').querySelector('.feedback').innerHTML=s.note;tone(ok);if(Math.abs(pull)>=limit){finish();return}let token=session;setTimeout(()=>{if(token!==session||!active)return;s.lock=false;render(i);if(state.every(x=>x.idx===total&&!x.lock))finish()},ok?420:1150)}
function tick(){$('clock').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}
function start(){clearInterval(timer);let token=++session;active=false;total=+$('amount').value;limit=Math.max(3,Math.ceil(total/2));remaining=+$('duration').value;sound=$('sound').value==='1';pull=0;$('flag').style.left='50%';$('mute').textContent=sound?'🔊':'🔇';bank=[];let seen=new Set(),attempts=0;while(bank.length<total&&attempts++<3000){let q=generate($('unit').selectedIndex,+$('difficulty').value);if(!seen.has(q.q)&&new Set(q.opts).size===4){seen.add(q.q);bank.push(q)}}total=bank.length;state=[{idx:0,score:0,lock:false},{idx:0,score:0,lock:false}];$('menu').classList.add('hide');$('result').classList.add('hide');$('arena').classList.remove('hide');tick();render(0);render(1);tone(true);$('count').classList.remove('hide');let c=3;$('count').textContent=c;const interval=setInterval(()=>{if(token!==session){clearInterval(interval);return}c--;$('count').textContent=c||'GO!';if(c===0){clearInterval(interval);setTimeout(()=>{if(token!==session)return;$('count').classList.add('hide');active=true;render(0);render(1);timer=setInterval(()=>{remaining--;tick();if(remaining<=0)finish()},1000)},450)}},750)}
function home(){session++;active=false;clearInterval(timer);$('count').classList.add('hide');$('arena').classList.add('hide');$('result').classList.add('hide');$('menu').classList.remove('hide')}$('start').onclick=start;$('again').onclick=start;$('home').onclick=home;$('exit').onclick=home;$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊':'🔇'};document.addEventListener('keydown',e=>{if(!active||e.repeat)return;let a='1234'.indexOf(e.key),b='7890'.indexOf(e.key);if(a>=0)$('red').querySelectorAll('.choices button')[a]?.click();if(b>=0)$('blue').querySelectorAll('.choices button')[b]?.click()});</script></body></html>
