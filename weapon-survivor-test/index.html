<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學秘境：武器狂潮 V0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e18;color:#f5e9ce;font:16px system-ui;overflow:hidden}#wrap{height:100vh;height:100dvh;display:grid;place-items:center}main{position:relative;width:min(100vw,177.77vh);height:min(100vh,56.25vw);width:min(100vw,177.77dvh);height:min(100dvh,56.25vw);container-type:size;display:grid;grid-template-rows:9% 67% 24%;background:#172031;border:1px solid #91734b}header{display:flex;justify-content:space-between;align-items:center;padding:0 2%;font-size:2.4cqh;background:#25354a}button,select{font:inherit;background:#34485e;color:#fff;border:1px solid #b39862;border-radius:5px;padding:.35em;touch-action:manipulation}button:disabled{opacity:.45}#mid{display:grid;grid-template-columns:23% 77%;min-height:0}aside{padding:4%;display:flex;flex-direction:column;gap:3%;min-height:0;background:#20263b;font-size:2.3cqh}#slots{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);flex:1;min-height:0;gap:3px}.slot{display:grid;place-items:center;background:#39334b;border:1px solid #8b7894;font-size:3.5cqh;line-height:1}.slot small{font-size:1.8cqh}.match{background:#8b642c;box-shadow:inset 0 0 12px #ffd875}.roll{animation:roll .12s alternate infinite}@keyframes roll{to{filter:brightness(1.8)}}#arena{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#news{position:absolute;top:1%;left:1%;right:1%;text-align:center;background:#121b2cbb;color:#ffdc91;font-size:2.4cqh;pointer-events:none}#controls{position:absolute;bottom:2%;left:2%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;font-size:3.1cqh}#controls button{width:8cqh;height:6cqh;background:#24394cdd;padding:0}#dash{position:absolute;bottom:3%;right:3%;font-size:2.8cqh;background:#725534}#question{display:grid;grid-template-rows:22% 36% 42%;text-align:center;padding:0 3% 1%;min-height:0;background:#263044}#status{font-size:2.4cqh;color:#ffd782}#prompt{font-size:5cqh;font-weight:bold;line-height:1.1}#answers{display:grid;grid-template-columns:repeat(4,1fr);gap:1%;min-height:0}#answers button{font-size:3.8cqh;font-weight:bold;padding:0}#cover{position:absolute;inset:0;z-index:5;background:linear-gradient(90deg,#0d1729f5,#17233bbd 70%,#17233b55);display:grid;align-items:center;padding:5%;overflow:auto}#cover.hidden{display:none}#cover h1{font-size:8cqh;margin:0;color:#ffe09a;text-shadow:0 0 20px #f5a650}#cover p,#cover select,#cover button{font-size:2.8cqh}#cover button{background:#8b612a;padding:.6em 1.6em}#audio{position:absolute;right:2%;top:10%;z-index:8;background:#19243c;padding:2%;font-size:2.6cqh}#audio[hidden]{display:none}#audio label{display:block}#hpbar{display:inline-block;width:12cqw;height:1.6cqh;background:#442b38;vertical-align:middle}#hpfill{display:block;height:100%;background:#80d79b;width:100%}#loadout{font-size:1.95cqh;line-height:1.3;min-height:3em}#portrait{position:fixed;bottom:2%;display:none}@media(orientation:portrait){#portrait{display:block}}
</style><div id="wrap"><main><header><b>秘境・武器狂潮</b><span id="clock">10:00</span><span id="health">HP 100</span><span id="hpbar"><i id="hpfill"></i></span><span id="kills">擊破 0</span><button id="sound">音量</button></header><div id="mid"><aside><b>九宮格武器召喚</b><div id="slots"></div><div id="loadout"></div><div id="combo">連擊 0</div></aside><div id="arena"><canvas id="field" width="960" height="540"></canvas><div id="news">答對召喚武器，移動躲避怪物</div><div id="controls"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="dash">空白鍵・閃避</button></div></div><section id="question"><div id="status"></div><div id="prompt"></div><div id="answers"></div></section><div id="audio" hidden><label>配樂 <input id="music" type="range" min="0" max="100" value="45"></label><label>音效 <input id="fx" type="range" min="0" max="100" value="65"></label><button id="close">關閉</button></div><div id="cover"><div><p>STAGE 16 ◆ SURVIVAL ARCADE</p><h1>數學秘境：武器狂潮</h1><p>答對召喚武器，自動攻擊，移動閃避怪物。</p><p>勝利：生存至時間結束後擊敗魔王。失敗：主角 HP 歸零。</p><select id="unit"><option>正負數運算</option><option>整數四則</option><option>分數四則</option><option>指數律</option><option>一元一次式</option><option>一元一次方程式</option></select> <select id="level"><option>初階</option><option>進階</option></select> <select id="group"><option>第一組</option><option>第二組</option><option>第三組</option><option>第四組</option></select> <select id="duration"><option value="180">3分鐘試玩</option><option value="600">10分鐘正式</option></select><p><button id="start">開始秘境</button></p><p>方向鍵／觸控移動・空白鍵閃避・1～4答題</p></div></div></main><span id="portrait">建議橫向遊玩</span></div><script>
const $=id=>document.getElementById(id),ctx=$('field').getContext('2d'),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const names=['飛劍','火球','雷電','冰刃','護盾','神龍'],symbols=['◆','●','ϟ','✦','⬟','龍'],cols=['#dceaff','#ff8a4a','#ffe47a','#85e2ff','#9beaa9','#f2a0e6'];let levels=[1,0,0,0,0,0],slots=[0,1,2,3,4,5,2,0,1],keys=new Set(),state='idle',hp=100,p={x:480,y:270},enemies=[],effects=[],last=0,elapsed=0,duration=180,spawnAt=0,attack=[0,0,0,0,0,0],hurtAt=-100,dashAt=-100,kills=0,streak=0,correct=0,total=0,question,deadline=0,nextQ=0,answering=false,bossAdded=false,bossDead=false,seen=new Set(),ac,beat=0,musicAt=0,rollUntil=0,lastCause='',noticeUntil=0;
function qgen(){let a=rand(2,9),b=rand(2,8),c=rand(2,9),hard=$('level').selectedIndex===1,u=$('unit').selectedIndex,p,v,fmt=x=>x<0?'('+x+')':x;if(u===0){a=rand(-15,15);b=rand(-12,12);p=hard?`${fmt(a)} − ${fmt(b)} + ${c}`:`${fmt(a)} + ${fmt(b)}`;v=hard?a-b+c:a+b}else if(u===1){p=hard?`${a} × (${b} − ${c}) + 4`:`${a} + ${b} × ${c}`;v=hard?a*(b-c)+4:a+b*c}else if(u===2){let den=rand(3,9);p=hard?`${a}/${den} − ${b}/${den} = □/${den}`:`${a}/${den} + ${b}/${den} = □/${den}`;v=hard?a-b:a+b}else if(u===3){p=hard?`(2^${a})^${b} = 2^□`:`2^${a} × 2^${b} = 2^□`;v=hard?a*b:a+b}else if(u===4){p=hard?`${a}(x + ${c}) − ${b}x = □x + ${a*c}`:`${a}x + ${b}x = □x`;v=hard?a-b:a+b}else{p=hard?`${a}(x + ${b}) = ${a*(c+b)}，x = ?`:`${a}x + ${b} = ${a*c+b}，x = ?`;v=c}let opts=[v];while(opts.length<4){let n=v+rand(-8,8);if(!opts.includes(n))opts.push(n)}for(let i=3;i>0;i--){let j=rand(0,i);[opts[i],opts[j]]=[opts[j],opts[i]]}return{p,v,opts}}

function tone(f,d=.12,kind='triangle',vol=.06,music=false){if(!ac)return;try{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=kind;o.frequency.value=f;g.gain.setValueAtTime(Math.max(.0001,vol*+$(music?'music':'fx').value/100),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch{}}
function news(s){$('news').textContent=s;noticeUntil=elapsed+3}function drawSlots(matches=[]){$('slots').innerHTML='';slots.forEach((v,i)=>{let b=document.createElement('div');b.className='slot'+(matches.includes(i)?' match':'');b.style.color=cols[v];let a=document.createElement('b');a.textContent=symbols[v];let n=document.createElement('small');n.textContent=names[v];b.append(a,n);$('slots').append(b)});$('loadout').textContent=levels.map((n,i)=>n?names[i]+' Lv.'+n:'').filter(Boolean).join('・')}
function ask(){for(let i=0;i<80;i++){question=qgen();if(!seen.has(question.p))break}seen.add(question.p);answering=true;deadline=elapsed+($('level').selectedIndex?25:30);$('prompt').textContent=question.p.replace(/\^(\d+|□)/g,(_,n)=>[...n].map(x=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+x]||'□').join(''));$('answers').innerHTML='';question.opts.forEach((n,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'　'+n;b.onclick=()=>answer(i);$('answers').append(b)})}
function answer(i){if(state!=='run'||!answering)return;answering=false;total++;document.querySelectorAll('#answers button').forEach(b=>b.disabled=true);if(question.opts[i]===question.v){correct++;streak++;slots=Array.from({length:9},()=>Math.random()<.045?5:rand(0,4));let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],matches=lines.filter(l=>l.every(j=>slots[j]===slots[l[0]])),counts=names.map((_,j)=>slots.filter(k=>k===j).length),w=counts.indexOf(Math.max(...counts));levels[w]=Math.min(5,levels[w]+1);matches.forEach(l=>{let j=slots[l[0]];levels[j]=Math.min(5,levels[j]+1)});if(streak%5===0){hp=Math.min(100,hp+12);effects.push({x:p.x,y:p.y,r:250,t:elapsed,kind:2});enemies.forEach(e=>e.h-=35);news('五連擊！全場雷爆＋回血')}else news(matches.length?'連線進化！'+matches.length+' 條連線':'召喚成功：'+names[w]+' Lv.'+levels[w]);drawSlots(matches.flat());rollUntil=elapsed+.45;tone(660,.16);tone(880,.3);nextQ=elapsed+.7}else{streak=0;news('答錯／超時，正確答案 '+question.v+'；不直接扣血');tone(130,.25,'sawtooth');nextQ=elapsed+2} $('combo').textContent='連擊 '+streak+' ｜ 答對 '+correct}
function spawn(boss=false){let side=rand(0,3),x=side===0?-20:side===1?980:rand(0,960),y=side===2?-20:side===3?560:rand(0,540),type=rand(0,2),h=boss?720:20+Math.floor(elapsed/25)*5+type*8;enemies.push({x,y,h,max:h,type,boss,speed:boss?38:40+type*18+Math.min(35,elapsed*.1),slow:0})}
function dodge(){if(state==='run'&&elapsed-dashAt>=4){dashAt=elapsed;news('閃避！短暫無敵');tone(250,.2)}}
function hit(e,d){e.h-=d;effects.push({x:e.x,y:e.y,r:18,t:elapsed,kind:0})}
function weaponsTick(){let living=enemies.filter(e=>e.h>0);if(!living.length)return;let sorted=living.slice().sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));levels.forEach((lv,k)=>{if(!lv||k===4||elapsed<attack[k])return;attack[k]=elapsed+Math.max(.28,[.85,1.35,1.7,1.2,1,2.2][k]-.09*lv);let target=sorted[0],near=sorted.filter(e=>Math.hypot(e.x-p.x,e.y-p.y)<160+lv*35);if(k===0){near.slice(0,lv+1).forEach(e=>{hit(e,12+lv*9);effects.push({x:e.x,y:e.y,ox:p.x,oy:p.y,t:elapsed,kind:0,r:25})})}if(k===1){living.filter(e=>Math.hypot(e.x-target.x,e.y-target.y)<45+lv*16).forEach(e=>hit(e,16+lv*8));effects.push({x:target.x,y:target.y,r:45+lv*16,t:elapsed,kind:1})}if(k===2){sorted.slice(0,lv+1).forEach(e=>{hit(e,24+lv*10);effects.push({x:e.x,y:e.y,r:40,t:elapsed,kind:2})})}if(k===3){near.forEach(e=>{e.slow=elapsed+1.5;hit(e,9+lv*6)});effects.push({x:p.x,y:p.y,r:120+lv*20,t:elapsed,kind:3})}if(k===5){sorted.slice(0,lv*2+2).forEach(e=>hit(e,30+lv*12));effects.push({x:target.x,y:target.y,r:100+lv*15,t:elapsed,kind:5})}if(near.length)tone(170+k*70,.08,'triangle',.025)})}
function end(win){state='end';let score=Math.round(correct/Math.max(1,total)*500+Math.min(1,elapsed/duration)*200+(win?200:0)+Math.max(0,hp));let g=$('group').value,key='weapon-scores-'+$('unit').selectedIndex+'-'+$('level').selectedIndex+'-'+duration,rank=[];try{rank=JSON.parse(localStorage.getItem(key)||'[]');rank=rank.filter(a=>a.g!==g||a.score>score);if(!rank.some(a=>a.g===g))rank.push({g,score});rank.sort((a,b)=>b.score-a.score);localStorage.setItem(key,JSON.stringify(rank))}catch{}$('cover').innerHTML='<div><h1>'+(win?'秘境通關！':'挑戰失敗')+'</h1><p>'+(win?'已生存至終點並擊敗魔王':'主角 HP 歸零：'+lastCause)+'</p><p>答對 '+correct+'/'+total+' 題｜擊破 '+kills+'｜得分 '+score+'</p><p>'+rank.map((a,i)=>(i+1)+'. '+a.g+' '+a.score).join('　')+'</p><button onclick="location.reload()">返回首頁／下一組</button></div>';$('cover').classList.remove('hidden');tone(win?880:100,.8)}
function tick(dt){elapsed+=dt;let dx=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0),dy=(keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0),len=Math.hypot(dx,dy)||1,s=elapsed-dashAt<.35?440:185;p.x=Math.max(22,Math.min(938,p.x+dx/len*s*dt));p.y=Math.max(22,Math.min(518,p.y+dy/len*s*dt));if(elapsed>=duration&&!bossAdded){bossAdded=true;spawn(true);news('最終魔王降臨！擊敗它即可勝利！');tone(65,.8,'sawtooth')}if(elapsed>=spawnAt&&enemies.length<85){spawnAt=elapsed+Math.max(.65,($('level').selectedIndex?1.7:2.5)-elapsed*.003);spawn()}if(answering&&elapsed>=deadline)answer(-1);if(!answering&&elapsed>=nextQ)ask();weaponsTick();for(let e of enemies){if(e.h<=0)continue;let x=p.x-e.x,y=p.y-e.y,d=Math.hypot(x,y)||1,m=e.speed*(e.slow>elapsed?.35:1);if(d>13){e.x+=x/d*m*dt;e.y+=y/d*m*dt}if(d<(e.boss?46:27)&&elapsed-hurtAt>1.1&&elapsed-dashAt>.55){hurtAt=elapsed;let loss=Math.max(2,(e.boss?22:9)-levels[4]*1.5);hp=Math.max(0,hp-loss);lastCause=e.boss?'魔王撞擊':'怪物接觸';news(lastCause+' −'+loss+' HP');tone(90,.23,'sawtooth')}}for(let e of enemies.filter(e=>e.h<=0)){kills++;if(e.boss)bossDead=true}enemies=enemies.filter(e=>e.h>0);effects=effects.filter(e=>elapsed-e.t<.4);if(hp<=0){end(false);return}if(bossDead){end(true);return}if(elapsed>=musicAt){musicAt=elapsed+.32;let notes=[146,220,293,261,130,196,261,220];tone(notes[beat++%8]*(bossAdded?1.2:1),.28,'triangle',.035,true);if(beat%4===0)tone(65,.4,'sine',.05,true)}let rem=Math.max(0,Math.ceil(duration-elapsed));$('clock').textContent=bossAdded?'魔王決戰':Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');$('health').textContent='HP '+Math.ceil(hp);$('hpfill').style.width=hp+'%';$('hpfill').style.background=hp<30?'#ff6464':'#80d79b';$('kills').textContent='擊破 '+kills;$('status').textContent=answering?'召喚題 · 剩 '+Math.max(0,Math.ceil(deadline-elapsed))+' 秒':'武器召喚／答案回饋';if(noticeUntil<elapsed)$('news').textContent=bossAdded?'擊敗魔王即可通關':'移動閃避 · 答題強化武器'}
function draw(){let c=ctx;c.fillStyle=bossAdded?'#3d2337':'#263b3f';c.fillRect(0,0,960,540);for(let y=0;y<540;y+=36)for(let x=0;x<960;x+=36){c.fillStyle=(x/36+y/36)%2?'#ffffff05':'#00000012';c.fillRect(x,y,35,35)}for(let i=0;i<35;i++){let x=i*137%960,y=i*83%540;c.fillStyle='#62806a55';c.fillRect(x,y,8,3)}function character(x,y,size,color,enemy=false){c.save();c.translate(x,y);c.scale(size,size);c.fillStyle='#11182888';c.beginPath();c.ellipse(0,8,12,5,0,0,7);c.fill();c.fillStyle='#17242e';c.fillRect(-9,-12,18,22);c.fillStyle=color;c.fillRect(-8,-10,16,15);c.fillStyle=enemy?'#ad9770':'#f0cba0';c.fillRect(-6,-21,12,10);c.fillStyle=color;c.fillRect(-8,-24,16,7);c.fillStyle='#222437';c.fillRect(-4,-17,3,2);c.fillRect(3,-17,3,2);c.fillStyle='#d4e3ef';c.fillRect(10,-12,3,20);c.restore()}for(let e of enemies){character(e.x,e.y,e.boss?3:1.25,e.boss?'#da6249':['#a9bd65','#b87a9b','#8b9ac1'][e.type],true);c.fillStyle='#392a35';c.fillRect(e.x-18,e.y-(e.boss?76:35),36,4);c.fillStyle='#fa8066';c.fillRect(e.x-18,e.y-(e.boss?76:35),36*e.h/e.max,4)}character(p.x,p.y,1.55,elapsed-hurtAt<.18?'#ff7b7b':'#6bd2e7');if(levels[4]||elapsed-dashAt<.55){c.strokeStyle='#8af9bc';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,27+levels[4]*2,0,7);c.stroke()}for(let e of effects){let k=1-(elapsed-e.t)/.4;c.globalAlpha=Math.max(0,k);c.strokeStyle=cols[e.kind];c.lineWidth=5;if(e.ox!==undefined){c.beginPath();c.moveTo(e.ox,e.oy);c.lineTo(e.x,e.y);c.stroke()}else if(e.kind===2){c.beginPath();c.moveTo(e.x-15,0);c.lineTo(e.x+15,e.y/2);c.lineTo(e.x,e.y);c.stroke()}else{c.beginPath();c.arc(e.x,e.y,e.r*(1.2-k*.4),0,7);c.stroke()}c.globalAlpha=1}if(elapsed-hurtAt<.2){c.strokeStyle='#ff5555';c.lineWidth=12;c.strokeRect(0,0,960,540)}if(state==='idle'){character(670,310,4,'#6bd2e7');character(810,270,4,'#c15e55',true)}}
function frame(t){let dt=Math.min(.05,(t-(last||t))/1000);last=t;if(state==='run'&&!document.hidden)tick(dt);draw();requestAnimationFrame(frame)}
$('start').onclick=()=>{try{ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}duration=+$('duration').value;state='run';$('cover').classList.add('hidden');drawSlots();ask()};$('sound').onclick=()=>{$('audio').hidden=!$('audio').hidden};$('close').onclick=()=>{$('audio').hidden=true};$('dash').onclick=dodge;document.addEventListener('keydown',e=>{if(state!=='run'||['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key.startsWith('Arrow')||e.code==='Space')e.preventDefault();keys.add(e.key);if(e.code==='Space'&&!e.repeat)dodge();if(['1','2','3','4'].includes(e.key)&&!e.repeat)answer(+e.key-1)});document.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});drawSlots();requestAnimationFrame(frame);
</script></html>
