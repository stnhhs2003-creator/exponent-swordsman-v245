 else {let m=rnd(-12,12),n=rnd(-9,9)||2;op=pick(['+','−','×']);if(d===2){q='('+m+' '+op+' ('+n+')) × '+c;v=(op==='+'?m+n:op==='−'?m-n:m*n)*c}else{q=m+' '+op+' ('+n+')';v=op==='+'?m+n:op==='−'?m-n:m*n}wrong=[-v,v+1,v-2];ex='先算括號，再依正負號與運算順序計算。'}

}
