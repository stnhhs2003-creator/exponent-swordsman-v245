function spawn(){cars=[];for(let y of roadRows){if(stage===0&&y===3)continue;let dir=y%2?1:-1,n=stage===0?2:3,kind=(y===5||y===8)&&stage>0?'stone':'car';for(let i=0;i<n;i++)cars.push({x:-1+i*(15/n)+R(0,10)/10,y,len:kind==='stone'?1.9:1.4,speed:dir*(1.35+stage*.42+level*.35+(y%3)*.13),kind,color:colors[(i+y)%4]})}}
function hud(){ $('stage').textContent=stageNames[stage]+'｜'+(stage===2?'連對 '+combo+'/5':(count+1)+'/4');$('life').textContent='❤️'.repeat(Math.max(0,life))+'♡'.repeat(Math.max(0,3-life));$('stars').textContent='⭐ '+stars;$('clock').textContent='⏱ '+Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0')}
function question(){let u=$('unit').value;for(let i=0;i<150;i++){q=make(u==='mix'?pick(units):u,stage+level);if(!seen.has(q.s+'|'+q.ans))break}seen.add(q.s+'|'+q.ans);$('q').innerHTML=q.s;$('gates').replaceChildren();gateLabels=q.opts.map(v=>{let e=document.createElement('div');e.className='gate';e.innerHTML=v;$('gates').append(e);return e});placeGates();p={x:6,y:9};immune=1.6;jumpCD=0;jumpUntil=0;hold=null;spawn();$('notice').textContent='穿越車道，到達正確答案入口！';hud();resize()}
function panel(title,detail,action,caption='繼續'){phase='panel';hold=null;$('headline').textContent=title;$('detail').innerHTML=detail;$('continue').textContent=caption;$('continue').onclick=()=>{$('overlay').classList.add('hide');action()};$('overlay').classList.remove('hide')}
function finish(win){audio(win?'win':'bad');panel(win?'🏆 全員勝利！':'挑戰結束','獲得 '+stars+' 顆星星。'+(win?'成功穿越奇幻道路！':'重新挑戰，找出正確答案！'),start,'再玩一次')}
function lose(reason,wrong=false){if(phase!=='play')return;life--;if(stage===2&&wrong)combo=0;audio('bad');hud();if(life<=0){finish(false);return}if(wrong){panel('答錯了！','正解：<b>'+q.ans+'</b><p>'+q.why+'</p>',()=>{phase='play';question()})}else{p={x:6,y:9};immune=2.1;jumpUntil=0;hold=null;$('notice').textContent=reason+'，返回安全起點！'}}
function arrive(){if(phase!=='play')return;let idx=gateCols.reduce((best,x,i)=>Math.abs(x-p.x)<Math.abs(gateCols[best]-p.x)?i:best,0);if(Math.abs(gateCols[idx]-p.x)>1.35){p.y=1;return}if(q.opts[idx]!==q.ans){lose('答案錯誤',true);return}stars++;audio('good');if(stage===2){combo++;if(combo>=5){finish(true);return}}else{count++;if(count>=4){stage++;count=0;panel('✨ 區域通關！','下一區：'+stageNames[stage],()=>{phase='play';question()},'進入下一區');return}}panel('⭐ 答對了！','正解：<b>'+q.ans+'</b><p>'+q.why+'</p>',()=>{phase='play';question()},'下一題')}
function step(dir,jump=false){if(phase!=='play')return;if(jump){if(jumpCD>0)return;jumpCD=1.15;jumpUntil=performance.now()+420;audio('jump')}else if(performance.now()<jumpUntil)return;let dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0;p.x=clamp(p.x+dx,.2,11.8);p.y=clamp(p.y+dy,0,9);if(p.y===0)arrive()}
function frame(now){let dt=Math.min(.05,(now-(last||now))/1000);last=now;if(phase==='play'){time=Math.max(0,time-dt);if(!time){finish(false)}else{immune=Math.max(0,immune-dt);jumpCD=Math.max(0,jumpCD-dt);$('jump').innerHTML=jumpCD>0?'冷卻<br>'+jumpCD.toFixed(1)+'秒':'跳躍<br>↟';if(hold&&now>=nextMove){step(hold);nextMove=now+165}if(phase==='play'){for(let c of cars){c.x+=c.speed*dt;if(c.x>14)c.x=-2;if(c.x<-2)c.x=14}if(immune===0&&now>=jumpUntil&&cars.some(c=>Math.abs(p.y-c.y)<.3&&Math.abs(p.x-c.x)<(c.len/2+.23)))lose('被障礙撞到');hud()}}}draw(now);raf=requestAnimationFrame(frame)}
function start(){audio('jump');hero=+$('hero').value;level=+$('difficulty').value;document.body.classList.toggle('screen',$('mode').value==='screen');stage=count=combo=stars=0;life=3;time=600;seen.clear();$('home').classList.add('hide');$('game').classList.remove('hide');$('overlay').classList.add('hide');phase='play';question();if(!raf)raf=requestAnimationFrame(frame)}
function home(){phase='home';hold=null;$('home').classList.remove('hide');$('game').classList.add('hide');$('overlay').classList.add('hide')}
$('start').onclick=start;$('back').onclick=home;$('homeBtn').onclick=home;$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'♫ OFF':'♫ ON';audio('good')};$('jump').onclick=()=>step('up',true);for(let b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();audio('tap');hold=b.dataset.dir;step(hold);nextMove=performance.now()+300;try{b.setPointerCapture(e.pointerId)}catch(e){}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{hold=null});b.addEventListener('click',e=>{if(e.detail===0)step(b.dataset.dir)})}let keys={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};addEventListener('keydown',e=>{if(phase!=='play')return;if(e.key===' '){e.preventDefault();if(!e.repeat)step('up',true)}else if(keys[e.key]){e.preventDefault();if(!e.repeat){hold=keys[e.key];step(hold);nextMove=performance.now()+300}}});addEventListener('keyup',e=>{if(keys[e.key]===hold)hold=null});addEventListener('blur',()=>hold=null);let swipe=null;cv.addEventListener('pointerdown',e=>{swipe=[e.clientX,e.clientY];try{cv.setPointerCapture(e.pointerId)}catch(e){}});cv.addEventListener('pointerup',e=>{if(!swipe)return;let x=e.clientX-swipe[0],y=e.clientY-swipe[1];swipe=null;if(Math.hypot(x,y)>15)step(Math.abs(x)>Math.abs(y)?x>0?'right':'left':y>0?'down':'up')});cv.addEventListener('pointercancel',()=>swipe=null);addEventListener('resize',resize);if(typeof ResizeObserver==='function')new ResizeObserver(resize).observe($('field'));let url=new URLSearchParams(location.search);if([...$('unit').options].some(o=>o.value===url.get('unit')))$('unit').value=url.get('unit');if(url.get('mode')==='screen')$('mode').value='screen';
</script></body></html>
