<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學幻境｜AI 遊戲製作工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#101a2e;color:#edf3ff;font:16px system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{color:#ffe1a5}a{color:#a9ddff}section{background:#202e48;border:1px solid #536583;padding:16px;border-radius:16px;margin:12px 0}label{display:block;margin:12px 0 5px}input,select,textarea,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #8192ac}input,select,textarea{width:100%;background:#142339;color:white}button{background:#eace93;color:#19263b;font-weight:800;cursor:pointer}button.secondary{background:#344762;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.grid label{margin:0}.checks label{display:flex;align-items:center;gap:8px}.checks input{width:auto}textarea{min-height:240px}small{color:#b9c8dc}.bar{display:flex;gap:8px;flex-wrap:wrap}</style><main><a href="../game-center/">學生遊戲中心</a>　｜　<a href="../asset-library/">素材選擇中心</a><h1>AI 遊戲製作工作台</h1><p>國中數學・教室大屏優先・保留既有特色。快速設定新遊戲或改版，產生可交給 ChatGPT／Codex 的完整製作指令。</p><section><h2>01　專案與玩法</h2><div class="grid"><label>遊戲編號<input id="number" value="13"></label><label>名稱<input id="name" placeholder="新遊戲名稱"></label><label>玩法<select id="kind"><option>冒險打怪</option><option>雙人對戰</option><option>射擊闖關</option><option>大富翁</option><option>翻牌配對</option><option>過馬路</option><option>迷宮解謎</option><option>自訂</option></select></label><label>美術風格<select id="style"><option>奇幻武俠</option><option>Q版萌系</option><option>科幻機甲</option><option>希臘神話</option><option>深海冒險</option><option>現代城市</option></select></label></div></section><section><h2>02　數學與挑戰</h2><div class="checks" id="units"></div><div class="grid"><label>難度<select id="level"><option>普通</option><option>困難</option><option>簡單</option></select></label><label>時間（分鐘）<input id="minutes" type="number" min="1" max="30" value="10"></label><label>生命值<input id="life" value="3 命（依玩法調整）"></label><label>過關條件<input id="victory" value="由易到難，最終關連續答對五題"></label></div></section><section><h2>03　素材配置</h2><p><a href="../asset-library/" target="_blank" rel="noopener">開啟素材庫挑選</a>　<a href="https://larch.ink/" target="_blank" rel="noopener">Larch 素材來源</a></p><div class="grid"><label>主角素材編號／名稱<input id="hero" placeholder="例如 CH-008"></label><label>背景素材編號／名稱<input id="bg" placeholder="例如 BG-013"></label><label>配樂<select id="music"><option>BGM-001 晨光小徑</option><option>BGM-002 星穹十二神殿</option><option>依關卡切換</option><option>自訂或靜音</option></select></label><label>敵人／魔王<input id="boss" placeholder="保留原魔王或指定素材"></label></div><label>特殊技能／附加需求<textarea id="extra" style="min-height:80px" placeholder="例如雙模式、蓄力攻擊、勝利立繪"></textarea></label></section><section><h2>04　製作與驗收</h2><div class="checks" id="features"></div><div class="bar"><button id="generate">產生製作指令</button><button id="save" class="secondary">儲存本機設定</button><button id="load" class="secondary">載入設定</button></div><label>完整製作指令</label><textarea id="output" readonly></textarea><div class="bar"><button id="copy">複製指令</button><button id="download" class="secondary">匯出設定 JSON</button></div><p id="status" role="status"></p><small>工作台產生設定，不會自動生成或部署遊戲；外部工具必須先經十項安全檢查。</small></section></main><script>const $=s=>document.getElementById(s),units=['指數律','分數四則','一元一次式','一元一次方程式','最大公因數與最小公倍數','正負數四則','因數倍數與質數','混合複習'],features=['教室大屏等比例','iPhone Safari 觸控','圖像選角與場景預覽','配樂音效獨立音量','答錯詳解','保留原版與魔王模式','勝利立繪與特效','GitHub Pages 測試後部署'];for(let [id,arr] of [['units',units],['features',features]])for(let v of arr){let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=v;i.checked=true;l.append(i,document.createTextNode(v));$(id).append(l)}let ids=['number','name','kind','style','level','minutes','life','victory','hero','bg','music','boss','extra'];function data(){return {...Object.fromEntries(ids.map(i=>[i,$(i).value])),units:[...$('units').querySelectorAll(':checked')].map(i=>i.value),features:[...$('features').querySelectorAll(':checked')].map(i=>i.value)}}function generate(){let d=data();$('output').value='請製作／更新第 '+d.number+' 款國中數學遊戲《'+(d.name||'待命名')+'》。\n玩法：'+d.kind+'；風格：'+d.style+'。\n單元：'+d.units.join('、')+'。\n預設難度：'+d.level+'；每局 '+d.minutes+' 分鐘；'+d.life+'。\n過關：'+d.victory+'。\n主角：'+(d.hero||'從素材庫挑選')+'；背景：'+(d.bg||'從素材庫挑選')+'；配樂：'+d.music+'；魔王：'+(d.boss||'依原本玩法保留')+'。\n要求：'+d.features.join('、')+'。\n其他：'+d.extra+'。\n分數上下排列、指數上標，同局避免重題。先保留舊版；第三方素材確認授權，開源工具先完成十項安全檢查並取得同意。完成實際操作測試後部署，不得將語法檢查視為實機驗收。';return d}$('generate').onclick=generate;$('save').onclick=()=>{try{localStorage.setItem('math-workbench',JSON.stringify(generate()));$('status').textContent='已儲存於此瀏覽器'}catch(e){$('status').textContent='無法儲存，請匯出 JSON'}};$('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem('math-workbench'));if(!d)return;ids.forEach(i=>{if(d[i]!=null)$(i).value=d[i]});for(let k of ['units','features'])$(k).querySelectorAll('input').forEach(i=>i.checked=d[k].includes(i.value));generate();$('status').textContent='設定已載入'}catch(e){$('status').textContent='無可用設定'}};$('copy').onclick=async()=>{generate();try{await navigator.clipboard.writeText($('output').value);$('status').textContent='已複製'}catch(e){$('output').select();$('status').textContent='請手動複製選取文字'}};$('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(generate(),null,2)],{type:'application/json'}));a.download='math-game-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};generate()</script></html>
