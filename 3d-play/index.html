function tick(dt){if(mode==='transition'&&tim>readyTime){stageUp();return}if(mode!=='play')return;let dx=input();player.x=clamp(player.x+dx*5.2*dt,-10.5,10.4);if(dx)player.face=dx;let prev=player.y;player.vy-=22*dt;player.y+=player.vy*dt;let landing=collidePlatform(prev,player.y,player.x);if(landing!==null&&player.vy<=0){player.y=landing;player.vy=0}else if(player.y<=0){player.y=0;player.vy=0}if(energy<100)energy+=dt*3.2;for(let i=shots.length-1;i>=0;i--){let sh=shots[i];sh.x+=sh.vx*dt;sh.life-=dt;let hit=targets.find(t=>Math.abs(sh.x-t.x)<.7&&Math.abs(sh.y-(t.y+1.04))<1.25);if(hit){shots.splice(i,1);for(let k=0;k<10;k++)sparks.push({x:hit.x+(Math.random()-.5),y:hit.y+1+Math.random(),z:0,size:.05+Math.random()*.12,c:[1,.7,.22],life:.5});if(hit.n===question.ans)solved();else wrong(hit);break}if(sh.life<0||Math.abs(sh.x)>13)shots.splice(i,1)}const hazard=stage===2?Math.min(1,.65+combo*.06):stage===1?.4+index*.05:index*.03;if(tim>nextEnemyShot&&mode==='play'){nextEnemyShot=tim+Math.max(2.1,5-hazard*2);let spawn=stage===2?8.5:8.6;let heavy=stage===2&&(Math.round(tim)%3===0);enemyShots.push({x:spawn,y:heavy?.8:1.06,z:-.1,vx:-(3.6+hazard*2.5),heavy});announce(heavy?'⚠ 魔王重彈！快跳起躲避':'⚠ 敵方飛彈來襲',.75)}for(let i=enemyShots.length-1;i>=0;i--){let sh=enemyShots[i];sh.x+=sh.vx*dt;if(sh.x<-13){enemyShots.splice(i,1);continue}if(Math.abs(sh.x-player.x)<.47&&Math.abs(sh.y-(player.y+1))<.82&&tim>hitUntil){enemyShots.splice(i,1);hitUntil=tim+1.25;if(sh.heavy){lives--;hp=100;announce('重彈擊中！失去一命');tone(120,.3,'sawtooth',.15)}else {hp-=stage===2?34:stage===1?27:18;announce('遭到敵人攻擊！');tone(170,.12,'sawtooth',.12)}if(hp<=0){lives--;hp=100}if(lives<=0){mode='lost';end('挑戰失敗','先觀察彈道預警，再以跳躍躲避攻擊。')}setHUD()}}for(let i=sparks.length-1;i>=0;i--){sparks[i].life-=dt;sparks[i].y+=dt*.75;if(sparks[i].life<0)sparks.splice(i,1)}if(Math.floor(tim*4)!==Math.floor((tim-dt)*4))setHUD()}
function render(now){const sceneNow=now*.001;let dt=last?Math.min(.034,(now-last)/1000):.016;last=now;tim+=dt;if(mode==='play'||mode==='transition')tick(dt);castle(tim,scene);answers3D(tim);if(mode!=='menu'&&mode!=='win'&&mode!=='lost'){humanoid(player.x,player.y,.38,hero,tim,Math.abs(input())>.1&&player.y===0?'run':tim<shoulder?'attack':'idle');foe(tim)}else{humanoid(-3.9,0,.55,hero,tim);boss(tim,1)}beam(tim);if(mode==='play')updateAnswerPositions();if(bannerAt&&performance.now()/1000>bannerAt){bannerAt=0;$('toast').classList.remove('show')}raf=requestAnimationFrame(render)}
function downButton(id,fn,up){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('held');fn()});const release=()=>{el.classList.remove('held');if(up)up()};for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,release);return release}
const releaseL=downButton('left',()=>touchLeft=true,()=>touchLeft=false),releaseR=downButton('right',()=>touchRight=true,()=>touchRight=false);downButton('jump',jump);downButton('attack',attack);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','KeyJ','KeyF'].includes(e.code))e.preventDefault();if(keys[e.code])return;keys[e.code]=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();if(e.code==='KeyJ'||e.code==='KeyF')attack();if((e.code==='ArrowDown'||e.code==='KeyS')&&mode==='play'){let p=standingPlatform(player.x,player.y);if(p){player.y-=.2;player.vy=-2}}});window.addEventListener('keyup',e=>keys[e.code]=false);const reset=()=>{keys={};touchLeft=false;touchRight=false;releaseL();releaseR()};window.addEventListener('blur',reset);window.addEventListener('pagehide',reset);window.addEventListener('orientationchange',()=>{reset();resize()});document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});window.addEventListener('resize',resize);
window.addEventListener('error',e=>{console.error(e.error||e.message)});resize();makeMenu();requestAnimationFrame(render);
})();
