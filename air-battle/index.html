function audioInit(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();return audio}catch(e){return null}}
function tone(freq,duration,kind="sine",vol=.05,delay=0){if(!sound||vol<=0)return;let c=audioInit();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+delay;o.type=kind;o.frequency.setValueAtTime(freq,n);g.gain.setValueAtTime(Math.max(.0001,vol),n);g.gain.exponentialRampToValueAtTime(.0001,n+duration);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+duration+.01)}catch(e){}}
