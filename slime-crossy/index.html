;if(!seen.has(key))break;a=R(2,12);b=R(2,12);d=R(2,12)}seen.add(key);if(!opts)opts=[ans,Number(ans)+1,Number(ans)+2,Number(ans)-1];return{txt,ans:String(ans),opts:mix(opts.map(String))}}function tone(f=440,len=.12,vol=.05){if(!audio||silent)return;let o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(v);v.connect(audio.destination);o.start();o.stop(t+len)}function startMusic(){clearInterval(musicTimer);if(silent)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let notes=[262,330,392,440,392,330,294,349,392,349,330,294];musicTimer=setInterval(()=>{if(active)tone(notes[step++%notes.length],.25,.025)},300)}catch(e){}}function fresh(){q=question();$('question').innerHTML=q.txt;x=480;y=500;locked=false;safe=performance.now()+650;lanes=Array.from({length:4},(_,i)=>({y:150+i*84,dir:i%2?-1:1,speed:(90+i*23+diff*35+score*9),cars:Array.from({length:2+(i%2)},(_,j)=>({x:j*370+R(-40,70),color:pick(['#e36a5f','#f1bf56','#60bde4','#af8ce2'])}))}));hud()}function hud(){$('hp').textContent='生命 '+('♥'.repeat(life));$('score').textContent='答對 '+score+(mode==='adventure'?'/10':'');$('clock').textContent=mode==='race'?'剩餘 '+Math.max(0,Math.ceil((deadline-Date.now())/1000))+' 秒':score>=7?'最終加速挑戰':'冒險闖關'}function start(){cancelAnimationFrame(af);life=3;score=0;diff=+$('difficulty').value;mode=$('mode').value;silent=$('music').value==='0';seen.clear();particles=[];deadline=Date.now()+120000;active=true;$('home').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');$('hint').textContent='穿越車道，走到正確答案門！';fresh();last=performance.now();startMusic();af=requestAnimationFrame(frame)}function back(){active=false;cancelAnimationFrame(af);clearInterval(musicTimer);$('game').classList.add('hidden');$('end').classList.add('hidden');$('home').classList.remove('hidden')}function
