function urgentResult(good,now){emergency=false;shield=false;let b=emergencyBoss;if(good){if(b){b.stun=now+3000;b.h=Math.max(1,b.h-b.max*.12)}fx('upgrade');news('破解成功！魔王暈眩，全軍反擊！');skillAt=now;skillKind=0}else{let loss=wave===5?15:25;hp=Math.max(0,hp-loss);castImpact=now;if(wave===5)frozenUntil=now+5000;else army.forEach(a=>a.h=Math.max(0,a.h-a.max*.25));fx('bad');news('魔王必殺！城堡 −'+loss+'%')}if(b)b.castNext=now+12000;emergencyBoss=null;pendingQuestion=now+900}
answer=function(i){if(phase==='reward'){chooseReward(i);return}if(phase!=='battle'||!liveQuestion)return;let now=performance.now(),good=question.opts[i]===question.v;liveQuestion=false;totalQuestions++;document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);if(good){correct++;streak++;energy=Math.min(6,energy+1);fx('good');if(emergency){urgentResult(true,now)}else{slots=Array.from({length:9},()=>Math.random()<.04?5:Math.random()<.09?4:rand(0,3));drawSlots();let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],matches=lines.filter(l=>l.every(k=>slots[k]===slots[l[0]]));let counts=names.map((_,k)=>slots.filter(x=>x===k).length),kind=counts.indexOf(Math.max(...counts));liveSpawn(kind);matches.forEach(l=>{liveSpawn(slots[l[0]]);l.forEach(k=>$('slots').children[k].classList.add('match'))});if(streak%2===0)liveSpawn(kind);if(slots.includes(5))liveSpawn(5);else if(slots.includes(4))liveSpawn(4);if(streak%5===0){foes.forEach(e=>e.h=Math.max(e.boss?1:0,e.h-35));ultimateAt=now;news('五連擊！全軍總攻擊！')}else news(matches.length?'連線召喚！精英援軍加入':'答對！'+names[kind]+'立即加入');pendingQuestion=now+650}}else{streak=0;fx('bad');if(emergency)urgentResult(false,now);else pendingQuestion=now+1800;$('status').textContent='正確答案：'+question.v}update();$('formation').disabled=false}
ask=liveWave;
const previousReward=chooseReward;chooseReward=function(i){if(phase!=='reward'||i<0||i>2)return;if(i===0)hp=Math.min(100,hp+20);if(i===1){bonus*=1.15;gear='傳說炎刃'}if(i===2){gear='聖光徽章';liveSpawn(5);liveSpawn(2)}wave++;liveWave()};
function liveTick(t){if(phase!=='battle')return;let dt=Math.min(50,Math.max(0,t-(liveLast||t)));liveLast=t;formation=$('formation').value;let boss=foes.find(e=>e.boss&&e.h>0);if(boss&&!emergency&&boss.casts< (wave===5?1:3)&&t>=boss.castNext){emergency=true;emergencyBoss=boss;boss.casts++;shield=true;newLiveQuestion(t,true);news('魔王蓄力！10 秒內破解！');fx('bad')}
if(liveQuestion){let sec=Math.max(0,Math.ceil((deadline-t)/1000));$('status').textContent=(emergency?'⚠ 魔王必殺破解':'數學召喚挑戰')+' · '+sec+' 秒';if(emergency&&sec<=3&&sec!==lastCountdown){lastCountdown=sec;tone(720,.13,'square',.025)}if(t>=deadline)answer(-1)}else if(t>=pendingQuestion&&!emergency)newLiveQuestion(t);
if(!emergency){if(spawned<waveQuota&&t>=liveNext){liveEnemy();liveNext=t+($('level').selectedIndex?5000:8000);news('敵軍增援！')}let living=army.filter(a=>a.h>0);for(let e of foes.filter(e=>e.h>0)){if(t<(e.stun||0))continue;let target=living.filter(a=>a.h>0).sort((a,b)=>Math.abs(a.x-e.x)-Math.abs(b.x-e.x))[0];let range=e.t===2?145:48;if(target&&Math.abs(target.x-e.x)<=range){if(t>=e.next){e.next=t+950;target.h=Math.max(0,target.h-(e.boss?18:7+wave*.5)*difficulty()*(target.t===2?.55:1)*(formation==='guard'?.78:1)*(t<wardUntil?.3:1));}}else{e.x-=dt*(e.boss?.018:e.t===0?.048:.03)*(liveQuestion?.65:1);if(e.x<=100){e.x=100;if(t>=e.next){e.next=t+1300;hp=Math.max(0,hp-(e.boss?5:2)*difficulty());}}}}
if(t>=frozenUntil)for(let a of army.filter(a=>a.h>0)){let e=foes.filter(e=>e.h>0).sort((x,y)=>Math.abs(x.x-a.x)-Math.abs(y.x-a.x))[0];if(!e)continue;let r=roles[a.t];if(e.x-a.x>r.range)a.x+=Math.min(e.x-a.x-r.range,dt*.07);if(Math.abs(e.x-a.x)<=r.range+5&&t>=a.next){a.next=t+r.rate;a.pose=t;let targets=a.t===3?foes.filter(f=>f.h>0&&Math.abs(f.x-e.x)<65):[e];for(let f of targets){let damage=r.dmg*a.star*bonus*counter(a.t,f.t)*(formation==='rush'?1.22:formation==='arcane'&&[1,3].includes(a.t)?1.28:1)*(f.boss&&f.casts===0?.35:1);f.h=Math.max(0,f.h-damage);shots.push({x:a.x,y:a.y-42,ex:f.x,ey:f.y-35,t,kind:a.t})}if(a.t===5)army.filter(b=>b.h>0).forEach(b=>b.h=Math.min(b.max,b.h+5*a.star));}}}
if(hp<=0){hp=0;end(false);return}if(spawned>=waveQuota&&foes.every(e=>e.h<=0)&&!emergency){cleared++;if(wave===10){end(true);return}if(wave%3===0){reward();return}wave++;liveWave()}if(t%500<50){update();$('formation').disabled=false}}

requestAnimationFrame(draw);
