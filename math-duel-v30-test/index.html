<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學格鬥對決 V3.0｜華麗格鬥與配樂測試</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071327}iframe{border:0;display:block;width:100%;height:100%}#loading{position:absolute;inset:0;background:#071327;color:white;display:grid;place-items:center;font:700 18px system-ui;pointer-events:none}</style></head><body><div id="loading">數學格鬥對決 V3.0 載入中…</div><iframe id="game" src="../math-duel/" allow="autoplay; fullscreen" title="數學格鬥對決 V3.0"></iframe><script>const f=document.getElementById('game');f.addEventListener('load',()=>{try{const w=f.contentWindow,d=f.contentDocument;if(!d||!d.body)throw Error('no document');const script=d.createElement('script');script.textContent="(function upgrade(){\nconst doc=document;\nconst style=doc.createElement('style');\nstyle.textContent=`\n.music-status{display:none!important}\n.v3-audio{position:fixed;z-index:10050;left:10px;bottom:max(9px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #67dcec;border-radius:14px;background:#09243be8;color:#fff;font:700 13px system-ui;box-shadow:0 4px 18px #0008}\n.v3-audio button{border:0;background:#176279;border-radius:9px;color:white;padding:7px;cursor:pointer;font-size:13px}\n.v3-audio input{width:80px;accent-color:#56eddb}.v3-audio small{font-size:11px;font-weight:500;color:#b5fbed}\n#fight-stage.v3-shake{animation:v3shake .32s both}\n#fight-stage.v3-freeze .fighter-art,#fight-stage.v3-freeze .sheet-sprite{animation-play-state:paused!important}\n.v3-sparks{position:absolute;inset:0;z-index:31;pointer-events:none;overflow:hidden}\n.v3-sparks>i{position:absolute;left:50%;top:53%;width:var(--w);height:4px;border-radius:100%;background:var(--color);box-shadow:0 0 12px var(--color);transform:rotate(var(--a));animation:v3spark .68s ease-out forwards}\n.v3-impact{position:absolute;left:50%;top:50%;width:12px;height:12px;border:4px solid var(--color);box-shadow:0 0 25px var(--color),inset 0 0 20px var(--color);border-radius:50%;pointer-events:none;z-index:35;animation:v3ring .58s ease-out forwards}\n.v3-ghost{position:absolute;z-index:29;opacity:.45;filter:drop-shadow(0 0 15px var(--color)) saturate(1.5);pointer-events:none;animation:v3ghost .52s ease-out forwards;max-width:42%}\n.v3-cutin{position:absolute;z-index:45;inset:9% 4% 16%;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;background:linear-gradient(115deg,#02152add,#0003,#180423c7);border:2px solid var(--color);box-shadow:0 0 25px var(--color);color:#fff;font:900 clamp(24px,4vw,65px)/1.3 system-ui;text-shadow:0 3px 18px var(--color);transform:skew(-6deg);animation:v3cut 1.4s ease both}\n.v3-ko{position:absolute;inset:22% 8%;z-index:60;pointer-events:none;display:grid;place-items:center;font:1000 clamp(48px,10vw,140px) system-ui;color:#ffea85;text-shadow:0 0 10px red,0 0 40px #ff4500;animation:v3ko .95s ease-out forwards}\n#fighter-red.v3-victory,#fighter-blue.v3-victory{filter:drop-shadow(0 0 20px gold) brightness(1.18);transform:translateY(-8px) scale(1.06)}\n@keyframes v3shake{0%,100%{transform:translate(0)}15%{transform:translate(-7px,3px)}35%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}\n@keyframes v3spark{from{opacity:1;transform:rotate(var(--a)) translateX(6px)}to{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.3)}}\n@keyframes v3ring{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(23)}}\n@keyframes v3ghost{from{opacity:.45;transform:translateX(0) scale(1)}to{opacity:0;transform:translateX(var(--shift)) scale(1.14)}}\n@keyframes v3cut{0%{opacity:0;clip-path:inset(48% 0)}20%,72%{opacity:1;clip-path:inset(0)}100%{opacity:0;clip-path:inset(48% 0)}}\n@keyframes v3ko{0%{opacity:0;transform:scale(3)}35%{opacity:1;transform:scale(.9)}70%{opacity:1}100%{opacity:0;transform:scale(1.2)}}\n@media(prefers-reduced-motion:reduce){#fight-stage.v3-shake{animation:none}.v3-cutin,.v3-ghost,.v3-impact,.v3-sparks>i{animation-duration:.1s}}\n`;\ndoc.head.append(style);\nconst ui=doc.createElement('div');ui.className='v3-audio';ui.innerHTML='<button type=\"button\" id=\"v3-sound\">♫ 啟動配樂</button><input id=\"v3-volume\" type=\"range\" min=\"0\" max=\"100\" value=\"55\" aria-label=\"配樂音量\"><small id=\"v3-status\">待啟動</small>';doc.body.append(ui);\nconst button=ui.querySelector('button'),vol=ui.querySelector('input'),status=ui.querySelector('small');\nlet ac=null,master=null,seq=0,loop=null,musicOn=true;\nfunction statusUpdate(){let ok=ac&&ac.state==='running'&&musicOn&&loop&&!doc.hidden;status.textContent=ok?'播放中':(musicOn?'待點擊啟動':'已靜音');button.textContent=ok?'♫ 關閉配樂':'♫ 啟動配樂'}\nfunction note(freq,at,dur,gain,type='triangle'){if(!ac||!master)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),at+.025);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(master);o.start(at);o.stop(at+dur+.02)}\nfunction pulse(){if(!ac||ac.state!=='running'||!musicOn||doc.hidden)return;const melody=[293.66,392,440,523.25,440,392,329.63,349.23,293.66,392,523.25,587.33,523.25,440,392,329.63];const t=ac.currentTime+.025;note(melody[seq%16],t,.25,.18,'triangle');if(seq%4===0)note([146.83,174.61,196,164.81][Math.floor(seq/4)%4],t,.52,.22,'sawtooth');if(seq%2===0)note(880,t,.06,.025,'sine');seq++}\nasync function startAudio(){try{const Constructor=window.AudioContext||window.webkitAudioContext;if(!Constructor){status.textContent='此瀏覽器不支援';return}if(!ac){ac=new Constructor();master=ac.createGain();master.connect(ac.destination)}master.gain.value=Math.max(0,Number(vol.value)/100)*.48;musicOn=true;await ac.resume();if(!loop){pulse();loop=setInterval(pulse,255)}statusUpdate()}catch(e){status.textContent='請再點一次啟動'}}\nfunction stopAudio(){musicOn=false;if(loop){clearInterval(loop);loop=null}statusUpdate()}\nbutton.addEventListener('click',()=>{if(musicOn&&loop)stopAudio();else startAudio()});\nvol.addEventListener('input',()=>{if(master)master.gain.value=Number(vol.value)/100*.48;if(!loop&&musicOn)startAudio()});\nconst oldStartMusic=startMusic,oldStopMusic=stopMusic;\nstartMusic=function(){startAudio()};stopMusic=function(){stopAudio()};\ndoc.addEventListener('visibilitychange',()=>{if(doc.hidden){statusUpdate()}else if(musicOn){status.textContent='點擊恢復配樂'}});\ndoc.addEventListener('pointerdown',()=>{if(musicOn&&ac&&ac.state!=='running')startAudio()},{capture:true,passive:true});\nfunction enhanceFight(i){\nconst stage=doc.getElementById('fight-stage');if(!stage||!stage.isConnected)return;\nconst fighter=doc.getElementById('fighter-'+(i?'blue':'red'));if(!fighter)return;\nconst streak=state[i]?.streak||1;const ultimate=streak>=5&&streak%5===0;const power=!ultimate&&streak>=3&&streak%3===0;\nconst kind=ultimate?'終極必殺':power?'強力技':'普通三連擊';\nconst skill=i?(ultimate?'極冰・雷神降臨':power?'極冰雷霆斬':'冰晶瞬影三連擊'):(ultimate?'炎帝・隕星爆裂':power?'火龍昇天拳':'烈焰三連拳');\nconst color=i?'#78d5ff':'#ff993a';\nconst ground=stage.querySelector('.fighter-ground')||stage;\nstage.classList.remove('v3-shake','v3-freeze');void stage.offsetWidth;stage.classList.add('v3-shake','v3-freeze');\nsetTimeout(()=>stage.classList.remove('v3-freeze'),85);\nsetTimeout(()=>stage.classList.remove('v3-shake'),360);\nconst ring=doc.createElement('i');ring.className='v3-impact';ring.style.setProperty('--color',color);ground.append(ring);setTimeout(()=>ring.remove(),650);\nconst sparks=doc.createElement('div');sparks.className='v3-sparks';sparks.innerHTML=Array.from({length:ultimate?36:power?26:16},(_,k)=>'<i style=\"--a:'+Math.round(k*360/(ultimate?36:power?26:16))+'deg;--d:'+(75+k%7*22)+'px;--w:'+(8+k%5*4)+'px;--color:'+color+'\"></i>').join('');ground.append(sparks);setTimeout(()=>sparks.remove(),800);\nconst p=stage.getBoundingClientRect(),r=fighter.getBoundingClientRect();\nfor(let j=0;j<3;j++){const ghost=fighter.cloneNode(true);ghost.removeAttribute('id');ghost.className+=' v3-ghost';ghost.style.cssText='--color:'+color+';--shift:'+(i?-1:1)*(80+j*30)+'px;left:'+(r.left-p.left)+'px;top:'+(r.top-p.top)+'px;width:'+r.width+'px;height:'+r.height+'px;animation-delay:'+(j*55)+'ms';ground.append(ghost);setTimeout(()=>ghost.remove(),850)}\nif(power||ultimate){const cut=doc.createElement('div');cut.className='v3-cutin';cut.style.setProperty('--color',color);cut.textContent=(ultimate?'★ '+kind+' ★　':'⚡ ')+skill;ground.append(cut);setTimeout(()=>cut.remove(),1550)}\nif(ultimate){const rival=doc.getElementById('fighter-'+(i?'red':'blue'));rival?.classList.add('v3-knockback');setTimeout(()=>rival?.classList.remove('v3-knockback'),900)}\n}\nconst oldAttackFight=attackFight;\nattackFight=function(i){const won=oldAttackFight(i);try{enhanceFight(i);if(won){const stage=doc.getElementById('fight-stage');const ko=doc.createElement('div');ko.className='v3-ko';ko.textContent='K.O.!';stage.append(ko);setTimeout(()=>ko.remove(),1100)}}catch(e){console.warn('V3 FX:',e)}return won};\nconst oldFinish=finish;finish=function(){try{if(combat){const w=health[0]>health[1]?0:health[1]>health[0]?1:-1;if(w!==-1){doc.getElementById('fighter-'+(w?'blue':'red'))?.classList.add('v3-victory')}}}catch(e){}return oldFinish()};\nconst mark=doc.querySelector('#menu .tag');if(mark)mark.textContent='MATH • DUEL / V3.0 TEST';\nstatusUpdate();\n})()";d.body.append(script);document.getElementById('loading').remove()}catch(e){document.getElementById('loading').textContent='升級載入失敗：請重新整理';console.error(e)}});</script></body></html>
